<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Playbook - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Playbook-specific styles */
    .court-container {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      aspect-ratio: 1 / 1.05;
      background: linear-gradient(180deg, #C4853A 0%, #B5752A 100%);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .play-description {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.3;
      color: var(--text-secondary);
    }

    .play-steps {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .play-steps li {
      white-space: nowrap;
    }

    .play-steps li::before {
      content: counter(step) ". ";
      counter-increment: step;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Position Legend */
    .position-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 10px 16px;
      margin: 0 16px 12px;
      background: var(--bg-elevated);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-item strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Position Selector */
    .position-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      margin: 0 16px 8px;
      background: var(--bg-elevated);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .position-selector label {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .position-selector select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Highlighted player on court - cyan with pulse */
    .player-highlighted text {
      fill: #00BFFF !important;
      font-weight: 900 !important;
      font-size: 24px !important;
      animation: pulse-highlight 1.5s ease-in-out infinite;
    }

    @keyframes pulse-highlight {
      0%, 100% {
        fill: #00BFFF;
        filter: drop-shadow(0 0 4px #00BFFF);
      }
      50% {
        fill: #00FFFF;
        filter: drop-shadow(0 0 10px #00FFFF);
      }
    }

    .court-svg {
      width: 100%;
      height: 100%;
    }

    /* Court lines */
    .court-line {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 2;
    }

    .court-line-thin {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 1.5;
    }

    /* Player circles */
    .player {
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .player-circle {
      stroke: #000;
      stroke-width: 2;
    }

    .player-label {
      font-family: 'Oswald', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #000;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* Ball */
    .ball {
      fill: #FF6B35;
      stroke: #000;
      stroke-width: 1.5;
    }

    /* Action paths */
    .action-path {
      fill: none !important;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Ensure all paths in actions group have no fill */
    .actions-group path {
      fill: none !important;
    }

    .action-path.cut {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
    }

    .action-path.pass {
      stroke-dasharray: 8, 6;
    }

    .action-path.dribble {
      stroke-dasharray: 4, 4;
    }

    .action-path.screen {
      stroke-width: 6;
      stroke-linecap: square;
    }

    /* Arrow heads */
    .arrow-head {
      fill: currentColor;
    }

    /* Animation classes */
    .animate-path {
      animation: drawPath 1s ease-out forwards;
    }

    @keyframes drawPath {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .animate-move {
      animation: movePlayer 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Play card styling */
    .play-card {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .play-card-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .play-card-header h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #000;
    }

    .play-card-body {
      padding: 12px;
    }

    .replay-btn {
      background: rgba(0,0,0,0.2);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      color: #000;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .replay-btn:hover {
      background: rgba(0,0,0,0.3);
    }

    /* Phase indicator */
    .phase-indicator {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }

    .phase-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s;
    }

    .phase-dot.active {
      background: var(--gold);
      transform: scale(1.3);
    }

    /* Player legend */
    .player-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #000;
    }
  </style>

</head>

  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      const menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(() => { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayersArr, currentPlayerId) {
      if (!allPlayersArr || allPlayersArr.length <= 1) return;
      const switcher = document.getElementById('playerSwitcher');
      const buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayersArr.map(p => {
        const isActive = p.id === currentPlayerId;
        return `<button onclick="switchPlayer(${p.id})" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ${isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)'}; color: ${isActive ? '#000' : 'var(--text-primary)'}; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">#${p.number} ${p.firstName}</button>`;
      }).join('');
    }
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('profileBtnWrapper');
      const menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      const select = document.getElementById('emulateSelect');
      if (!select) return;
      const users = await getAllRosterUsers();
      const currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(u => {
          const selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return `<option value="${u.email}" ${selected ? 'selected' : ''}>${u.name} (${u.role}${u.player ? ' - ' + u.player : ''})</option>`;
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      const banner = document.getElementById('emulationBanner');
      const text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    // Position colors
    const positionColors = {
      1: '#FFD700',  // PG - Gold
      2: '#FFFFFF',  // SG - White
      3: '#60A5FA',  // SF - Blue
      4: '#F472B6',  // PF - Pink
      5: '#34D399'   // C - Green
    };

    const positionNames = {
      1: 'PG',
      2: 'SG',
      3: 'SF',
      4: 'PF',
      5: 'C'
    };

    // Position abbreviation to number mapping
    const positionToNumber = {
      'PG': 1,
      'SG': 2,
      'SF': 3,
      'PF': 4,
      'C': 5
    };

    let currentChapter = 'man';
    let playAnimations = {};
    let highlightedPosition = null;  // Position number to highlight (1-5)

    // Generate half-court SVG
    function generateCourtSVG() {
      // Court dimensions: 400x420 viewBox (scaled half-court)
      // NCAA half-court is 47ft x 50ft
      return `
        <svg class="court-svg" viewBox="0 0 400 420" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Arrow marker -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="currentColor" />
            </marker>
          </defs>

          <!-- Court background -->
          <rect x="0" y="0" width="400" height="420" fill="url(#courtGradient)" />
          <defs>
            <linearGradient id="courtGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#C4853A" />
              <stop offset="100%" style="stop-color:#B5752A" />
            </linearGradient>
          </defs>

          <!-- Court lines group -->
          <g class="court-lines">
            <!-- Boundary lines -->
            <rect x="20" y="20" width="360" height="380" class="court-line" rx="0" />

            <!-- Baseline -->
            <line x1="20" y1="20" x2="380" y2="20" class="court-line" />

            <!-- Paint / Key (12ft wide = ~86px, 19ft long = ~145px) -->
            <rect x="157" y="20" width="86" height="145" class="court-line" fill="none" />

            <!-- Free throw line -->
            <line x1="157" y1="165" x2="243" y2="165" class="court-line" />

            <!-- Free throw circle (6ft radius = ~46px) -->
            <circle cx="200" cy="165" r="46" class="court-line-thin" fill="none" />

            <!-- Restricted area arc (4ft radius = ~30px) -->
            <path d="M 170 20 A 30 30 0 0 0 230 20" class="court-line-thin" fill="none" />

            <!-- Backboard -->
            <line x1="175" y1="35" x2="225" y2="35" stroke="#666" stroke-width="4" />

            <!-- Rim -->
            <circle cx="200" cy="45" r="12" stroke="#FF6B35" stroke-width="3" fill="none" />

            <!-- 3-point arc (23.75ft = ~180px from basket center at y=45) -->
            <path d="M 30 20 L 30 100 A 180 180 0 0 0 370 100 L 370 20" class="court-line" fill="none" />

            <!-- Half-court line -->
            <line x1="20" y1="400" x2="380" y2="400" class="court-line" />

            <!-- Center circle (6ft radius) -->
            <path d="M 154 400 A 46 46 0 0 1 246 400" class="court-line-thin" fill="none" />

            <!-- Lane blocks (hash marks on paint) -->
            <line x1="157" y1="80" x2="147" y2="80" class="court-line-thin" />
            <line x1="243" y1="80" x2="253" y2="80" class="court-line-thin" />
            <line x1="157" y1="110" x2="147" y2="110" class="court-line-thin" />
            <line x1="243" y1="110" x2="253" y2="110" class="court-line-thin" />
            <line x1="157" y1="140" x2="147" y2="140" class="court-line-thin" />
            <line x1="243" y1="140" x2="253" y2="140" class="court-line-thin" />
          </g>

          <!-- Actions first (underneath), then players on top -->
          <g class="actions-group"></g>
          <g class="players-group"></g>
          <g class="ball-group"></g>
        </svg>
      `;
    }

    // Render a single play card
    function renderPlayCard(playId, play, index) {
      const card = document.createElement('div');
      card.className = 'play-card';
      card.id = `play-${playId}`;

      // Generate phase indicators for multi-phase plays
      const phaseCount = play.phases ? play.phases.length : 0;
      const phaseIndicators = phaseCount > 1 ?
        `<div class="phase-indicator" id="phases-${playId}">
          ${play.phases.map((_, i) => `<div class="phase-dot${i === 0 ? ' active' : ''}" data-phase="${i}"></div>`).join('')}
        </div>` : '';

      card.innerHTML = `
        <div class="play-card-header">
          <h3>${play.name}</h3>
          <button class="replay-btn" id="btn-${playId}" onclick="replayPlay('${playId}')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Go
          </button>
        </div>
        <div class="play-card-body">
          <div class="court-container" id="court-${playId}">
            ${generateCourtSVG()}
          </div>
          ${phaseIndicators}
          <div class="phase-description-text" id="phase-text-${playId}" style="text-align: center; font-size: 0.8rem; color: var(--text-secondary); min-height: 20px; margin-top: 8px;"></div>
          ${generatePlayDescription(play)}
        </div>
      `;

      return card;
    }

    // Generate full play description with steps
    function generatePlayDescription(play) {
      if (!play.phases || play.phases.length === 0) {
        return play.description ? `<p style="text-align: center; color: var(--text-secondary); font-size: 0.85rem; margin-top: 8px;">${play.description}</p>` : '';
      }

      // Check if phases have description arrays (detailed play from video)
      const hasPhaseDescriptions = play.phases.some(p => p.description && p.description.length > 0);

      if (hasPhaseDescriptions) {
        // Use provided phase descriptions
        let allDescriptions = [];
        play.phases.forEach((phase, i) => {
          if (phase.description && phase.description.length > 0) {
            phase.description.forEach(desc => {
              if (!allDescriptions.includes(desc)) {
                allDescriptions.push(desc);
              }
            });
          }
        });

        if (allDescriptions.length === 0) return '';

        return `
          <div class="play-description" style="counter-reset: step;">
            <ul class="play-steps" style="flex-direction: column; gap: 6px;">
              ${allDescriptions.map(desc => `<li style="white-space: normal;">${desc}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Fall back to auto-generating from actions
      let steps = [];
      play.phases.forEach((phase, i) => {
        if (i === 0) return; // Skip initial positioning phase

        phase.actions.forEach(action => {
          if (action.type === 'dribble') {
            steps.push(`${action.player} dribbles to the wing`);
          } else if (action.type === 'pass') {
            steps.push(`${action.from} passes to ${action.to}`);
          } else if (action.type === 'cut') {
            steps.push(`${action.player} cuts to the corner`);
          } else if (action.type === 'screen') {
            steps.push(`${action.player} sets screen`);
          } else if (action.type === 'shot') {
            steps.push(`${action.player} shoots`);
          }
        });
      });

      if (steps.length === 0) return '';

      return `
        <div class="play-description" style="counter-reset: step;">
          <ul class="play-steps">
            ${steps.map(step => `<li>${step}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    // Render players on the court (TheHoopsGeek style)
    function renderPlayers(svg, positions, ballHolder) {
      const playersGroup = svg.querySelector('.players-group');
      playersGroup.innerHTML = '';

      Object.entries(positions).forEach(([num, pos]) => {
        const player = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        player.classList.add('player');
        player.setAttribute('data-player', num);

        // Add highlighted class if this position is being tracked
        const isHighlighted = highlightedPosition && parseInt(num) === highlightedPosition;
        if (isHighlighted) {
          player.classList.add('player-highlighted');
        }

        // Ball holder gets a circle around their number
        const hasBall = parseInt(num) === ballHolder;

        player.innerHTML = `
          ${hasBall ? `<circle cx="${pos.x}" cy="${pos.y}" r="16" fill="none" stroke="${isHighlighted ? '#00BFFF' : '#333'}" stroke-width="${isHighlighted ? '3' : '2'}" />` : ''}
          <text x="${pos.x}" y="${pos.y}" class="player-label">${num}</text>
        `;
        playersGroup.appendChild(player);
      });

      // Clear ball group (we use circle around number instead)
      const ballGroup = svg.querySelector('.ball-group');
      ballGroup.innerHTML = '';
    }

    // Render static play overview (all actions visible at once - TheHoopsGeek style)
    function renderStaticPlay(playId, play) {
      const svg = document.querySelector(`#court-${playId} .court-svg`);
      if (!svg) return;

      // Use starting positions from first phase
      const startPositions = play.positions || (play.phases && play.phases[0].positions);
      const ball = play.ball || (play.phases && play.phases[0].ball);

      // Render players at starting positions
      renderPlayers(svg, startPositions, ball);

      // Draw all action paths for the entire play
      const actionsGroup = svg.querySelector('.actions-group');
      actionsGroup.innerHTML = '';

      if (!play.phases || play.phases.length <= 1) return;

      // Loop through each phase and draw its actions
      for (let i = 1; i < play.phases.length; i++) {
        const phase = play.phases[i];
        const prevPhase = play.phases[i - 1];

        if (!phase.actions) continue;

        phase.actions.forEach(action => {
          if (action.type === 'dribble') {
            // Squiggly dribble line - supports curved path or straight from/to
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

            if (action.path) {
              // Curved path - convert to squiggly
              const wavyPath = makeWavyPath(action.path, svg);
              path.setAttribute('d', wavyPath);
            } else {
              // Straight line with wavy effect
              const from = action.from || prevPhase.positions[action.player];
              const to = action.to || phase.positions[action.player];
              const wavyPath = createWavyPath(from.x, from.y, to.x, to.y);
              path.setAttribute('d', wavyPath);
            }

            path.setAttribute('stroke', '#333');
            path.setAttribute('stroke-width', '2.5');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', 'url(#arrowhead)');
            actionsGroup.appendChild(path);

          } else if (action.type === 'cut') {
            // Solid cut line with arrow (player movement without ball)
            // Support curved paths with 'path' property or straight line with from/to
            if (action.path) {
              // Curved path (SVG path string)
              const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              path.setAttribute('d', action.path);
              path.setAttribute('stroke', '#333');
              path.setAttribute('stroke-width', '2');
              path.setAttribute('fill', 'none');
              path.setAttribute('marker-end', 'url(#arrowhead)');
              actionsGroup.appendChild(path);
            } else {
              // Straight line
              const from = action.from || prevPhase.positions[action.player];
              const to = action.to || phase.positions[action.player];

              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', from.x);
              line.setAttribute('y1', from.y);
              line.setAttribute('x2', to.x);
              line.setAttribute('y2', to.y);
              line.style.stroke = '#333';
              line.style.strokeWidth = '2';
              line.setAttribute('marker-end', 'url(#arrowhead)');
              actionsGroup.appendChild(line);
            }

          } else if (action.type === 'pass') {
            // Dashed pass line from sender to receiver
            const fromPos = prevPhase.positions[action.from];
            const toPos = phase.positions[action.to];

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', fromPos.x);
            line.setAttribute('y1', fromPos.y);
            line.setAttribute('x2', toPos.x);
            line.setAttribute('y2', toPos.y);
            line.style.stroke = '#333';
            line.style.strokeWidth = '2';
            line.style.strokeDasharray = '8, 5';
            line.setAttribute('marker-end', 'url(#arrowhead)');
            actionsGroup.appendChild(line);

          } else if (action.type === 'shot') {
            // Shot line from player to target (rim)
            const from = prevPhase.positions[action.player];
            const to = action.target;

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', to.x);
            line.setAttribute('y2', to.y);
            line.style.stroke = '#333';
            line.style.strokeWidth = '2';
            line.style.strokeDasharray = '8, 5';
            line.setAttribute('marker-end', 'url(#arrowhead)');
            actionsGroup.appendChild(line);

            // Add X marker at rim to indicate shot target
            const cross1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            cross1.setAttribute('x1', to.x - 6);
            cross1.setAttribute('y1', to.y - 6);
            cross1.setAttribute('x2', to.x + 6);
            cross1.setAttribute('y2', to.y + 6);
            cross1.style.stroke = '#333';
            cross1.style.strokeWidth = '2';
            actionsGroup.appendChild(cross1);

            const cross2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            cross2.setAttribute('x1', to.x + 6);
            cross2.setAttribute('y1', to.y - 6);
            cross2.setAttribute('x2', to.x - 6);
            cross2.setAttribute('y2', to.y + 6);
            cross2.style.stroke = '#333';
            cross2.style.strokeWidth = '2';
            actionsGroup.appendChild(cross2);

          } else if (action.type === 'screen') {
            // Screen indicator - T-shape at screener's position
            // angle: 0=down, 90=right, 180=up, 270=left (direction screen faces)
            const screener = phase.positions[action.player];
            if (!screener) return; // Skip if position not found
            const angle = action.angle || 0;

            // If 'from' is provided, draw movement line WITHOUT arrowhead
            if (action.from) {
              const moveLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              moveLine.setAttribute('x1', action.from.x);
              moveLine.setAttribute('y1', action.from.y);
              moveLine.setAttribute('x2', screener.x);
              moveLine.setAttribute('y2', screener.y);
              moveLine.style.stroke = '#333';
              moveLine.style.strokeWidth = '2';
              moveLine.style.strokeLinecap = 'round';
              // NO marker-end (no arrowhead)
              actionsGroup.appendChild(moveLine);
            }

            // Create a group for the screen indicator and rotate it
            const screenGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const offsetX = action.offsetX || 0;
            const screenX = screener.x + offsetX;
            screenGroup.setAttribute('transform', `rotate(${angle}, ${screenX}, ${screener.y})`);

            // T-shape screen indicator (horizontal bar blocking the defender)
            const hBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            hBar.setAttribute('x1', screenX - 14);
            hBar.setAttribute('y1', screener.y + 12);
            hBar.setAttribute('x2', screenX + 14);
            hBar.setAttribute('y2', screener.y + 12);
            hBar.style.stroke = '#333';
            hBar.style.strokeWidth = '4';
            hBar.style.strokeLinecap = 'round';
            screenGroup.appendChild(hBar);

            // Vertical bar (stem of T - short line indicating direction)
            const vBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            vBar.setAttribute('x1', screenX);
            vBar.setAttribute('y1', screener.y + 12);
            vBar.setAttribute('x2', screenX);
            vBar.setAttribute('y2', screener.y + 22);
            vBar.style.stroke = '#333';
            vBar.style.strokeWidth = '4';
            vBar.style.strokeLinecap = 'round';
            screenGroup.appendChild(vBar);

            actionsGroup.appendChild(screenGroup);
          }
        });
      }

      // Render defenders if defined
      if (play.defenders) {
        const defendersGroup = svg.querySelector('.defenders-group') || (() => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.classList.add('defenders-group');
          svg.appendChild(g);
          return g;
        })();
        defendersGroup.innerHTML = '';

        Object.entries(play.defenders).forEach(([id, pos]) => {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

          // Red X
          const x1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          x1.setAttribute('x1', pos.x - 8);
          x1.setAttribute('y1', pos.y - 8);
          x1.setAttribute('x2', pos.x + 8);
          x1.setAttribute('y2', pos.y + 8);
          x1.style.stroke = '#DC2626';
          x1.style.strokeWidth = '3';
          g.appendChild(x1);

          const x2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          x2.setAttribute('x1', pos.x + 8);
          x2.setAttribute('y1', pos.y - 8);
          x2.setAttribute('x2', pos.x - 8);
          x2.setAttribute('y2', pos.y + 8);
          x2.style.stroke = '#DC2626';
          x2.style.strokeWidth = '3';
          g.appendChild(x2);

          // Subscript number
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', pos.x + 12);
          text.setAttribute('y', pos.y + 14);
          text.style.fill = '#DC2626';
          text.style.fontSize = '12px';
          text.style.fontWeight = '700';
          text.textContent = id;
          g.appendChild(text);

          defendersGroup.appendChild(g);
        });
      }
    }

    // Animate a play (show movements step by step)
    async function animatePlay(playId, play) {
      const svg = document.querySelector(`#court-${playId} .court-svg`);
      if (!svg) return;

      // Update button to show animation is playing
      const btn = document.getElementById(`btn-${playId}`);
      if (btn) {
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          Playing...
        `;
        btn.disabled = true;
      }

      // Clear any existing animation
      if (playAnimations[playId]) {
        clearTimeout(playAnimations[playId]);
      }

      // Clear actions
      const actionsGroup = svg.querySelector('.actions-group');
      actionsGroup.innerHTML = '';

      // Handle phase-based plays
      if (play.phases && play.phases.length > 0) {
        // Start at phase 1
        let currentPositions = play.phases[0].positions;
        renderPlayers(svg, currentPositions, play.phases[0].ball);

        // Update phase indicator
        updatePhaseIndicator(playId, 0);
        updatePhaseText(playId, play.phases[0].description);

        // Animate through each phase
        for (let i = 1; i < play.phases.length; i++) {
          await new Promise(resolve => {
            playAnimations[playId] = setTimeout(resolve, 400);
          });

          const phase = play.phases[i];
          const prevPhase = play.phases[i - 1];

          // Update phase indicator
          updatePhaseIndicator(playId, i);
          updatePhaseText(playId, phase.description);

          // Clear previous actions before drawing new ones
          actionsGroup.innerHTML = '';

          // Animate actions and player movements simultaneously
          await Promise.all([
            // All actions in this phase run together
            ...phase.actions.map(action =>
              animateAction(svg, action, prevPhase.positions, phase.positions)
            ),
            // Player movements happen at the same time (pass actions for curved paths)
            animatePlayerMovement(svg, prevPhase.positions, phase.positions, phase.ball, phase.actions)
          ]);
          currentPositions = phase.positions;

          await new Promise(resolve => {
            playAnimations[playId] = setTimeout(resolve, 400);
          });
        }
      } else {
        // Simple play with actions array
        const positions = play.positions;
        renderPlayers(svg, positions, play.ball);

        for (const action of (play.actions || [])) {
          await new Promise(resolve => {
            playAnimations[playId] = setTimeout(resolve, 400);
          });
          await animateAction(svg, action, positions, positions);
        }
      }

      // Animation complete - restore static view and update button to Replay
      await new Promise(resolve => setTimeout(resolve, 800));
      renderStaticPlay(playId, play);

      // Reset phase indicator to show all as inactive
      updatePhaseIndicator(playId, -1);
      // Clear phase text
      updatePhaseText(playId, null);

      if (btn) {
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 4v6h6"></path>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          Replay
        `;
        btn.disabled = false;
      }
    }

    // Animate a single action (dribble, pass, etc)
    async function animateAction(svg, action, fromPositions, toPositions) {
      const actionsGroup = svg.querySelector('.actions-group');

      if (action.type === 'dribble') {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

        if (action.path) {
          // Curved path - convert to squiggly
          const wavyPath = makeWavyPath(action.path, svg);
          path.setAttribute('d', wavyPath);
        } else {
          // Straight line with wavy effect
          const from = action.from || fromPositions[action.player];
          const to = action.to || toPositions[action.player];
          const wavyPath = createWavyPath(from.x, from.y, to.x, to.y);
          path.setAttribute('d', wavyPath);
        }

        path.setAttribute('stroke', '#333');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrowhead)');

        // Animate drawing
        const length = path.getTotalLength ? path.getTotalLength() : 300;
        path.setAttribute('stroke-dasharray', length);
        path.setAttribute('stroke-dashoffset', length);
        actionsGroup.appendChild(path);

        // Trigger animation
        await new Promise(resolve => setTimeout(resolve, 50));
        path.style.transition = 'stroke-dashoffset 0.8s ease-out';
        path.style.strokeDashoffset = '0';

        await new Promise(resolve => setTimeout(resolve, 800));
      } else if (action.type === 'pass') {
        const from = fromPositions[action.from];
        const to = toPositions[action.to];

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', from.x);
        line.setAttribute('y2', from.y);
        line.style.stroke = '#333';
        line.style.strokeWidth = '2';
        line.style.strokeDasharray = '8, 5';
        line.setAttribute('marker-end', 'url(#arrowhead)');
        actionsGroup.appendChild(line);

        // Animate line extending
        await new Promise(resolve => setTimeout(resolve, 50));
        line.style.transition = 'all 0.5s ease-out';
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);

        await new Promise(resolve => setTimeout(resolve, 500));
      } else if (action.type === 'cut') {
        // Player cut - solid line with arrow (player movement without ball)
        if (action.path) {
          // Use curved SVG path for cuts around screens
          const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          pathEl.setAttribute('d', action.path);
          pathEl.setAttribute('stroke', '#333');
          pathEl.setAttribute('stroke-width', '2');
          pathEl.setAttribute('fill', 'none');
          pathEl.classList.add('action-path');
          pathEl.setAttribute('marker-end', 'url(#arrowhead)');

          // Get path length for animation
          actionsGroup.appendChild(pathEl);
          const pathLength = pathEl.getTotalLength();

          // Set up dash animation (start hidden)
          pathEl.setAttribute('stroke-dasharray', pathLength);
          pathEl.setAttribute('stroke-dashoffset', pathLength);

          // Animate path drawing
          await new Promise(resolve => setTimeout(resolve, 50));
          pathEl.style.transition = 'stroke-dashoffset 0.6s ease-out';
          pathEl.setAttribute('stroke-dashoffset', '0');

          await new Promise(resolve => setTimeout(resolve, 600));
        } else {
          // Straight line for simple cuts
          const from = action.from || fromPositions[action.player];
          const to = action.to || toPositions[action.player];

          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', from.x);
          line.setAttribute('y1', from.y);
          line.setAttribute('x2', from.x);
          line.setAttribute('y2', from.y);
          line.style.stroke = '#333';
          line.style.strokeWidth = '2';
          line.setAttribute('marker-end', 'url(#arrowhead)');
          actionsGroup.appendChild(line);

          // Animate line extending
          await new Promise(resolve => setTimeout(resolve, 50));
          line.style.transition = 'all 0.5s ease-out';
          line.setAttribute('x2', to.x);
          line.setAttribute('y2', to.y);

          await new Promise(resolve => setTimeout(resolve, 500));
        }
      } else if (action.type === 'shot') {
        // Shot - dashed line from player to target (rim)
        const from = fromPositions[action.player];
        const to = action.target;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', from.x);
        line.setAttribute('y1', from.y);
        line.setAttribute('x2', from.x);
        line.setAttribute('y2', from.y);
        line.style.stroke = '#333';
        line.style.strokeWidth = '2';
        line.style.strokeDasharray = '8, 5';
        line.setAttribute('marker-end', 'url(#arrowhead)');
        actionsGroup.appendChild(line);

        // Animate line extending to target
        await new Promise(resolve => setTimeout(resolve, 50));
        line.style.transition = 'all 0.4s ease-out';
        line.setAttribute('x2', to.x);
        line.setAttribute('y2', to.y);

        await new Promise(resolve => setTimeout(resolve, 400));
      } else if (action.type === 'made') {
        // Made basket - concentric circles at rim
        const target = action.target;

        // Create bullseye/made basket indicator
        const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        outer.setAttribute('cx', target.x);
        outer.setAttribute('cy', target.y);
        outer.setAttribute('r', '0');
        outer.style.stroke = '#333';
        outer.style.strokeWidth = '2';
        outer.style.fill = 'none';
        actionsGroup.appendChild(outer);

        const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        inner.setAttribute('cx', target.x);
        inner.setAttribute('cy', target.y);
        inner.setAttribute('r', '0');
        inner.style.stroke = '#333';
        inner.style.strokeWidth = '2';
        inner.style.fill = 'none';
        actionsGroup.appendChild(inner);

        // Animate circles expanding
        await new Promise(resolve => setTimeout(resolve, 50));
        outer.style.transition = 'r 0.3s ease-out';
        outer.setAttribute('r', '18');

        await new Promise(resolve => setTimeout(resolve, 150));
        inner.style.transition = 'r 0.3s ease-out';
        inner.setAttribute('r', '8');

        await new Promise(resolve => setTimeout(resolve, 300));
      } else if (action.type === 'screen') {
        const screener = toPositions[action.player];
        if (screener) {
          const angle = action.angle || 0;

          // If 'from' is provided, draw movement line WITHOUT arrowhead
          if (action.from) {
            const moveLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            moveLine.setAttribute('x1', action.from.x);
            moveLine.setAttribute('y1', action.from.y);
            moveLine.setAttribute('x2', screener.x);
            moveLine.setAttribute('y2', screener.y);
            moveLine.style.stroke = '#333';
            moveLine.style.strokeWidth = '2';
            moveLine.style.strokeLinecap = 'round';
            actionsGroup.appendChild(moveLine);
          }

          // Create a group for the screen indicator and rotate it
          const screenGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const offsetX = action.offsetX || 0;
          const screenX = screener.x + offsetX;
          screenGroup.setAttribute('transform', `rotate(${angle}, ${screenX}, ${screener.y})`);
          screenGroup.style.opacity = '0';
          actionsGroup.appendChild(screenGroup);

          // T-shape screen indicator (horizontal bar blocking the defender)
          const hBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          hBar.setAttribute('x1', screenX - 14);
          hBar.setAttribute('y1', screener.y + 12);
          hBar.setAttribute('x2', screenX + 14);
          hBar.setAttribute('y2', screener.y + 12);
          hBar.style.stroke = '#333';
          hBar.style.strokeWidth = '4';
          hBar.style.strokeLinecap = 'round';
          screenGroup.appendChild(hBar);

          // Vertical bar (stem of T - short line indicating direction)
          const vBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          vBar.setAttribute('x1', screenX);
          vBar.setAttribute('y1', screener.y + 12);
          vBar.setAttribute('x2', screenX);
          vBar.setAttribute('y2', screener.y + 22);
          vBar.style.stroke = '#333';
          vBar.style.strokeWidth = '4';
          vBar.style.strokeLinecap = 'round';
          screenGroup.appendChild(vBar);

          // Animate fade in
          await new Promise(resolve => setTimeout(resolve, 50));
          screenGroup.style.transition = 'opacity 0.3s ease-out';
          screenGroup.style.opacity = '1';

          await new Promise(resolve => setTimeout(resolve, 300));
        }
      }
    }

    // Animate players moving from one position to another
    async function animatePlayerMovement(svg, fromPositions, toPositions, newBallHolder, actions = []) {
      const playersGroup = svg.querySelector('.players-group');
      let hasMovement = false;
      const pathAnimations = [];

      // Build a map of players with curved paths (cuts or dribbles)
      const playerPaths = {};
      actions.forEach(action => {
        if ((action.type === 'cut' || action.type === 'dribble') && action.path && action.player) {
          playerPaths[action.player] = action.path;
        }
      });

      // Apply transitions to move players
      Object.keys(toPositions).forEach(num => {
        const playerEl = playersGroup.querySelector(`[data-player="${num}"]`);
        if (!playerEl) return;

        const from = fromPositions[num];
        const to = toPositions[num];

        // Only animate if position changed
        if (from.x !== to.x || from.y !== to.y) {
          hasMovement = true;

          // Check if this player has a curved path
          if (playerPaths[num]) {
            // Animate along the curved path using JS and getPointAtLength
            const pathData = playerPaths[num];

            // Create temporary invisible path to sample points
            const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            tempPath.setAttribute('d', pathData);
            tempPath.setAttribute('fill', 'none');
            tempPath.setAttribute('stroke', 'none');
            tempPath.style.visibility = 'hidden';
            svg.appendChild(tempPath);
            const pathLength = tempPath.getTotalLength();

            // Animate player along the path
            const duration = 600;
            const startTime = performance.now();

            const animateAlongPath = () => {
              const elapsed = performance.now() - startTime;
              const progress = Math.min(elapsed / duration, 1);
              // Ease in-out
              const eased = progress < 0.5
                ? 2 * progress * progress
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;

              const point = tempPath.getPointAtLength(eased * pathLength);
              playerEl.setAttribute('transform', `translate(${point.x}, ${point.y})`);

              if (progress < 1) {
                requestAnimationFrame(animateAlongPath);
              } else {
                // Clean up temp path
                svg.removeChild(tempPath);
              }
            };

            requestAnimationFrame(animateAlongPath);
          } else {
            // Straight line movement using CSS transition
            playerEl.style.transition = 'transform 0.6s ease-in-out';
            playerEl.style.transform = `translate(${to.x - from.x}px, ${to.y - from.y}px)`;
          }
        }
      });

      // Wait for animation to complete before re-rendering
      if (hasMovement) {
        await new Promise(resolve => setTimeout(resolve, 600));
      }

      // Now redraw players at final positions (resets transforms and animations)
      renderPlayers(svg, toPositions, newBallHolder);
    }

    // Create wavy path for dribble (straight line version)
    function createWavyPath(x1, y1, x2, y2) {
      const segments = 10;
      const amplitude = 6;
      let path = `M${x1},${y1}`;

      for (let i = 1; i <= segments; i++) {
        const t = i / segments;
        const x = x1 + (x2 - x1) * t;
        const y = y1 + (y2 - y1) * t;
        // Perpendicular offset for wavy effect
        const dx = -(y2 - y1);
        const dy = (x2 - x1);
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const offset = (i % 2 === 0 ? 1 : -1) * amplitude;
        const px = x + (dx / len) * offset;
        const py = y + (dy / len) * offset;
        path += ` L${px.toFixed(1)},${py.toFixed(1)}`;
      }

      return path;
    }

    // Convert an SVG path to a squiggly/wavy dribble path
    function makeWavyPath(svgPath, svg) {
      // Create temporary path to sample points
      const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      tempPath.setAttribute('d', svgPath);
      tempPath.style.visibility = 'hidden';
      svg.appendChild(tempPath);

      const totalLength = tempPath.getTotalLength();
      const segments = Math.max(20, Math.floor(totalLength / 8));  // More segments for smoother curve
      const amplitude = 5;  // Squiggle amplitude

      let wavyPath = '';

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const point = tempPath.getPointAtLength(t * totalLength);

        // Get direction at this point (tangent)
        const delta = 0.1;
        const nextT = Math.min(1, t + delta / segments);
        const nextPoint = tempPath.getPointAtLength(nextT * totalLength);

        // Calculate perpendicular direction
        const dx = nextPoint.x - point.x;
        const dy = nextPoint.y - point.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;

        // Perpendicular offset (alternating)
        const offset = (i % 2 === 0 ? 1 : -1) * amplitude;
        const px = point.x + (-dy / len) * offset;
        const py = point.y + (dx / len) * offset;

        if (i === 0) {
          wavyPath = `M${px.toFixed(1)},${py.toFixed(1)}`;
        } else {
          wavyPath += ` L${px.toFixed(1)},${py.toFixed(1)}`;
        }
      }

      svg.removeChild(tempPath);
      return wavyPath;
    }

    // Animate a single action
    function animateSingleAction(svg, action, positions, index) {
      const actionsGroup = svg.querySelector('.actions-group');

      if (action.type === 'dribble' && action.path) {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const wavyPath = makeWavyPath(action.path, svg);
        path.setAttribute('d', wavyPath);
        path.setAttribute('stroke', '#333');
        path.setAttribute('stroke-width', '2.5');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        // Animate drawing
        const length = path.getTotalLength ? path.getTotalLength() : 200;
        path.setAttribute('stroke-dasharray', length);
        path.setAttribute('stroke-dashoffset', length);
        path.style.animation = 'drawPath 0.6s ease-out forwards';
        actionsGroup.appendChild(path);
      } else if (action.type === 'cut' && action.path) {
        // Curved cut path - animate drawing along the path
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', action.path);
        path.setAttribute('stroke', '#333');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        // Animate drawing the path
        const length = path.getTotalLength ? path.getTotalLength() : 200;
        path.setAttribute('stroke-dasharray', length);
        path.setAttribute('stroke-dashoffset', length);
        path.style.animation = 'drawPath 0.6s ease-out forwards';
        actionsGroup.appendChild(path);
      } else if (action.type === 'pass' && action.from && action.to) {
        const fromPos = action.fromPos || positions[action.from];
        const toPos = positions[action.to];
        if (fromPos && toPos) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', fromPos.x);
          line.setAttribute('y1', fromPos.y);
          line.setAttribute('x2', fromPos.x);
          line.setAttribute('y2', fromPos.y);
          line.style.stroke = '#333';
          line.style.strokeWidth = '2';
          line.style.strokeDasharray = '6, 4';
          line.setAttribute('marker-end', 'url(#arrowhead)');
          actionsGroup.appendChild(line);
          // Animate line to endpoint
          setTimeout(() => {
            line.setAttribute('x2', toPos.x);
            line.setAttribute('y2', toPos.y);
            line.style.transition = 'all 0.4s ease-out';
          }, 50);
        }
      } else if (action.type === 'screen') {
        const screener = positions[action.player];
        if (screener) {
          const angle = action.angle || 0;

          // If 'from' is provided, draw movement line WITHOUT arrowhead
          if (action.from) {
            const moveLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            moveLine.setAttribute('x1', action.from.x);
            moveLine.setAttribute('y1', action.from.y);
            moveLine.setAttribute('x2', screener.x);
            moveLine.setAttribute('y2', screener.y);
            moveLine.style.stroke = '#333';
            moveLine.style.strokeWidth = '2';
            moveLine.style.strokeLinecap = 'round';
            actionsGroup.appendChild(moveLine);
          }

          // Create a group for the screen indicator and rotate it
          const screenGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const offsetX = action.offsetX || 0;
          const screenX = screener.x + offsetX;
          screenGroup.setAttribute('transform', `rotate(${angle}, ${screenX}, ${screener.y})`);
          screenGroup.style.opacity = '0';
          screenGroup.style.animation = 'fadeIn 0.3s ease-out forwards';
          actionsGroup.appendChild(screenGroup);

          // T-shape screen indicator (horizontal bar blocking the defender)
          const hBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          hBar.setAttribute('x1', screenX - 14);
          hBar.setAttribute('y1', screener.y + 12);
          hBar.setAttribute('x2', screenX + 14);
          hBar.setAttribute('y2', screener.y + 12);
          hBar.style.stroke = '#333';
          hBar.style.strokeWidth = '4';
          hBar.style.strokeLinecap = 'round';
          screenGroup.appendChild(hBar);

          // Vertical bar (stem of T - short line indicating direction)
          const vBar = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          vBar.setAttribute('x1', screenX);
          vBar.setAttribute('y1', screener.y + 12);
          vBar.setAttribute('x2', screenX);
          vBar.setAttribute('y2', screener.y + 22);
          vBar.style.stroke = '#333';
          vBar.style.strokeWidth = '4';
          vBar.style.strokeLinecap = 'round';
          screenGroup.appendChild(vBar);
        }
      }
    }

    // Update phase indicator dots
    function updatePhaseIndicator(playId, activePhase) {
      const container = document.getElementById(`phases-${playId}`);
      if (!container) return;

      container.querySelectorAll('.phase-dot').forEach((dot, i) => {
        if (i === activePhase) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });
    }

    // Update phase description text
    function updatePhaseText(playId, descriptions) {
      const textEl = document.getElementById(`phase-text-${playId}`);
      if (!textEl) return;

      if (descriptions && descriptions.length > 0) {
        textEl.innerHTML = descriptions.map(d => `<div>${d}</div>`).join('');
      } else {
        textEl.innerHTML = '';
      }
    }

    // Replay a play (animate it)
    function replayPlay(playId) {
      const play = plays[playId];
      if (play) {
        animatePlay(playId, play);
      }
    }

    // Render all plays for current chapter
    function renderPlays() {
      const container = document.getElementById('plays-container');
      container.innerHTML = '';

      const chapterPlays = Object.entries(plays).filter(([id, play]) => play.chapter === currentChapter);

      if (chapterPlays.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 40px;">No plays in this chapter yet.</p>';
        return;
      }

      chapterPlays.forEach(([playId, play], index) => {
        const card = renderPlayCard(playId, play, index);
        container.appendChild(card);

        // Render static diagram (all actions visible)
        setTimeout(() => {
          renderStaticPlay(playId, play);
          applyHighlighting();
        }, 100);
      });
    }

    // Set highlighted position and update all courts
    function setHighlightPosition(position) {
      highlightedPosition = position ? parseInt(position) : null;
      // Hide the auto-detected label when user manually changes
      document.getElementById('auto-position-label').style.display = 'none';
      // Re-render plays to apply highlighting
      renderPlays();
    }

    // Apply highlighting to all player elements on all courts
    function applyHighlighting() {
      document.querySelectorAll('.players-group .player').forEach(player => {
        const playerNum = player.getAttribute('data-player');
        if (highlightedPosition && parseInt(playerNum) === highlightedPosition) {
          player.classList.add('player-highlighted');
        } else {
          player.classList.remove('player-highlighted');
        }
      });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      // Require auth - viewers can't see playbook
      requireAuth({ requireParent: true }).then(async function(userInfo) {
        // Show profile button
        const profileWrapper = document.getElementById('profileBtnWrapper');
        if (profileWrapper) profileWrapper.style.display = 'block';
        document.getElementById('profileName').textContent = userInfo.name || 'User';
        document.getElementById('profileEmail').textContent = auth.currentUser.email;
        if (userInfo.allPlayers && userInfo.allPlayers.length > 1) {
          populatePlayerSwitcher(userInfo.allPlayers, userInfo.player ? userInfo.player.id : null);
        }
        // Show emulation controls for admin
        if (userInfo.isRealAdmin) {
          const emulateSection = document.getElementById('emulateSection');
          if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
        }
        if (userInfo.isEmulating) { showEmulationBanner(userInfo.emulatedEmail); }

        // Tab switching
        document.querySelectorAll('.section-tab').forEach(tab => {
          tab.addEventListener('click', function() {
            document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentChapter = this.dataset.chapter;
            renderPlays();
            // Re-apply highlighting after rendering new plays
            setTimeout(applyHighlighting, 150);
          });
        });

        renderPlays();

        // Auto-detect user's position
        if (userInfo && userInfo.player && userInfo.player.position) {
          const posNum = positionToNumber[userInfo.player.position];
          if (posNum) {
            // Set the dropdown and highlight
            const select = document.getElementById('highlight-position');
            select.value = posNum.toString();
            highlightedPosition = posNum;

            // Show label with player name
            const label = document.getElementById('auto-position-label');
            label.textContent = `(${userInfo.player.firstName}'s position)`;
            label.style.display = 'inline';

            // Re-render plays with highlighting
            renderPlays();
          }
        }
      }).catch(function(err) {
        console.log('Auth required:', err);
      });
    });

  </script>
