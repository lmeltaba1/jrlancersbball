<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Messages - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .tab-bar {
      display: flex;
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 4px;
      margin: 16px;
      margin-bottom: 0;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: white;
      color: black;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .messages-main { padding: 16px; padding-bottom: 140px; }

    /* Posts */
    .post-card {
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .post-author { font-weight: 700; color: var(--lancers-gold); }
    .post-time { font-size: 0.8rem; color: var(--text-muted); }
    .post-text { color: var(--text-primary); line-height: 1.5; }
    .new-post-btn {
      width: 100%;
      padding: 12px;
      background: var(--bg-elevated);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }

    /* Chat */
    .chat-messages { display: flex; flex-direction: column; gap: 8px; }
    .unread-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--lancers-gold);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin: 16px 0;
    }
    .unread-divider::before,
    .unread-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--lancers-gold);
    }
    .chat-message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; }
    .chat-message.sent { align-self: flex-end; background: white; color: black; }
    .chat-message.received { align-self: flex-start; background: var(--bg-elevated); color: var(--text-primary); }
    .chat-message .sender { font-weight: 700; font-size: 0.75rem; margin-bottom: 4px; color: var(--lancers-gold); }
    .chat-message.sent .sender { color: rgba(0,0,0,0.6); }
    .chat-message .time { font-size: 0.7rem; margin-top: 4px; opacity: 0.6; }
    .chat-input-fixed {
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 576px;
      display: flex; gap: 10px;
      background: var(--bg-elevated);
      padding: 10px; border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 100;
    }
    .chat-input-fixed input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 24px; font-size: 16px; background: var(--bg-body); color: var(--text-primary); }
    .chat-input-fixed button { width: 44px; height: 44px; border-radius: 50%; background: white; color: black; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Contacts */
    .contact-section-header { font-weight: 600; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin: 16px 0 8px; }
    .contact-card { display: flex; justify-content: space-between; align-items: center; background: var(--bg-elevated); padding: 14px 16px; border-radius: 12px; margin-bottom: 8px; }
    .contact-info h4 { margin: 0 0 2px 0; color: var(--text-primary); }
    .contact-info span { color: var(--text-secondary); font-size: 0.85rem; }
    .text-btn { padding: 8px 16px; background: var(--lancers-gold); color: black; border: none; border-radius: 20px; font-weight: 600; text-decoration: none; }
    .search-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-elevated); color: var(--text-primary); font-size: 1rem; margin-bottom: 16px; }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: var(--bg-card); border-radius: 16px;
      width: 100%; max-width: 500px; max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border-bottom: 1px solid var(--border-color);
    }
    .modal-header h3 { margin: 0; color: var(--lancers-gold); }
    .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; padding: 0; }
    .modal-body { padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border-color);
      border-radius: 8px; background: var(--bg-elevated); color: var(--text-primary);
      font-size: 1rem; font-family: inherit;
    }
    .form-group textarea { min-height: 120px; resize: vertical; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: flex-end; }
    .btn-cancel { padding: 10px 20px; background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); cursor: pointer; font-weight: 600; }
    .btn-submit { padding: 10px 20px; background: var(--lancers-gold); border: none; border-radius: 8px; color: black; cursor: pointer; font-weight: 600; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Post Detail */
    .post-card { cursor: pointer; transition: transform 0.1s; }
    .post-card:active { transform: scale(0.98); }
    .comment { padding: 12px; background: var(--bg-elevated); border-radius: 8px; margin-bottom: 8px; }
    .comment-author { font-weight: 600; color: var(--lancers-gold); font-size: 0.85rem; }
    .comment-text { margin-top: 4px; color: var(--text-primary); }
    .comment-time { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .comments-section { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .comments-header { font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; }
    .add-comment { display: flex; gap: 10px; margin-top: 12px; }
    .add-comment input { flex: 1; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 20px; background: var(--bg-elevated); color: var(--text-primary); font-size: 0.9rem; }
    .add-comment button { padding: 10px 16px; background: var(--lancers-gold); border: none; border-radius: 20px; color: black; font-weight: 600; cursor: pointer; }
    .pinned-badge { display: inline-block; background: var(--lancers-gold); color: black; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
  </style>
  <link rel="icon" type="image/png" href="images/lancers-logo-192.png">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1 style="display: flex; align-items: center; gap: 10px;">
        <a onclick="history.back()" style="color: white; cursor: pointer; display: flex; align-items: center;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 24px; height: 24px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.jpg?v=2" alt="Lancers" class="header-logo">
          Messages
        </a>
      </h1>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        </button>
        <div id="profileBtnWrapper" style="position: relative; display: none;">
          <button id="profileBtn" onclick="toggleProfileMenu()" style="background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          <div id="profileMenu" style="display: none; position: absolute; top: 44px; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
              <div id="profileName" style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">User</div>
              <div id="profileEmail" style="font-size: 0.8rem; color: var(--text-secondary); word-break: break-all;"></div>
            </div>
            <div id="playerSwitcher" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Switch Player</div>
              <div id="playerSwitcherButtons"></div>
            </div>
            <!-- Emulate User (admin only) -->
            <div id="emulateSection" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Emulate User</div>
              <select id="emulateSelect" onchange="emulateUser(this.value)" style="width: 100%; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem;">
                <option value="">-- Select User --</option>
              </select>
            </div>
            <div style="padding: 8px;">
              <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: transparent; border: none; color: #EF4444; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Emulation Banner (shown when admin is emulating another user) -->
  <div id="emulationBanner" style="display: none; background: #7C3AED; color: white; padding: 8px 16px; text-align: center; font-size: 0.85rem; font-weight: 600;">
    <span id="emulationText">Viewing as: </span>
    <button onclick="stopEmulation()" style="background: white; color: #7C3AED; border: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; margin-left: 12px; cursor: pointer;">Stop</button>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar" id="tabBar" style="display:none;">
    <button class="tab-btn" onclick="switchTab('posts')">Posts</button>
    <button class="tab-btn active" onclick="switchTab('chat')">Group Chat</button>
    <button class="tab-btn" onclick="switchTab('text')">Text</button>
  </div>

  <main class="main-content messages-main">
    <div id="loadingState" class="card" style="text-align: center; padding: 40px;">
      <div class="spinner" style="margin: 0 auto;"></div>
    </div>

    <div id="authRequired" class="card" style="display: none;">
      <h2 class="card-title">Sign In Required</h2>
      <p style="margin-bottom: 16px; color: var(--text-secondary);">You need to sign in to access Messages.</p>
      <a href="login.html" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">Sign In</a>
    </div>

    <!-- Posts Tab -->
    <div id="postsTab" class="tab-content">
      <button class="new-post-btn" id="newPostBtn" style="display:none;" onclick="openNewPostModal()">+ New Post</button>
      <div id="postsList"></div>
      <div id="postsEmpty" class="empty-state" style="display:none;">
        <p>No posts yet</p>
        <p style="font-size: 0.85rem;">Check back later for team announcements</p>
      </div>
    </div>

    <!-- Chat Tab -->
    <div id="chatTab" class="tab-content">
      <div style="background: var(--bg-elevated); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">Chatting as: <strong id="chatUserName" style="color: var(--lancers-gold);"></strong></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>

    <!-- Text Tab -->
    <div id="textTab" class="tab-content">
      <input type="text" class="search-input" id="contactSearch" placeholder="Search people..." oninput="filterContacts()">
      <div id="contactsList"></div>
    </div>
  </main>

  <div class="chat-input-fixed" id="chatInputContainer" style="display: none;">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- New Post Modal -->
  <div class="modal-overlay" id="newPostModal" style="display: none;" onclick="if(event.target===this)closeNewPostModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3>New Post</h3>
        <button class="modal-close" onclick="closeNewPostModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="postTitle" placeholder="Enter post title...">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="postContent" placeholder="Write your announcement..."></textarea>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="postPinned" style="width: auto;">
            Pin this post to top
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeNewPostModal()">Cancel</button>
        <button class="btn-submit" id="submitPostBtn" onclick="submitNewPost()">Post</button>
      </div>
    </div>
  </div>

  <!-- Post Detail Modal -->
  <div class="modal-overlay" id="postDetailModal" style="display: none;" onclick="if(event.target===this)closePostDetail()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="detailPostTitle">Post</h3>
        <button class="modal-close" onclick="closePostDetail()">&times;</button>
      </div>
      <div class="modal-body" id="postDetailBody">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      var menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(function() { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayers, currentPlayerId) {
      if (!allPlayers || allPlayers.length <= 1) return;
      var switcher = document.getElementById('playerSwitcher');
      var buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayers.map(function(p) {
        var isActive = p.id === currentPlayerId;
        return '<button onclick="switchPlayer(' + p.id + ')" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ' + (isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)') + '; color: ' + (isActive ? '#000' : 'var(--text-primary)') + '; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ' + (isActive ? '600' : '400') + ';">#' + p.number + ' ' + p.firstName + '</button>';
      }).join('');
    }
    document.addEventListener('click', function(e) {
      var wrapper = document.getElementById('profileBtnWrapper');
      var menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      var select = document.getElementById('emulateSelect');
      if (!select) return;
      var users = await getAllRosterUsers();
      var currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(function(u) {
          var selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return '<option value="' + u.email + '" ' + (selected ? 'selected' : '') + '>' + u.name + ' (' + u.role + (u.player ? ' - ' + u.player : '') + ')</option>';
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      var banner = document.getElementById('emulationBanner');
      var text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    var currentUser = null;
    var currentUserInfo = null;
    var displayName = '';
    var rosterData = null;
    var currentTab = 'chat';
    var effectiveEmail = ''; // Email to use for chat (emulated or real)

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
      document.getElementById('chatInputContainer').style.display = (tab === 'chat') ? 'flex' : 'none';
    }

    function formatTime(ts) {
      if (!ts) return '';
      var d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    function formatTimeAgo(ts) {
      if (!ts) return '';
      var d = ts.toDate ? ts.toDate() : new Date(ts);
      var diff = Math.floor((new Date() - d) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm';
      if (diff < 86400) return Math.floor(diff/3600) + 'h';
      return Math.floor(diff/86400) + 'd';
    }

    function escapeHtml(t) {
      var d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    var postsCache = {}; // Store posts for detail view
    var unsubscribePosts = null;
    var unsubscribeMessages = null;

    function loadPosts() {
      if (!db) return;
      // Order by pinned first, then by timestamp
      unsubscribePosts = db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(function(snap) {
        var list = document.getElementById('postsList');
        var empty = document.getElementById('postsEmpty');
        if (snap.empty) {
          list.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';
        postsCache = {};

        // Sort: pinned first, then by date
        var posts = [];
        snap.forEach(function(doc) {
          posts.push({ id: doc.id, data: doc.data() });
        });
        posts.sort(function(a, b) {
          if (a.data.pinned && !b.data.pinned) return -1;
          if (!a.data.pinned && b.data.pinned) return 1;
          return 0; // Keep timestamp order within same pinned status
        });

        list.innerHTML = '';
        posts.forEach(function(post) {
          var p = post.data;
          postsCache[post.id] = p;
          var div = document.createElement('div');
          div.className = 'post-card';
          div.onclick = function() { openPostDetail(post.id); };
          var html = '<div class="post-header"><span class="post-author">' + escapeHtml(p.authorName || 'Coach');
          if (p.pinned) html += '<span class="pinned-badge">PINNED</span>';
          html += '</span><span class="post-time">' + formatTimeAgo(p.timestamp) + '</span></div>';
          if (p.title) {
            html += '<div style="font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--text-primary);">' + escapeHtml(p.title) + '</div>';
          }
          // Truncate long posts in list view
          var text = p.text || '';
          if (text.length > 200) text = text.substring(0, 200) + '...';
          html += '<div class="post-text" style="white-space: pre-wrap;">' + escapeHtml(text) + '</div>';
          html += '<div style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted);">Tap to view comments</div>';
          div.innerHTML = html;
          list.appendChild(div);
        });
      });
    }

    // New Post Modal
    function openNewPostModal() {
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('postPinned').checked = false;
      document.getElementById('newPostModal').style.display = 'flex';
    }

    function closeNewPostModal() {
      document.getElementById('newPostModal').style.display = 'none';
    }

    function submitNewPost() {
      var title = document.getElementById('postTitle').value.trim();
      var content = document.getElementById('postContent').value.trim();
      var pinned = document.getElementById('postPinned').checked;

      if (!content) {
        alert('Please enter a message');
        return;
      }

      // Input length limits
      if (title.length > 200) {
        alert('Title is too long (max 200 characters)');
        return;
      }
      if (content.length > 5000) {
        alert('Post is too long (max 5000 characters)');
        return;
      }

      var btn = document.getElementById('submitPostBtn');
      btn.disabled = true;
      btn.textContent = 'Posting...';

      db.collection('posts').add({
        title: title,
        text: content,
        authorName: displayName,
        authorEmail: effectiveEmail,
        timestamp: getFirestoreTimestamp(),
        pinned: pinned
      }).then(function() {
        closeNewPostModal();
        btn.disabled = false;
        btn.textContent = 'Post';
      }).catch(function(err) {
        alert('Error creating post: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Post';
      });
    }

    // Post Detail Modal
    var currentPostId = null;

    function openPostDetail(postId) {
      currentPostId = postId;
      var p = postsCache[postId];
      if (!p) return;

      document.getElementById('detailPostTitle').textContent = p.title || 'Post';

      var body = document.getElementById('postDetailBody');
      var html = '<div class="post-header"><span class="post-author">' + escapeHtml(p.authorName || 'Coach') + '</span><span class="post-time">' + formatTimeAgo(p.timestamp) + '</span></div>';
      html += '<div class="post-text" style="white-space: pre-wrap; margin-top: 12px;">' + escapeHtml(p.text || '') + '</div>';
      html += '<div class="comments-section"><div class="comments-header">Comments</div><div id="commentsList"><div style="color: var(--text-muted); font-size: 0.9rem;">Loading...</div></div>';
      html += '<div class="add-comment"><input type="text" id="commentInput" placeholder="Add a comment..."><button onclick="submitComment()">Send</button></div></div>';
      body.innerHTML = html;

      // Add enter key handler for comment input
      setTimeout(function() {
        var input = document.getElementById('commentInput');
        if (input) {
          input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitComment();
          });
        }
      }, 0);

      document.getElementById('postDetailModal').style.display = 'flex';
      loadComments(postId);
    }

    function closePostDetail() {
      document.getElementById('postDetailModal').style.display = 'none';
      currentPostId = null;
    }

    function loadComments(postId) {
      db.collection('posts').doc(postId).collection('comments').orderBy('timestamp', 'asc').get().then(function(snap) {
        var list = document.getElementById('commentsList');
        if (snap.empty) {
          list.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">No comments yet. Be the first!</div>';
          return;
        }
        list.innerHTML = '';
        snap.forEach(function(doc) {
          var c = doc.data();
          var div = document.createElement('div');
          div.className = 'comment';
          div.innerHTML = '<div class="comment-author">' + escapeHtml(c.author || 'Anonymous') + '</div>' +
                          '<div class="comment-text">' + escapeHtml(c.text || '') + '</div>' +
                          '<div class="comment-time">' + formatTimeAgo(c.timestamp) + '</div>';
          list.appendChild(div);
        });
      });
    }

    function submitComment() {
      var input = document.getElementById('commentInput');
      var text = input.value.trim();
      if (!text || !currentPostId) return;

      // Comment length limit
      if (text.length > 500) {
        alert('Comment is too long (max 500 characters)');
        return;
      }

      input.disabled = true;
      db.collection('posts').doc(currentPostId).collection('comments').add({
        author: displayName,
        authorEmail: effectiveEmail,
        text: text,
        timestamp: getFirestoreTimestamp()
      }).then(function() {
        input.value = '';
        input.disabled = false;
        loadComments(currentPostId);
      }).catch(function(err) {
        alert('Error adding comment: ' + err.message);
        input.disabled = false;
      });
    }

    var chatInitialLoadComplete = false;
    var lastReadMessageId = null;
    var unreadDividerAdded = false;

    async function getLastReadMessageId() {
      if (!currentUser || !db) return null;
      try {
        var doc = await db.collection('chatReadStatus').doc(currentUser.uid).get();
        if (doc.exists) {
          return doc.data().lastReadMessageId;
        }
      } catch (e) {
        console.error('Error getting last read:', e);
      }
      return null;
    }

    async function saveLastReadMessageId(messageId) {
      if (!currentUser || !db || !messageId) return;
      try {
        await db.collection('chatReadStatus').doc(currentUser.uid).set({
          lastReadMessageId: messageId,
          lastReadAt: getFirestoreTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error('Error saving last read:', e);
      }
    }

    function addUnreadDivider(container, hasNewMessages) {
      if (unreadDividerAdded) return;
      var div = document.createElement('div');
      div.className = 'unread-divider';
      div.id = 'unreadDivider';
      div.textContent = hasNewMessages ? 'New Messages' : 'Last Read';
      container.appendChild(div);
      unreadDividerAdded = true;
    }

    async function loadChat() {
      if (!db) return;

      // Get last read message ID before loading messages
      lastReadMessageId = await getLastReadMessageId();
      var isFirstSnapshot = true;
      var foundLastRead = false;
      var latestMessageId = null;

      unsubscribeMessages = db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(function(snap) {
        var container = document.getElementById('chatMessages');

        snap.docChanges().forEach(function(change) {
          if (change.type === 'added') {
            var m = change.doc.data();
            var messageId = change.doc.id;
            latestMessageId = messageId;

            // On initial load, add divider after last read message
            if (isFirstSnapshot && lastReadMessageId && foundLastRead && !unreadDividerAdded) {
              addUnreadDivider(container, true); // true = has new messages
            }

            // Mark when we've found the last read message
            if (messageId === lastReadMessageId) {
              foundLastRead = true;
            }

            var div = document.createElement('div');
            div.setAttribute('data-message-id', messageId);
            // Compare by effective email (emulated or real)
            var isMine = (m.senderEmail && effectiveEmail &&
                          m.senderEmail.toLowerCase() === effectiveEmail.toLowerCase()) ||
                         (!currentUserInfo.isEmulating && m.uid === currentUser.uid);
            div.className = 'chat-message ' + (isMine ? 'sent' : 'received');
            var html = '';
            if (!isMine) html += '<div class="sender">' + escapeHtml(m.senderName || '') + '</div>';
            html += '<div>' + escapeHtml(m.text || '') + '</div>';
            html += '<div class="time">' + formatTime(m.timestamp) + '</div>';
            div.innerHTML = html;
            container.appendChild(div);
          }
        });

        // After initial load, scroll to divider
        if (isFirstSnapshot) {
          isFirstSnapshot = false;
          chatInitialLoadComplete = true;

          // If we found last read but no new messages after, add "Last Read" divider at end
          if (lastReadMessageId && foundLastRead && !unreadDividerAdded) {
            addUnreadDivider(container, false); // false = no new messages, just "Last Read"
          }

          // First time user - add divider at TOP (all messages are new to them)
          if (!lastReadMessageId && !unreadDividerAdded && container.children.length > 0) {
            var div = document.createElement('div');
            div.className = 'unread-divider';
            div.id = 'unreadDivider';
            div.textContent = 'New Messages';
            container.insertBefore(div, container.firstChild);
            unreadDividerAdded = true;
          }

          setTimeout(function() {
            var divider = document.getElementById('unreadDivider');
            if (divider) {
              // Scroll so divider is visible
              divider.scrollIntoView({ behavior: 'auto', block: 'start' });
            } else {
              // No messages at all - just scroll to top
              window.scrollTo(0, 0);
            }
          }, 100);
        } else {
          // New message after initial load - scroll to bottom
          setTimeout(function() {
            window.scrollTo(0, document.body.scrollHeight);
          }, 50);
        }

        // Save the latest message as read
        if (latestMessageId) {
          saveLastReadMessageId(latestMessageId);
        }
      });
    }

    function sendMessage() {
      var input = document.getElementById('messageInput');
      var text = input.value.trim();
      if (!text || !db || !currentUser) {
        console.log('sendMessage blocked:', { text: !!text, db: !!db, currentUser: !!currentUser });
        return;
      }
      // Message length limit
      if (text.length > 500) {
        alert('Message is too long (max 500 characters)');
        return;
      }
      console.log('Sending message:', { text, senderName: displayName, senderEmail: effectiveEmail, isEmulating: currentUserInfo.isEmulating });
      db.collection('messages').add({
        text: text,
        senderName: displayName,
        senderEmail: effectiveEmail,
        uid: currentUserInfo.isEmulating ? null : currentUser.uid,
        timestamp: getFirestoreTimestamp()
      }).then(function(docRef) {
        console.log('Message saved:', docRef.id);
      }).catch(function(error) {
        console.error('Message save failed:', error);
        alert('Failed to send message: ' + error.message);
      });
      input.value = '';
    }

    function loadContacts() {
      if (!rosterData) return;
      var html = '<div class="contact-section-header">Coaches</div>';
      rosterData.coaches.forEach(function(c) {
        html += '<div class="contact-card"><div class="contact-info"><h4>' + escapeHtml(c.name) + '</h4><span>' + escapeHtml(c.role) + '</span></div>' + (c.phone ? '<a href="sms:' + c.phone + '" class="text-btn">Text</a>' : '<span style="color:var(--text-muted)">No phone</span>') + '</div>';
      });
      html += '<div class="contact-section-header">Parents</div>';
      rosterData.players.forEach(function(p) {
        if (p.parents && p.parents.length > 0) {
          html += '<div class="player-parents-group" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden;">';
          html += '<div style="font-weight: 700; font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; background: var(--bg-elevated);">' + escapeHtml(p.firstName) + "'s Parents</div>";
          p.parents.forEach(function(par) {
            html += '<div class="contact-card" style="border-bottom: 1px solid var(--border-color); margin: 0; border-radius: 0;"><div class="contact-info"><h4>' + escapeHtml(par.name) + '</h4><span>' + escapeHtml(par.role || 'Parent') + '</span></div>' + (par.phone ? '<a href="sms:' + par.phone + '" class="text-btn">Text</a>' : '<span style="color:var(--text-muted)">No phone</span>') + '</div>';
          });
          html += '</div>';
        }
      });
      document.getElementById('contactsList').innerHTML = html;
    }

    function filterContacts() {
      var q = document.getElementById('contactSearch').value.toLowerCase();
      document.querySelectorAll('.contact-card').forEach(function(c) {
        var name = c.querySelector('h4').textContent.toLowerCase();
        c.style.display = name.indexOf(q) >= 0 ? 'flex' : 'none';
      });
    }

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    // Init - copy pattern from working chat.html
    requireAuth({ requireParent: true }).then(function(userInfo) {
      currentUser = auth.currentUser;
      currentUserInfo = userInfo;

      // Set effective email (emulated or real)
      effectiveEmail = userInfo.emulatedEmail || currentUser.email;

      // Show profile button
      var profileWrapper = document.getElementById('profileBtnWrapper');
      if (profileWrapper) profileWrapper.style.display = 'block';
      document.getElementById('profileName').textContent = userInfo.name || 'User';
      document.getElementById('profileEmail').textContent = auth.currentUser.email;
      if (userInfo.allPlayers && userInfo.allPlayers.length > 1) {
        populatePlayerSwitcher(userInfo.allPlayers, userInfo.player ? userInfo.player.id : null);
      }
      // Show emulation controls for admin
      if (userInfo.isRealAdmin) {
        var emulateSection = document.getElementById('emulateSection');
        if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
      }
      if (userInfo.isEmulating) { showEmulationBanner(userInfo.emulatedEmail); }

      if (userInfo.isCoach && userInfo.name) {
        displayName = 'Coach ' + userInfo.name.split(' ')[0];
      } else if (userInfo.name) {
        displayName = userInfo.name;
      } else if (userInfo.parent && userInfo.parent.name) {
        displayName = userInfo.parent.name;
      } else {
        displayName = effectiveEmail.split('@')[0];
      }

      document.getElementById('chatUserName').textContent = displayName;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('tabBar').style.display = 'flex';
      document.getElementById('chatTab').classList.add('active');
      document.getElementById('chatInputContainer').style.display = 'flex';

      if (userInfo.isCoach) {
        document.getElementById('newPostBtn').style.display = 'block';
      }

      loadRoster().then(function(data) {
        rosterData = data;
        loadContacts();
      });

      loadPosts();
      loadChat();

    }).catch(function(err) {
      console.log('Auth error:', err);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('authRequired').style.display = 'block';
    });

    // Cleanup listeners on page unload to prevent memory leaks
    window.addEventListener('beforeunload', function() {
      if (unsubscribePosts) unsubscribePosts();
      if (unsubscribeMessages) unsubscribeMessages();
    });
  </script>
</body>
</html>
