<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Stats - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .player-row {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      gap: 6px;
    }
    .player-row:last-child { border-bottom: none; }
    .player-info {
      width: 65px;
      flex-shrink: 0;
    }
    .player-num {
      font-weight: 800;
      font-size: 1rem;
      color: var(--lancers-gold);
    }
    .player-name {
      font-size: 0.7rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-stats {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      flex: 1;
    }
    .mini-btn {
      min-width: 36px;
      height: 32px;
      padding: 0 4px;
      border: none;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .mini-btn:active { transform: scale(0.9); }
    .btn-pts { background: var(--lancers-gold); color: #000; }
    .btn-pos { background: #22C55E; color: #fff; }
    .btn-neg { background: #EF4444; color: #fff; }
    .btn-opp { background: #6B7280; color: #fff; }
    .stat-display {
      min-width: 22px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .stat-display.pts { color: var(--lancers-gold); font-size: 0.9rem; }
    .foul-warn { color: #F59E0B !important; }
    .foul-out { color: #EF4444 !important; text-decoration: line-through; }
    .scoreboard-compact {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 60px;
      padding: 10px 16px;
      background: var(--bg-card);
      border: 2px solid var(--lancers-gold);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .score-side {
      text-align: center;
      min-width: 80px;
    }
    .score-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .score-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--lancers-gold);
    }
    .score-num.opp { color: var(--text-primary); }
    .opponent-row {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border-radius: 8px;
      margin-top: 8px;
      gap: 8px;
    }
    .opp-btns {
      display: flex;
      gap: 6px;
      flex: 1;
    }
    .opp-btns .mini-btn {
      flex: 1;
      min-width: 50px;
      height: 40px;
      font-size: 0.9rem;
    }
    .players-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    .players-header {
      display: flex;
      padding: 6px 8px;
      background: var(--bg-elevated);
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-secondary);
      gap: 6px;
    }
    .players-header .player-info { color: var(--lancers-gold); }
    .header-stats {
      display: flex;
      gap: 4px;
    }
    .header-stat {
      min-width: 22px;
      text-align: center;
    }
    .undo-btn-small {
      min-width: 32px;
      height: 32px;
      padding: 0 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
    }
    /* Live tracking mode - fill available space */
    body.tracking-mode {
      overflow: hidden;
    }
    body.tracking-mode .main-content {
      position: fixed;
      top: 60px;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      padding: 8px !important;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.tracking-mode #live-game {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    body.tracking-mode .scoreboard-compact {
      flex-shrink: 0;
      margin-bottom: 8px;
    }
    body.tracking-mode .players-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    body.tracking-mode .players-header {
      flex-shrink: 0;
    }
    body.tracking-mode #player-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    body.tracking-mode .player-row {
      flex: 1;
      display: flex;
      align-items: center;
      min-height: 36px;
    }
    body.tracking-mode .opponent-row {
      flex-shrink: 0;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.png" alt="Lancers" class="header-logo">
          Live Stats
        </a>
      </h1>
      <div id="connection-status" style="width: 10px; height: 10px; border-radius: 50%; background: #22C55E;"></div>
    </div>
  </header>

  <main class="main-content" style="padding-bottom: 80px;" id="main-content">
    <!-- Game Selector -->
    <div id="game-selector" class="card">
      <div class="card-title">Select Game</div>
      <select id="game-select" class="form-input" style="margin-bottom: 12px;">
        <option value="">Loading games...</option>
      </select>
      <button id="start-tracking-btn" class="btn btn-primary" style="width: 100%;" disabled>
        Start Tracking
      </button>
      <p id="no-permission-msg" style="color: #F59E0B; font-size: 0.8rem; margin-top: 10px; display: none;">
        You must be the coach or signed up as scorekeeper to track stats.
      </p>
    </div>

    <!-- Live Game -->
    <div id="live-game" style="display: none;">
      <!-- Scoreboard -->
      <div class="scoreboard-compact">
        <div class="score-side">
          <div class="score-label">Lancers</div>
          <div class="score-num" id="lancers-score">0</div>
        </div>
        <div class="score-side">
          <div class="score-label" id="opponent-name">Opponent</div>
          <div class="score-num opp" id="opponent-score">0</div>
        </div>
      </div>

      <!-- Players -->
      <div class="players-card">
        <div class="players-header">
          <div class="player-info">Player</div>
          <div class="header-stats">
            <div class="header-stat">P</div>
            <div class="header-stat">R</div>
            <div class="header-stat">A</div>
            <div class="header-stat">S</div>
            <div class="header-stat">T</div>
            <div class="header-stat">F</div>
          </div>
        </div>
        <div id="player-rows"></div>
      </div>

      <!-- Opponent Score + End Game -->
      <div class="opponent-row">
        <div class="opp-btns">
          <span style="font-weight: 700; font-size: 0.75rem; margin-right: 6px;">OPP:</span>
          <button class="mini-btn btn-opp" onclick="addOpponentScore(-1)">-1</button>
          <button class="mini-btn btn-opp" onclick="addOpponentScore(1)">+1</button>
          <button class="mini-btn btn-opp" onclick="addOpponentScore(2)">+2</button>
          <button class="mini-btn btn-opp" onclick="addOpponentScore(3)">+3</button>
        </div>
        <button class="btn btn-primary" style="padding: 6px 16px; font-size: 0.75rem;" onclick="endGame()">End Game</button>
      </div>
    </div>

    <!-- Login Required -->
    <div id="login-required" class="card" style="display: none; text-align: center;">
      <h3 style="margin-bottom: 12px;">Login Required</h3>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">
        You must be logged in to track game stats.
      </p>
      <a href="login.html" class="btn btn-primary">Log In</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Inline functions
    async function loadSchedule() {
      const response = await fetch('data/schedule.json?v=' + Date.now());
      return response.json();
    }
    async function loadRoster() {
      const response = await fetch('data/roster.json?v=' + Date.now());
      return response.json();
    }
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return {
        month: date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
        day: date.getDate()
      };
    }

    let currentGameId = null;
    let currentGame = null;
    let players = [];
    let playerStats = {};
    let opponentScore = 0;
    let unsubscribe = null;
    let canEdit = false;

    document.addEventListener('DOMContentLoaded', async function() {
      if (!auth) {
        document.getElementById('game-selector').style.display = 'none';
        document.getElementById('login-required').style.display = 'block';
        return;
      }

      auth.onAuthStateChanged(async function(user) {
        if (!user || !user.emailVerified) {
          document.getElementById('game-selector').style.display = 'none';
          document.getElementById('login-required').style.display = 'block';
          return;
        }
        await loadGames();
      });
    });

    async function loadGames() {
      try {
        const schedule = await loadSchedule();
        const roster = await loadRoster();
        // Custom sort order
        const playerOrder = ['Camden', 'Rylan', 'Ashton', 'Dean', 'Raequan', 'Easton', 'Jeevan', 'Grant', 'Peyton', 'Wyatt'];
        players = roster.players.sort((a, b) => {
          const aIdx = playerOrder.indexOf(a.firstName);
          const bIdx = playerOrder.indexOf(b.firstName);
          if (aIdx === -1 && bIdx === -1) return a.number - b.number;
          if (aIdx === -1) return 1;
          if (bIdx === -1) return -1;
          return aIdx - bIdx;
        });

        const upcomingGames = schedule.games.filter(g => !g.result);
        const select = document.getElementById('game-select');

        if (upcomingGames.length === 0) {
          select.innerHTML = '<option value="">No upcoming games</option>';
          return;
        }

        select.innerHTML = '<option value="">Select a game...</option>' +
          upcomingGames.map(g => {
            const dateInfo = formatDate(g.date);
            return `<option value="${g.id}">${dateInfo.month} ${dateInfo.day} vs ${g.opponent}</option>`;
          }).join('');

        select.addEventListener('change', async function() {
          const gameId = this.value;
          if (!gameId) {
            document.getElementById('start-tracking-btn').disabled = true;
            return;
          }
          currentGameId = parseInt(gameId);
          currentGame = schedule.games.find(g => g.id === currentGameId);

          // For now, allow anyone logged in to track (simplify for testing)
          canEdit = true;
          document.getElementById('start-tracking-btn').disabled = false;
        });

        document.getElementById('start-tracking-btn').addEventListener('click', startTracking);
      } catch (e) {
        console.error('Error loading games:', e);
      }
    }

    async function startTracking() {
      if (!currentGameId) return;

      // Fill available space between header and footer
      document.body.classList.add('tracking-mode');
      document.getElementById('game-selector').style.display = 'none';
      document.getElementById('live-game').style.display = 'flex';
      document.getElementById('opponent-name').textContent = currentGame.opponent;

      // Initialize or load stats
      if (db) {
        const docRef = db.collection('gameStats').doc(currentGameId.toString());
        const doc = await docRef.get();

        if (doc.exists) {
          const data = doc.data();
          playerStats = data.playerStats || {};
          opponentScore = data.opponentScore || 0;
        } else {
          playerStats = {};
          players.forEach(p => {
            playerStats[p.id] = {
              name: p.firstName + ' ' + p.lastName.charAt(0) + '.',
              points: 0, rebounds: 0, assists: 0, steals: 0, blocks: 0,
              turnovers: 0, fouls: 0, twoPointersMade: 0, threePointersMade: 0,
              freeThrowsMade: 0, freeThrowsAttempted: 0
            };
          });
          opponentScore = 0;

          await docRef.set({
            gameId: currentGameId,
            isLive: true,
            opponentScore: 0,
            playerStats: playerStats,
            trackedBy: auth.currentUser.email,
            startedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        unsubscribe = docRef.onSnapshot(snapshot => {
          if (snapshot.exists) {
            const data = snapshot.data();
            playerStats = data.playerStats || playerStats;
            opponentScore = data.opponentScore || 0;
            updateScoreboard();
            updateAllRows();
          }
        });
      } else {
        // No Firebase - use local stats
        playerStats = {};
        players.forEach(p => {
          playerStats[p.id] = {
            name: p.firstName + ' ' + p.lastName.charAt(0) + '.',
            points: 0, rebounds: 0, assists: 0, steals: 0, blocks: 0,
            turnovers: 0, fouls: 0
          };
        });
      }

      renderPlayerRows();
      updateScoreboard();
    }

    let editingPlayerId = null;

    function renderPlayerRows() {
      const container = document.getElementById('player-rows');
      container.innerHTML = players.map(p => {
        const s = playerStats[p.id] || {};
        const foulClass = (s.fouls || 0) >= 5 ? 'foul-out' : ((s.fouls || 0) >= 4 ? 'foul-warn' : '');
        const isEditing = editingPlayerId === p.id;

        if (isEditing) {
          return `
            <div class="player-row" id="row-${p.id}" style="background: var(--bg-elevated);">
              <div class="player-info">
                <div class="player-num">#${p.number}</div>
                <div class="player-name">${p.firstName}</div>
              </div>
              <div class="player-stats">
                <div class="stat-display pts">${s.points || 0}</div>
                <div class="stat-display">${s.rebounds || 0}</div>
                <div class="stat-display">${s.assists || 0}</div>
                <div class="stat-display">${s.steals || 0}</div>
                <div class="stat-display">${s.turnovers || 0}</div>
                <div class="stat-display ${foulClass}">${s.fouls || 0}</div>
                <button class="mini-btn btn-neg" onclick="subPts(${p.id}, 1)">-P</button>
                <button class="mini-btn btn-neg" onclick="subStat(${p.id}, 'rebounds')">-R</button>
                <button class="mini-btn btn-neg" onclick="subStat(${p.id}, 'assists')">-A</button>
                <button class="mini-btn btn-neg" onclick="subStat(${p.id}, 'steals')">-S</button>
                <button class="mini-btn btn-neg" onclick="subStat(${p.id}, 'turnovers')">-T</button>
                <button class="mini-btn btn-neg" onclick="subStat(${p.id}, 'fouls')">-F</button>
                <button class="undo-btn-small" onclick="toggleEdit(${p.id})" style="background: var(--lancers-gold); color: #000;">✓</button>
              </div>
            </div>
          `;
        }

        return `
          <div class="player-row" id="row-${p.id}">
            <div class="player-info">
              <div class="player-num">#${p.number}</div>
              <div class="player-name">${p.firstName}</div>
            </div>
            <div class="player-stats">
              <div class="stat-display pts" id="pts-${p.id}">${s.points || 0}</div>
              <div class="stat-display" id="reb-${p.id}">${s.rebounds || 0}</div>
              <div class="stat-display" id="ast-${p.id}">${s.assists || 0}</div>
              <div class="stat-display" id="stl-${p.id}">${s.steals || 0}</div>
              <div class="stat-display" id="to-${p.id}">${s.turnovers || 0}</div>
              <div class="stat-display ${foulClass}" id="fls-${p.id}">${s.fouls || 0}</div>
              <button class="mini-btn btn-pts" onclick="addPts(${p.id}, 2)">+2</button>
              <button class="mini-btn btn-pts" onclick="addPts(${p.id}, 3)">+3</button>
              <button class="mini-btn btn-pts" onclick="addFT(${p.id})">+1</button>
              <button class="mini-btn btn-pos" onclick="addStat(${p.id}, 'rebounds')">R</button>
              <button class="mini-btn btn-pos" onclick="addStat(${p.id}, 'assists')">A</button>
              <button class="mini-btn btn-pos" onclick="addStat(${p.id}, 'steals')">S</button>
              <button class="mini-btn btn-neg" onclick="addStat(${p.id}, 'turnovers')">T</button>
              <button class="mini-btn btn-neg" onclick="addFoul(${p.id})">F</button>
              <button class="undo-btn-small" onclick="toggleEdit(${p.id})">✎</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit(playerId) {
      editingPlayerId = editingPlayerId === playerId ? null : playerId;
      renderPlayerRows();
    }

    async function subPts(playerId, pts) {
      const s = playerStats[playerId];
      if (!s) return;
      s.points = Math.max(0, (s.points || 0) - pts);
      await saveStats();
      renderPlayerRows();
      updateScoreboard();
    }

    async function subStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s) return;
      s[stat] = Math.max(0, (s[stat] || 0) - 1);
      await saveStats();
      renderPlayerRows();
    }

    function updateAllRows() {
      players.forEach(p => {
        const s = playerStats[p.id] || {};
        const ptsEl = document.getElementById(`pts-${p.id}`);
        const rebEl = document.getElementById(`reb-${p.id}`);
        const astEl = document.getElementById(`ast-${p.id}`);
        const stlEl = document.getElementById(`stl-${p.id}`);
        const toEl = document.getElementById(`to-${p.id}`);
        const flsEl = document.getElementById(`fls-${p.id}`);
        if (ptsEl) ptsEl.textContent = s.points || 0;
        if (rebEl) rebEl.textContent = s.rebounds || 0;
        if (astEl) astEl.textContent = s.assists || 0;
        if (stlEl) stlEl.textContent = s.steals || 0;
        if (toEl) toEl.textContent = s.turnovers || 0;
        if (flsEl) {
          flsEl.textContent = s.fouls || 0;
          flsEl.className = 'stat-display ' + ((s.fouls || 0) >= 5 ? 'foul-out' : ((s.fouls || 0) >= 4 ? 'foul-warn' : ''));
        }
      });
    }

    async function addPts(playerId, pts) {
      const s = playerStats[playerId];
      if (!s) return;
      s.points = (s.points || 0) + pts;
      if (pts === 2) s.twoPointersMade = (s.twoPointersMade || 0) + 1;
      if (pts === 3) s.threePointersMade = (s.threePointersMade || 0) + 1;
      s.lastAction = { type: pts === 2 ? 'twoPointersMade' : 'threePointersMade', pts: pts };
      await saveStats();
      updateAllRows();
      updateScoreboard();
    }

    async function addFT(playerId) {
      const s = playerStats[playerId];
      if (!s) return;
      s.freeThrowsAttempted = (s.freeThrowsAttempted || 0) + 1;
      s.freeThrowsMade = (s.freeThrowsMade || 0) + 1;
      s.points = (s.points || 0) + 1;
      s.lastAction = { type: 'freeThrowsMade', pts: 1 };
      await saveStats();
      updateAllRows();
      updateScoreboard();
    }

    async function addStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s) return;
      s[stat] = (s[stat] || 0) + 1;
      s.lastAction = { type: stat, pts: 0 };
      await saveStats();
      updateAllRows();
    }

    async function addFoul(playerId) {
      const s = playerStats[playerId];
      if (!s) return;
      s.fouls = (s.fouls || 0) + 1;
      s.lastAction = { type: 'fouls', pts: 0 };
      if (s.fouls === 4) alert(s.name + ' has 4 fouls!');
      if (s.fouls === 5) alert(s.name + ' fouled out!');
      await saveStats();
      updateAllRows();
    }

    async function undo(playerId) {
      const s = playerStats[playerId];
      if (!s || !s.lastAction) return;
      const { type, pts } = s.lastAction;
      if (type && s[type] > 0) s[type]--;
      if (pts > 0) s.points = Math.max(0, (s.points || 0) - pts);
      delete s.lastAction;
      await saveStats();
      updateAllRows();
      updateScoreboard();
    }

    async function addOpponentScore(pts) {
      opponentScore = Math.max(0, opponentScore + pts);
      await saveStats();
      updateScoreboard();
    }

    function updateScoreboard() {
      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      document.getElementById('lancers-score').textContent = total;
      document.getElementById('opponent-score').textContent = opponentScore;
    }

    async function endGame() {
      if (!confirm('End game and finalize stats?')) return;
      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      const result = total > opponentScore ? 'W' : 'L';

      if (db) {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          isLive: false,
          endedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection('games').doc(currentGameId.toString()).set({
          gameId: currentGameId,
          result: result,
          finalScore: { lancers: total, opponent: opponentScore },
          statsComplete: true
        });
      }

      if (unsubscribe) unsubscribe();
      alert('Game ended! Lancers ' + (result === 'W' ? 'WIN' : 'lose') + ' ' + total + '-' + opponentScore);
      window.location.href = 'schedule.html';
    }

    async function saveStats() {
      if (!currentGameId || !db) return;
      try {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          playerStats: playerStats,
          opponentScore: opponentScore,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('Error saving:', e);
        document.getElementById('connection-status').style.background = '#EF4444';
        setTimeout(() => document.getElementById('connection-status').style.background = '#22C55E', 2000);
      }
    }
  </script>
</body>
</html>
