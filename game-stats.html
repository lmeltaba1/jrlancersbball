<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Stats - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .score-side {
      text-align: center;
    }
    .score-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .score-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .score-num.opp { color: var(--text-secondary); }

    /* Player Card - Two Rows */
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .player-card.foul-warning {
      border-color: #F59E0B;
    }
    .player-card.fouled-out {
      border-color: #EF4444;
      opacity: 0.6;
    }

    /* Row 1: Info + Stats */
    .player-row-1 {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      gap: 6px;
      background: var(--bg-elevated);
    }
    .player-num {
      font-weight: 800;
      font-size: 1rem;
      color: var(--lancers-gold);
      min-width: 32px;
    }
    .player-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
      flex: 1;
    }
    .player-stats-row {
      display: flex;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .stat-item {
      display: flex;
      gap: 1px;
    }
    .stat-item .val {
      font-weight: 700;
      color: var(--text-primary);
    }
    .stat-item.pts .val {
      color: var(--lancers-gold);
      font-size: 0.85rem;
    }
    .stat-item.foul-warn .val { color: #F59E0B; }
    .stat-item.foul-out .val { color: #EF4444; }

    /* Row 2: Buttons */
    .player-row-2 {
      display: flex;
      padding: 6px 8px;
      gap: 3px;
    }
    .btn-group {
      display: flex;
      gap: 3px;
    }
    .btn-group.points { margin-right: 6px; }
    .stat-btn {
      min-width: 38px;
      height: 40px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .stat-btn:active { transform: scale(0.95); }
    .stat-btn.pts { background: #fff; color: #000; }
    .stat-btn.pos { background: #22C55E; color: #fff; }
    .stat-btn.neg { background: #EF4444; color: #fff; }
    .edit-btn {
      min-width: 34px;
      height: 40px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
      margin-left: auto;
    }

    /* Edit Mode */
    .player-card.editing .player-row-2 {
      background: var(--bg-elevated);
    }
    .player-card.editing .stat-btn.pos,
    .player-card.editing .stat-btn.neg {
      background: #666;
    }
    .player-card.editing .minus-btn {
      background: #EF4444 !important;
    }

    /* Opponent Row */
    .opponent-row {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-top: 6px;
      gap: 8px;
    }
    .opp-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .opp-btns {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .opp-btns .stat-btn {
      flex: 1;
      height: 40px;
      background: #666;
      color: #fff;
    }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn.sub {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .action-btn.end {
      background: #fff;
      color: #000;
    }

    /* Sub Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 999999;
      display: none;
      padding: 12px;
      padding-top: calc(env(safe-area-inset-top, 20px) + 60px);
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
    }
    .modal-overlay.active { display: block; }
    .modal-content {
      max-width: 400px;
      margin: 0 auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .modal-close {
      background: #EF4444;
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
    }
    .sub-section {
      margin-bottom: 16px;
    }
    .sub-section-title {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .sub-player {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .sub-player:active { background: var(--bg-elevated); }
    .sub-player.selected {
      border-color: var(--lancers-gold);
      background: rgba(255,215,0,0.1);
    }
    .sub-player.swapping-in {
      border-color: #22C55E;
      background: rgba(34,197,94,0.1);
    }
    .sub-player .num {
      font-weight: 800;
      font-size: 1rem;
      color: var(--lancers-gold);
      min-width: 36px;
    }
    .sub-player .name {
      font-weight: 600;
      flex: 1;
    }
    .sub-player .stats {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .sub-hint {
      text-align: center;
      padding: 12px;
      color: var(--lancers-gold);
      font-size: 0.85rem;
    }

    /* Tracking Mode - use normal flow, no fixed positioning */
    body.tracking-mode .main-content {
      padding: 4px 8px !important;
      padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important;
    }

    /* Edit confirm button */
    .edit-btn.edit-confirm { background: #fff; color: #000; }

    /* Light mode overrides */
    html.light-mode .stat-btn.pts { background: #000; color: #fff; }
    html.light-mode .action-btn.end { background: #000; color: #fff; }
    html.light-mode .edit-btn.edit-confirm { background: #000; color: #fff; }
  </style>
</head>

  <main class="main-content" id="main-content">

    <div id="game-selector" class="card">
      <div class="card-title">Select Game</div>
      <select id="game-select" class="form-input" style="margin-bottom: 12px;">
        <option value="">Loading games...</option>
      </select>
      <button id="start-tracking-btn" class="btn btn-primary" style="width: 100%;" disabled>
        Start Tracking
      </button>
    </div>

    <!-- Live Game -->
    <div id="live-game" style="display: none;">
      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-side">
          <div class="score-label">Lancers</div>
          <div class="score-num" id="lancers-score">0</div>
        </div>
        <div class="score-side">
          <div class="score-label" id="opponent-name">Opponent</div>
          <div class="score-num opp" id="opponent-score">0</div>
        </div>
      </div>

      <!-- On-Court Players -->
      <div id="court-players"></div>

      <!-- Opponent + Actions -->
      <div class="opponent-row">
        <span class="opp-label">OPP</span>
        <div class="opp-btns">
          <button class="stat-btn" onclick="addOppScore(2)">+2</button>
          <button class="stat-btn" onclick="addOppScore(3)">+3</button>
          <button class="stat-btn" onclick="addOppScore(1)">+1</button>
          <button class="stat-btn" onclick="addOppScore(-1)">-1</button>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="action-btn sub" onclick="openSubModal()">SUB</button>
        <button class="action-btn end" onclick="endGame()">END GAME</button>
      </div>
    </div>

    <!-- Login Required -->
    <div id="login-required" class="card" style="display: none; text-align: center;">
      <h3 style="margin-bottom: 12px;">Login Required</h3>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">You must be logged in to track game stats.</p>
      <a href="login.html" class="btn btn-primary">Log In</a>
    </div>
  </main>

  <!-- Substitution Modal -->
  <div class="modal-overlay" id="sub-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Substitutions</div>
        <button class="modal-close" onclick="closeSubModal()">×</button>
      </div>
      <div id="sub-hint" class="sub-hint"></div>
      <div class="sub-section">
        <div class="sub-section-title">On Court</div>
        <div id="court-players-modal"></div>
      </div>
      <div class="sub-section">
        <div class="sub-section-title">Bench</div>
        <div id="bench-players"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Helpers
    async function loadSchedule() {
      const response = await fetch('data/schedule.json?v=' + Date.now());
      return response.json();
    }
    async function loadRoster() {
      const response = await fetch('data/roster.json?v=' + Date.now());
      return response.json();
    }
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return {
        month: date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
        day: date.getDate()
      };
    }

    // Position order: PG=1, SG=2, SF=3, PF=4, C=5
    const positionOrder = { 'PG': 1, 'SG': 2, 'SF': 3, 'PF': 4, 'C': 5 };
    function getPositionOrder(player) {
      return positionOrder[player.position] || 99;
    }
    function sortByPosition(playerList) {
      return [...playerList].sort((a, b) => getPositionOrder(a) - getPositionOrder(b));
    }

    // State
    let currentGameId = null;
    let currentGame = null;
    let players = [];
    let playerStats = {};
    let opponentScore = 0;
    let onCourt = []; // Array of 5 player IDs currently on court
    let unsubscribe = null;
    let editingPlayerId = null;
    let selectedPlayerId = null; // For sub modal - can be court or bench player
    let selectedFrom = null; // 'court' or 'bench'

    document.addEventListener('DOMContentLoaded', async function() {
      if (!auth) {
        document.getElementById('game-selector').style.display = 'none';
        document.getElementById('login-required').style.display = 'block';
        return;
      }

      auth.onAuthStateChanged(async function(user) {
        if (!user || !user.emailVerified) {
          document.getElementById('game-selector').style.display = 'none';
          document.getElementById('login-required').style.display = 'block';
          return;
        }
        await loadGames();
      });
    });

    async function loadGames() {
      try {
        const schedule = await loadSchedule();
        const roster = await loadRoster();
        players = roster.players.sort((a, b) => a.number - b.number);

        const upcomingGames = schedule.games.filter(g => !g.result);
        const select = document.getElementById('game-select');

        if (upcomingGames.length === 0) {
          select.innerHTML = '<option value="">No upcoming games</option>';
          return;
        }

        select.innerHTML = '<option value="">Select a game...</option>' +
          upcomingGames.map(g => {
            const dateInfo = formatDate(g.date);
            return `<option value="${g.id}">${dateInfo.month} ${dateInfo.day} vs ${g.opponent}</option>`;
          }).join('');

        select.addEventListener('change', function() {
          const gameId = this.value;
          if (!gameId) {
            document.getElementById('start-tracking-btn').disabled = true;
            return;
          }
          currentGameId = parseInt(gameId);
          currentGame = schedule.games.find(g => g.id === currentGameId);
          document.getElementById('start-tracking-btn').disabled = false;
        });

        document.getElementById('start-tracking-btn').addEventListener('click', startTracking);
      } catch (e) {
        console.error('Error loading games:', e);
      }
    }

    async function startTracking() {
      if (!currentGameId) return;

      document.body.classList.add('tracking-mode');
      document.getElementById('game-selector').style.display = 'none';
      document.getElementById('live-game').style.display = 'block';
      document.getElementById('opponent-name').textContent = currentGame.opponent;

      // Initialize or load stats
      if (db) {
        const docRef = db.collection('gameStats').doc(currentGameId.toString());
        const doc = await docRef.get();

        if (doc.exists) {
          const data = doc.data();
          playerStats = data.playerStats || {};
          opponentScore = data.opponentScore || 0;
          onCourt = data.onCourt || [2, 6, 4, 1, 5];
        } else {
          // Initialize fresh
          playerStats = {};
          players.forEach(p => {
            playerStats[p.id] = {
              name: p.firstName + ' ' + p.lastName.charAt(0) + '.',
              points: 0, rebounds: 0, assists: 0, steals: 0,
              turnovers: 0, fouls: 0
            };
          });
          opponentScore = 0;
          // Default starting lineup: Camden(2), Dean(6), Rylan(4), Raequan(1), Ashton(5)
          onCourt = [2, 6, 4, 1, 5];

          await docRef.set({
            gameId: currentGameId,
            isLive: true,
            opponentScore: 0,
            playerStats: playerStats,
            onCourt: onCourt,
            trackedBy: auth.currentUser.email,
            startedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        // Real-time sync
        unsubscribe = docRef.onSnapshot(snapshot => {
          if (snapshot.exists) {
            const data = snapshot.data();
            playerStats = data.playerStats || playerStats;
            opponentScore = data.opponentScore || 0;
            onCourt = data.onCourt || onCourt;
            updateScoreboard();
            renderCourtPlayers();
          }
        });
      } else {
        // Offline mode
        playerStats = {};
        players.forEach(p => {
          playerStats[p.id] = {
            name: p.firstName,
            points: 0, rebounds: 0, assists: 0, steals: 0,
            turnovers: 0, fouls: 0
          };
        });
        onCourt = [2, 6, 4, 1, 5];
      }

      renderCourtPlayers();
      updateScoreboard();
    }

    function renderCourtPlayers() {
      const container = document.getElementById('court-players');
      // Get court players and sort by position
      const courtPlayersList = onCourt
        .map(id => players.find(pl => pl.id === id))
        .filter(p => p)
        .sort((a, b) => getPositionOrder(a) - getPositionOrder(b));

      container.innerHTML = courtPlayersList.map(p => {
        const playerId = p.id;
        const s = playerStats[playerId] || {};
        const fouls = s.fouls || 0;
        const foulClass = fouls >= 5 ? 'fouled-out' : (fouls >= 4 ? 'foul-warning' : '');
        const isEditing = editingPlayerId === playerId;

        return `
          <div class="player-card ${foulClass} ${isEditing ? 'editing' : ''}" id="card-${playerId}">
            <div class="player-row-1">
              <div class="player-num">#${p.number}</div>
              <div class="player-name">${p.firstName} <span style="color: var(--text-secondary); font-size: 0.75rem;">${p.position}</span></div>
              <div class="player-stats-row">
                <div class="stat-item pts"><span class="val">${s.points || 0}</span>p</div>
                <div class="stat-item"><span class="val">${s.rebounds || 0}</span>r</div>
                <div class="stat-item"><span class="val">${s.assists || 0}</span>a</div>
                <div class="stat-item"><span class="val">${s.steals || 0}</span>s</div>
                <div class="stat-item"><span class="val">${s.turnovers || 0}</span>t</div>
                <div class="stat-item ${fouls >= 5 ? 'foul-out' : (fouls >= 4 ? 'foul-warn' : '')}"><span class="val">${fouls}</span>f</div>
              </div>
            </div>
            <div class="player-row-2">
              ${isEditing ? `
                <div class="btn-group points">
                  <button class="stat-btn minus-btn" onclick="subPts(${playerId})">-P</button>
                </div>
                <div class="btn-group">
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'rebounds')">-R</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'assists')">-A</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'steals')">-S</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'turnovers')">-T</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'fouls')">-F</button>
                </div>
                <button class="edit-btn edit-confirm" onclick="toggleEdit(${playerId})">✓</button>
              ` : `
                <div class="btn-group points">
                  <button class="stat-btn pts" onclick="addPts(${playerId},2)">+2</button>
                  <button class="stat-btn pts" onclick="addPts(${playerId},3)">+3</button>
                  <button class="stat-btn pts" onclick="addPts(${playerId},1)">+1</button>
                </div>
                <div class="btn-group">
                  <button class="stat-btn pos" onclick="addStat(${playerId},'rebounds')">R</button>
                  <button class="stat-btn pos" onclick="addStat(${playerId},'assists')">A</button>
                  <button class="stat-btn pos" onclick="addStat(${playerId},'steals')">S</button>
                  <button class="stat-btn neg" onclick="addStat(${playerId},'turnovers')">T</button>
                  <button class="stat-btn neg" onclick="addStat(${playerId},'fouls')">F</button>
                </div>
                <button class="edit-btn" onclick="toggleEdit(${playerId})">✎</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit(playerId) {
      editingPlayerId = editingPlayerId === playerId ? null : playerId;
      renderCourtPlayers();
    }

    // Stat functions
    async function addPts(playerId, pts) {
      const s = playerStats[playerId];
      if (!s) return;
      s.points = (s.points || 0) + pts;
      await saveStats();
      renderCourtPlayers();
      updateScoreboard();
    }

    async function subPts(playerId) {
      const s = playerStats[playerId];
      if (!s || (s.points || 0) <= 0) return;
      s.points = (s.points || 0) - 1;
      await saveStats();
      renderCourtPlayers();
      updateScoreboard();
    }

    async function addStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s) return;
      s[stat] = (s[stat] || 0) + 1;
      if (stat === 'fouls' && s.fouls === 5) {
        alert(s.name + ' fouled out!');
      }
      await saveStats();
      renderCourtPlayers();
    }

    async function subStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s || (s[stat] || 0) <= 0) return;
      s[stat] = (s[stat] || 0) - 1;
      await saveStats();
      renderCourtPlayers();
    }

    async function addOppScore(pts) {
      opponentScore = Math.max(0, opponentScore + pts);
      await saveStats();
      updateScoreboard();
    }

    function updateScoreboard() {
      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      document.getElementById('lancers-score').textContent = total;
      document.getElementById('opponent-score').textContent = opponentScore;
    }

    // Substitution Modal
    function openSubModal() {
      selectedPlayerId = null;
      selectedFrom = null;
      renderSubModal();
      document.getElementById('sub-modal').classList.add('active');
    }

    function closeSubModal() {
      selectedPlayerId = null;
      selectedFrom = null;
      document.getElementById('sub-modal').classList.remove('active');
    }

    function renderSubModal() {
      // Sort both lists by position
      const benchPlayers = sortByPosition(players.filter(p => !onCourt.includes(p.id)));
      const courtPlayers = sortByPosition(players.filter(p => onCourt.includes(p.id)));

      // Hint text
      const hint = document.getElementById('sub-hint');
      if (selectedPlayerId) {
        const p = players.find(pl => pl.id === selectedPlayerId);
        if (selectedFrom === 'court') {
          hint.textContent = `Tap bench player to replace #${p.number} ${p.firstName}`;
        } else {
          hint.textContent = `Tap court player to swap out for #${p.number} ${p.firstName}`;
        }
      } else {
        hint.textContent = 'Tap any player to start substitution';
      }

      // On Court (now first)
      document.getElementById('court-players-modal').innerHTML = courtPlayers.map(p => {
        const s = playerStats[p.id] || {};
        const isSelected = selectedPlayerId === p.id && selectedFrom === 'court';
        return `
          <div class="sub-player ${isSelected ? 'selected' : ''}" onclick="selectCourtPlayer(${p.id})">
            <div class="num">#${p.number}</div>
            <div class="name">${p.firstName} <span style="opacity:0.6">${p.position}</span></div>
            <div class="stats">${s.points || 0}p ${s.rebounds || 0}r ${s.fouls || 0}f</div>
          </div>
        `;
      }).join('');

      // Bench
      document.getElementById('bench-players').innerHTML = benchPlayers.map(p => {
        const s = playerStats[p.id] || {};
        const isSelected = selectedPlayerId === p.id && selectedFrom === 'bench';
        return `
          <div class="sub-player ${isSelected ? 'swapping-in' : ''}" onclick="selectBenchPlayer(${p.id})">
            <div class="num">#${p.number}</div>
            <div class="name">${p.firstName} <span style="opacity:0.6">${p.position}</span></div>
            <div class="stats">${s.points || 0}p ${s.rebounds || 0}r ${s.fouls || 0}f</div>
          </div>
        `;
      }).join('') || '<p style="color: var(--text-secondary); padding: 12px;">All players on court</p>';
    }

    async function selectCourtPlayer(playerId) {
      // If tapping same player, unselect
      if (selectedPlayerId === playerId && selectedFrom === 'court') {
        selectedPlayerId = null;
        selectedFrom = null;
        renderSubModal();
        return;
      }

      // If bench player already selected, do the swap
      if (selectedPlayerId && selectedFrom === 'bench') {
        const idx = onCourt.indexOf(playerId);
        if (idx !== -1) {
          onCourt[idx] = selectedPlayerId;
          selectedPlayerId = null;
          selectedFrom = null;
          await saveStats();
          renderSubModal();
          renderCourtPlayers();
        }
        return;
      }

      // Select this court player
      selectedPlayerId = playerId;
      selectedFrom = 'court';
      renderSubModal();
    }

    async function selectBenchPlayer(playerId) {
      // If tapping same player, unselect
      if (selectedPlayerId === playerId && selectedFrom === 'bench') {
        selectedPlayerId = null;
        selectedFrom = null;
        renderSubModal();
        return;
      }

      // If court player already selected, do the swap
      if (selectedPlayerId && selectedFrom === 'court') {
        const idx = onCourt.indexOf(selectedPlayerId);
        if (idx !== -1) {
          onCourt[idx] = playerId;
          selectedPlayerId = null;
          selectedFrom = null;
          await saveStats();
          renderSubModal();
          renderCourtPlayers();
        }
        return;
      }

      // Select this bench player
      selectedPlayerId = playerId;
      selectedFrom = 'bench';
      renderSubModal();
    }

    async function endGame() {
      if (!confirm('End game and finalize stats?')) return;

      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      const result = total > opponentScore ? 'W' : (total < opponentScore ? 'L' : 'T');
      const finalScore = `${total}-${opponentScore}`;

      if (db) {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          isLive: false,
          result: result,
          finalScore: finalScore,
          lancersScore: total,
          opponentScore: opponentScore,
          endedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      if (unsubscribe) unsubscribe();
      alert('Game ended! Lancers ' + (result === 'W' ? 'WIN' : 'lose') + ' ' + total + '-' + opponentScore);
      window.location.href = 'schedule.html';
    }

    async function saveStats() {
      if (!currentGameId || !db) return;
      try {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          playerStats: playerStats,
          opponentScore: opponentScore,
          onCourt: onCourt,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('Error saving:', e);
        document.getElementById('connection-status').style.background = '#EF4444';
        setTimeout(() => document.getElementById('connection-status').style.background = '#22C55E', 2000);
      }
    }
  </script>
</body>
</html>
