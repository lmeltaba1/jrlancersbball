<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Stats - Jr. Lancers</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Extra styles for stat tracking */
    .stat-btn { touch-action: manipulation; }
    .stat-btn:active { transform: scale(0.92); }
    .player-stat-card.active { border-color: var(--lancers-gold); box-shadow: var(--glow-gold); }
    .foul-count { display: inline-block; min-width: 20px; text-align: center; }
    .foul-count.warning { color: #F59E0B; font-weight: 800; }
    .foul-count.fouled-out { color: #EF4444; font-weight: 800; text-decoration: line-through; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.svg" alt="Lancers" class="header-logo">
          Game Stats
        </a>
      </h1>
      <div id="connection-status" style="width: 10px; height: 10px; border-radius: 50%; background: #22C55E;"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" style="padding-bottom: 120px;">
    <!-- Game Selector (when no game active) -->
    <div id="game-selector" class="card">
      <div class="card-title">Select Game</div>
      <select id="game-select" class="form-input" style="margin-bottom: 12px;">
        <option value="">Loading games...</option>
      </select>
      <button id="start-tracking-btn" class="btn btn-primary" style="width: 100%;" disabled>
        Start Tracking
      </button>
      <p id="no-permission-msg" style="color: #F59E0B; font-size: 0.8rem; margin-top: 10px; display: none;">
        You must be the coach or signed up as scorekeeper to track stats for this game.
      </p>
    </div>

    <!-- Live Scoreboard (during game) -->
    <div id="live-game" style="display: none;">
      <div class="scoreboard">
        <div class="scoreboard-team">
          <div class="team-label">Lancers</div>
          <div class="score" id="lancers-score">0</div>
        </div>
        <div class="scoreboard-center">
          <div class="quarter" id="quarter-display">Q1</div>
          <div class="status" id="game-status">Live</div>
        </div>
        <div class="scoreboard-team">
          <div class="team-label" id="opponent-name">Opponent</div>
          <div class="score" id="opponent-score">0</div>
        </div>
      </div>

      <!-- Game Controls -->
      <div class="card" style="padding: 10px;">
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" style="flex: 1;" onclick="changeQuarter()">
            Next Quarter
          </button>
          <button class="btn btn-primary" style="flex: 1;" onclick="endGame()">
            End Game
          </button>
        </div>
      </div>

      <!-- Player Stats Cards -->
      <div id="player-cards"></div>

      <!-- Opponent Score -->
      <div class="opponent-controls">
        <h3>Opponent Score</h3>
        <div class="stat-row">
          <button class="stat-btn stat-btn-neutral" onclick="addOpponentScore(1)">+1</button>
          <button class="stat-btn stat-btn-neutral" onclick="addOpponentScore(2)">+2</button>
          <button class="stat-btn stat-btn-neutral" onclick="addOpponentScore(3)">+3</button>
          <button class="stat-btn stat-btn-negative" onclick="addOpponentScore(-1)">-1</button>
        </div>
      </div>
    </div>

    <!-- Login Required -->
    <div id="login-required" class="card" style="display: none; text-align: center;">
      <h3 style="margin-bottom: 12px;">Login Required</h3>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">
        You must be logged in to track game stats.
      </p>
      <a href="login.html" class="btn btn-primary">Log In</a>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="roster.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Roster</span>
    </a>
    <a href="schedule.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Schedule</span>
    </a>
    <a href="game-stats.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span>Stats</span>
    </a>
    <a href="volunteers.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span>Volunteer</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentGameId = null;
    let currentGame = null;
    let players = [];
    let playerStats = {};
    let opponentScore = 0;
    let currentQuarter = 1;
    let unsubscribe = null;
    let canEdit = false;

    document.addEventListener('DOMContentLoaded', async function() {
      // Check auth
      if (!auth) {
        document.getElementById('game-selector').style.display = 'none';
        document.getElementById('login-required').style.display = 'block';
        return;
      }

      auth.onAuthStateChanged(async function(user) {
        if (!user || !user.emailVerified) {
          document.getElementById('game-selector').style.display = 'none';
          document.getElementById('login-required').style.display = 'block';
          return;
        }

        // Load games
        await loadGames();
      });
    });

    async function loadGames() {
      try {
        const schedule = await loadSchedule();
        const roster = await loadRoster();
        players = roster.players;

        const now = new Date();
        now.setHours(0, 0, 0, 0);

        // Get games that haven't been completed (no final result)
        const upcomingGames = schedule.games.filter(g => !g.result);

        const select = document.getElementById('game-select');
        if (upcomingGames.length === 0) {
          select.innerHTML = '<option value="">No upcoming games</option>';
          return;
        }

        select.innerHTML = '<option value="">Select a game...</option>' +
          upcomingGames.map(g => {
            const dateInfo = formatDate(g.date);
            return `<option value="${g.id}">${dateInfo.month} ${dateInfo.day} vs ${g.opponent} (${g.league.toUpperCase()})</option>`;
          }).join('');

        select.addEventListener('change', async function() {
          const gameId = this.value;
          if (!gameId) {
            document.getElementById('start-tracking-btn').disabled = true;
            document.getElementById('no-permission-msg').style.display = 'none';
            return;
          }

          currentGameId = parseInt(gameId);
          currentGame = schedule.games.find(g => g.id === currentGameId);

          // Check permission
          canEdit = await canTrackStats(currentGameId);
          if (canEdit) {
            document.getElementById('start-tracking-btn').disabled = false;
            document.getElementById('no-permission-msg').style.display = 'none';
          } else {
            document.getElementById('start-tracking-btn').disabled = true;
            document.getElementById('no-permission-msg').style.display = 'block';
          }
        });

        document.getElementById('start-tracking-btn').addEventListener('click', startTracking);

      } catch (e) {
        console.error('Error loading games:', e);
      }
    }

    async function startTracking() {
      if (!currentGameId || !canEdit) return;

      document.getElementById('game-selector').style.display = 'none';
      document.getElementById('live-game').style.display = 'block';
      document.getElementById('opponent-name').textContent = currentGame.opponent;

      // Initialize or load stats from Firestore
      const docRef = db.collection('gameStats').doc(currentGameId.toString());
      const doc = await docRef.get();

      if (doc.exists) {
        const data = doc.data();
        playerStats = data.playerStats || {};
        opponentScore = data.opponentScore || 0;
        currentQuarter = data.quarter || 1;
      } else {
        // Initialize fresh stats
        playerStats = initializePlayerStats(players);
        opponentScore = 0;
        currentQuarter = 1;

        await docRef.set({
          gameId: currentGameId,
          isLive: true,
          quarter: 1,
          opponentScore: 0,
          playerStats: playerStats,
          trackedBy: auth.currentUser.email,
          startedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      renderPlayerCards();
      updateScoreboard();

      // Listen for real-time updates
      unsubscribe = docRef.onSnapshot(snapshot => {
        if (snapshot.exists) {
          const data = snapshot.data();
          playerStats = data.playerStats || playerStats;
          opponentScore = data.opponentScore || 0;
          currentQuarter = data.quarter || 1;
          updateScoreboard();
          updatePlayerTotals();
        }
      });
    }

    function renderPlayerCards() {
      const container = document.getElementById('player-cards');
      container.innerHTML = players.map(player => {
        const stats = playerStats[player.id] || {};
        return `
          <div class="player-stat-card" data-player="${player.id}">
            <div class="player-header">
              <div class="player-number">#${player.number}</div>
              <div style="flex: 1;">
                <div class="player-name">${player.firstName} ${player.lastName.charAt(0)}.</div>
                <div class="player-totals" id="totals-${player.id}">
                  <span class="stat-total">PTS: <strong>${stats.points || 0}</strong></span>
                  <span class="stat-total">REB: <strong>${stats.rebounds || 0}</strong></span>
                  <span class="stat-total">AST: <strong>${stats.assists || 0}</strong></span>
                  <span class="stat-total">FLS: <strong class="foul-count ${(stats.fouls || 0) >= 4 ? ((stats.fouls || 0) >= 5 ? 'fouled-out' : 'warning') : ''}">${stats.fouls || 0}</strong></span>
                </div>
              </div>
            </div>
            <div class="stat-buttons">
              <div class="stat-row">
                <button class="stat-btn stat-btn-points" onclick="addStat(${player.id}, 'twoPointersMade', 2)">+2</button>
                <button class="stat-btn stat-btn-points" onclick="addStat(${player.id}, 'threePointersMade', 3)">+3</button>
                <button class="stat-btn stat-btn-points" onclick="showFTModal(${player.id})">FT</button>
              </div>
              <div class="stat-row">
                <button class="stat-btn stat-btn-positive" onclick="addStat(${player.id}, 'rebounds', 0)">REB</button>
                <button class="stat-btn stat-btn-positive" onclick="addStat(${player.id}, 'assists', 0)">AST</button>
                <button class="stat-btn stat-btn-positive" onclick="addStat(${player.id}, 'steals', 0)">STL</button>
                <button class="stat-btn stat-btn-positive" onclick="addStat(${player.id}, 'blocks', 0)">BLK</button>
              </div>
              <div class="stat-row">
                <button class="stat-btn stat-btn-negative" onclick="addStat(${player.id}, 'turnovers', 0)">TO</button>
                <button class="stat-btn stat-btn-negative" onclick="addFoul(${player.id})">FOUL</button>
              </div>
            </div>
            <button class="undo-btn" onclick="undoLast(${player.id})">Undo Last</button>
          </div>
        `;
      }).join('');
    }

    async function addStat(playerId, statType, pointValue) {
      const stats = playerStats[playerId];
      if (!stats) return;

      // Increment stat
      stats[statType] = (stats[statType] || 0) + 1;

      // Update points if scoring
      if (pointValue > 0) {
        stats.points = (stats.points || 0) + pointValue;
      }

      // Store last action for undo
      stats.lastAction = { type: statType, value: pointValue > 0 ? pointValue : 1 };

      await saveStats();
      updatePlayerTotals();
      updateScoreboard();
    }

    async function addFoul(playerId) {
      const stats = playerStats[playerId];
      if (!stats) return;

      stats.fouls = (stats.fouls || 0) + 1;
      stats.lastAction = { type: 'fouls', value: 1 };

      if (stats.fouls === 4) {
        alert(`${stats.name} has 4 fouls! One more and they foul out.`);
      } else if (stats.fouls === 5) {
        alert(`${stats.name} has fouled out!`);
      }

      await saveStats();
      updatePlayerTotals();
    }

    function showFTModal(playerId) {
      const made = confirm('Free throw MADE?');
      const stats = playerStats[playerId];
      if (!stats) return;

      stats.freeThrowsAttempted = (stats.freeThrowsAttempted || 0) + 1;

      if (made) {
        stats.freeThrowsMade = (stats.freeThrowsMade || 0) + 1;
        stats.points = (stats.points || 0) + 1;
        stats.lastAction = { type: 'freeThrowsMade', value: 1 };
      } else {
        stats.lastAction = { type: 'freeThrowsAttempted', value: 0 };
      }

      saveStats();
      updatePlayerTotals();
      updateScoreboard();
    }

    async function undoLast(playerId) {
      const stats = playerStats[playerId];
      if (!stats || !stats.lastAction) return;

      const { type, value } = stats.lastAction;

      stats[type] = Math.max(0, (stats[type] || 0) - 1);

      if (value > 0 && (type.includes('Made') || type.includes('Pointers'))) {
        stats.points = Math.max(0, (stats.points || 0) - value);
      }

      delete stats.lastAction;

      await saveStats();
      updatePlayerTotals();
      updateScoreboard();
    }

    async function addOpponentScore(points) {
      opponentScore = Math.max(0, opponentScore + points);
      await saveStats();
      updateScoreboard();
    }

    function updateScoreboard() {
      let lancersTotal = 0;
      Object.values(playerStats).forEach(stats => {
        lancersTotal += stats.points || 0;
      });

      document.getElementById('lancers-score').textContent = lancersTotal;
      document.getElementById('opponent-score').textContent = opponentScore;
      document.getElementById('quarter-display').textContent = currentQuarter <= 4 ? `Q${currentQuarter}` : 'OT';
    }

    function updatePlayerTotals() {
      players.forEach(player => {
        const stats = playerStats[player.id] || {};
        const totalsEl = document.getElementById(`totals-${player.id}`);
        if (totalsEl) {
          const foulClass = (stats.fouls || 0) >= 5 ? 'fouled-out' : ((stats.fouls || 0) >= 4 ? 'warning' : '');
          totalsEl.innerHTML = `
            <span class="stat-total">PTS: <strong>${stats.points || 0}</strong></span>
            <span class="stat-total">REB: <strong>${stats.rebounds || 0}</strong></span>
            <span class="stat-total">AST: <strong>${stats.assists || 0}</strong></span>
            <span class="stat-total">FLS: <strong class="foul-count ${foulClass}">${stats.fouls || 0}</strong></span>
          `;
        }
      });
    }

    async function changeQuarter() {
      currentQuarter++;
      if (currentQuarter > 5) {
        currentQuarter = 5; // Cap at OT
      }
      await saveStats();
      updateScoreboard();
    }

    async function endGame() {
      if (!confirm('End this game and finalize stats?')) return;

      let lancersTotal = 0;
      Object.values(playerStats).forEach(stats => {
        lancersTotal += stats.points || 0;
      });

      const result = lancersTotal > opponentScore ? 'W' : 'L';

      await db.collection('gameStats').doc(currentGameId.toString()).update({
        isLive: false,
        endedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection('games').doc(currentGameId.toString()).set({
        gameId: currentGameId,
        result: result,
        finalScore: { lancers: lancersTotal, opponent: opponentScore },
        statsComplete: true
      });

      if (unsubscribe) unsubscribe();

      alert(`Game ended! Lancers ${result === 'W' ? 'WIN' : 'lose'} ${lancersTotal}-${opponentScore}`);
      window.location.href = 'schedule.html';
    }

    async function saveStats() {
      if (!currentGameId) return;

      try {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          playerStats: playerStats,
          opponentScore: opponentScore,
          quarter: currentQuarter,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (e) {
        console.error('Error saving stats:', e);
        document.getElementById('connection-status').style.background = '#EF4444';
        setTimeout(() => {
          document.getElementById('connection-status').style.background = '#22C55E';
        }, 2000);
      }
    }
  </script>
</body>
</html>
