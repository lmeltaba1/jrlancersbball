<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Stats - Jr. Lancers</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    /* Scoreboard */
    .scoreboard {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .score-side {
      text-align: center;
    }
    .score-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .score-num {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .score-num.opp { color: var(--text-secondary); }

    /* Player Card - Two Rows */
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .player-card.foul-warning {
      border-color: #F59E0B;
    }
    .player-card.fouled-out {
      border-color: #EF4444;
      opacity: 0.6;
    }

    /* Row 1: Info + Stats */
    .player-row-1 {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      gap: 6px;
      background: var(--bg-elevated);
    }
    .player-num {
      font-weight: 800;
      font-size: 1rem;
      color: var(--lancers-gold);
      min-width: 32px;
    }
    .player-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-primary);
      flex: 1;
    }
    .player-stats-row {
      display: flex;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .stat-item {
      display: flex;
      gap: 1px;
    }
    .stat-item .val {
      font-weight: 700;
      color: var(--text-primary);
    }
    .stat-item.pts .val {
      color: var(--lancers-gold);
      font-size: 0.85rem;
    }
    .stat-item.foul-warn .val { color: #F59E0B; }
    .stat-item.foul-out .val { color: #EF4444; }

    /* Row 2: Buttons */
    .player-row-2 {
      display: flex;
      padding: 6px 8px;
      gap: 3px;
    }
    .btn-group {
      display: flex;
      gap: 3px;
    }
    .btn-group.points { margin-right: 6px; }
    .stat-btn {
      min-width: 38px;
      height: 40px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .stat-btn:active { transform: scale(0.95); }
    .stat-btn.pts { background: #fff; color: #000; }
    .stat-btn.pos { background: #22C55E; color: #fff; }
    .stat-btn.neg { background: #EF4444; color: #fff; }

    /* Disabled state before game starts / at halftime / game ended */
    .stats-panel.disabled {
      position: relative;
      pointer-events: none;
    }
    .stats-panel.disabled::after {
      content: attr(data-message);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lancers-gold);
      font-weight: 700;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }
    /* Hide the overlay for view-only mode - use card message instead */
    body.view-only-mode .stats-panel.disabled::after {
      display: none;
    }
    .stats-panel.disabled .stat-btn,
    .stats-panel.disabled .timeout-btn,
    .stats-panel.disabled .action-btn.sub {
      opacity: 0.3;
    }
    /* Keep phase buttons clickable when panel is disabled */
    .stats-panel.disabled .action-btn.phase,
    .stats-panel.disabled .action-btn.ot,
    .stats-panel.disabled .action-btn.end,
    .stats-panel.disabled .bottom-actions {
      pointer-events: auto;
      position: relative;
      z-index: 20;
    }
    .edit-btn {
      min-width: 34px;
      height: 40px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
      margin-left: auto;
    }

    /* Edit Mode */
    .player-card.editing .player-row-2 {
      background: var(--bg-elevated);
    }
    .player-card.editing .stat-btn.pos,
    .player-card.editing .stat-btn.neg {
      background: #666;
    }
    .player-card.editing .minus-btn {
      background: #EF4444 !important;
    }

    /* Opponent Row */
    .opponent-row {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-top: 6px;
      gap: 8px;
    }
    .opp-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .opp-btns {
      display: flex;
      gap: 4px;
      flex: 1;
    }
    .opp-btns .stat-btn {
      flex: 1;
      height: 40px;
      background: #666;
      color: #fff;
    }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn.sub {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .action-btn.end {
      background: #fff;
      color: #000;
    }
    .action-btn.phase {
      background: #22C55E;
      color: #000;
    }
    .action-btn.ot {
      background: #F59E0B;
      color: #000;
    }

    /* Sub modal uses global bottom-sheet styles from athletic.css */
    /* Override close button color for substitutions */
    #sub-modal .bottom-sheet-close {
      background: #EF4444;
      border: none;
      color: #fff;
    }
    .sub-section {
      margin-bottom: 16px;
    }
    .sub-section-title {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .sub-player {
      display: flex;
      align-items: center;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .sub-player:active { background: var(--bg-elevated); }
    .sub-player.selected {
      border-color: var(--lancers-gold);
      background: rgba(255,215,0,0.1);
    }
    .sub-player.swapping-in {
      border-color: #22C55E;
      background: rgba(34,197,94,0.1);
    }
    .sub-player .num {
      font-weight: 800;
      font-size: 1rem;
      color: var(--lancers-gold);
      min-width: 36px;
    }
    .sub-player .name {
      font-weight: 600;
      flex: 1;
    }
    .sub-player .stats {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .sub-hint {
      text-align: center;
      padding: 12px;
      color: var(--lancers-gold);
      font-size: 0.85rem;
    }

    /* Tracking Mode - use normal flow, no fixed positioning */
    body.tracking-mode .main-content {
      padding: 4px 8px !important;
      padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important;
    }

    /* Edit confirm button */
    .edit-btn.edit-confirm { background: #fff; color: #000; }

    /* Light mode overrides */
    html.light-mode .stat-btn.pts { background: #000; color: #fff; }
    html.light-mode .action-btn.end { background: #000; color: #fff; }
    html.light-mode .edit-btn.edit-confirm { background: #000; color: #fff; }

    /* View-only mode: sticky scoreboard */
    body.view-only-mode .scoreboard {
      position: sticky;
      top: 0;
      z-index: 100;
      margin: 0 -8px 6px -8px;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
    }
    body.view-only-mode .main-content {
      padding-top: 0 !important;
    }
    /* View-only mode: compact player cards */
    body.view-only-mode .player-card {
      margin-bottom: 2px;
    }
    body.view-only-mode .player-row-1 {
      padding: 3px 6px;
    }
    body.view-only-mode .player-num {
      font-size: 0.75rem;
      min-width: 20px;
    }
    body.view-only-mode .player-name {
      font-size: 0.7rem;
    }
    body.view-only-mode .player-stats-row {
      font-size: 0.6rem;
      gap: 2px;
    }
    body.view-only-mode .stat-item.pts .val {
      font-size: 0.65rem;
    }
    /* Hide row 2 buttons in view mode */
    body.view-only-mode .player-row-2 {
      display: none;
    }
    /* Compact view-only stat grid */
    body.view-only-mode .view-stats-grid {
      padding: 4px 6px;
      gap: 4px;
    }
    body.view-only-mode .view-stat-item {
      padding: 2px 0;
    }
    body.view-only-mode .view-stat-item .stat-value {
      font-size: 0.9rem;
    }
    body.view-only-mode .view-stat-item .stat-label {
      font-size: 0.55rem;
    }
    /* Hide play-by-play for scorekeepers (non-view-only) */
    body:not(.view-only-mode) #playByPlay {
      display: none;
    }
  </style>
  <link rel="icon" type="image/png" href="images/lancers-logo-192.png">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="header">
    <div class="header-content">
      <h1 style="display: flex; align-items: center; gap: 10px;">
        <a onclick="history.back()" role="button" aria-label="Go back" tabindex="0" onkeydown="if(event.key==='Enter')history.back()" style="color: white; cursor: pointer; display: flex; align-items: center;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 24px; height: 24px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.jpg" alt="Lancers" class="header-logo" width="36" height="36">
          Live Stats
        </a>
      </h1>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div id="connection-status" style="width: 10px; height: 10px; border-radius: 50%; background: #22C55E;"></div>
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
        <div id="profileBtnWrapper" style="position: relative; display: none;">
          <button id="profileBtn" onclick="toggleProfileMenu()" aria-label="User menu" aria-haspopup="true" style="background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          <div id="profileMenu" style="display: none; position: absolute; top: 44px; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
              <div id="profileName" style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">User</div>
              <div id="profileEmail" style="font-size: 0.8rem; color: var(--text-secondary); word-break: break-all;"></div>
            </div>
            <div id="playerSwitcher" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Switch Player</div>
              <div id="playerSwitcherButtons"></div>
            </div>
            <!-- Emulate User (admin only) -->
            <div id="emulateSection" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Emulate User</div>
              <select id="emulateSelect" onchange="emulateUser(this.value)" style="width: 100%; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem;">
                <option value="">-- Select User --</option>
              </select>
            </div>
            <div style="padding: 8px;">
              <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: transparent; border: none; color: #EF4444; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Emulation Banner (shown when admin is emulating another user) -->
  <div id="emulationBanner" style="display: none; background: #7C3AED; color: white; padding: 8px 16px; text-align: center; font-size: 0.85rem; font-weight: 600;">
    <span id="emulationText">Viewing as: </span>
    <button onclick="stopEmulation()" style="background: white; color: #7C3AED; border: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; margin-left: 12px; cursor: pointer;">Stop</button>
  </div>

  <main class="main-content" id="main-content">
    <!-- Game Selector -->
    <div id="game-selector" class="card">
      <div class="card-title">Select Game</div>
      <select id="game-select" class="form-input" style="margin-bottom: 12px;">
        <option value="">Loading games...</option>
      </select>
      <button id="start-tracking-btn" class="btn btn-primary" style="width: 100%;" disabled>
        View Live Stats
      </button>
    </div>

    <!-- Live Game -->
    <div id="live-game" style="display: none;">
      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-side">
          <div class="score-label">Lancers</div>
          <div class="score-num" id="lancers-score">0</div>
        </div>
        <div class="score-side">
          <div class="score-label" id="opponent-name">Opponent</div>
          <div class="score-num opp" id="opponent-score">0</div>
        </div>
      </div>

      <!-- Play-by-Play Feed -->
      <div id="playByPlay" class="card" style="margin-bottom: 8px; padding: 0; overflow: hidden;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle);">
          <span style="font-weight: 600; font-size: 0.85rem; color: var(--text-primary);">Play-by-Play</span>
          <span id="gamePhaseDisplay" style="background: #3B82F6; color: #000; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; font-weight: 700;">PRE</span>
        </div>
        <div id="eventFeed" style="max-height: 150px; overflow-y: auto;"></div>
      </div>

      <!-- Stats Panel (disabled until game starts) -->
      <div id="stats-panel" class="stats-panel disabled" data-message="Press START GAME to begin tracking">
        <!-- On-Court Players -->
        <div id="court-players"></div>

        <!-- Opponent + Actions -->
        <div class="opponent-row">
          <span class="opp-label">OPP</span>
          <div class="opp-btns">
            <button class="stat-btn" onclick="addOppScore(2)">+2</button>
            <button class="stat-btn" onclick="addOppScore(3)">+3</button>
            <button class="stat-btn" onclick="addOppScore(1)">+1</button>
            <button class="stat-btn" onclick="addOppScore(-1)">-1</button>
            <button class="stat-btn" onclick="addOppFoul()" style="background: #7C3AED;">F<span id="oppFoulCount" style="font-size: 0.7rem; margin-left: 2px;">0</span></button>
          </div>
        </div>

        <!-- Timeout Controls -->
        <div class="timeout-row" style="display: flex; gap: 8px; margin-top: 6px;">
          <button class="timeout-btn lancers" onclick="callTimeout('lancers')" style="flex: 1; padding: 10px; background: var(--lancers-gold); color: #000; border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem;">
            Lancers TO <span id="lancersTORemaining">(2)</span>
          </button>
          <button class="timeout-btn opponent" onclick="callTimeout('opponent')" style="flex: 1; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; font-weight: 700; font-size: 0.85rem;">
            Opponent TO <span id="opponentTORemaining">(2)</span>
          </button>
        </div>

        <div class="bottom-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="action-btn sub" onclick="openSubModal()">SUB</button>
          <button id="phaseBtn" class="action-btn phase" onclick="advancePhase()">START GAME</button>
          <button id="otBtn" class="action-btn ot" onclick="startOvertime()" style="display:none;">OT</button>
          <button id="endBtn" class="action-btn end" onclick="endGame()" style="display:none;">END GAME</button>
        </div>
      </div>
    </div>

    <!-- Login Required -->
    <div id="login-required" class="card" style="display: none; text-align: center;">
      <h3 style="margin-bottom: 12px;">Login Required</h3>
      <p style="color: var(--text-secondary); margin-bottom: 16px;">You must be logged in to track game stats.</p>
      <a href="login.html" class="btn btn-primary">Log In</a>
    </div>
  </main>

  <!-- Substitution Bottom Sheet -->
  <div class="bottom-sheet-overlay" id="sub-modal-overlay" onclick="closeSubModal()"></div>
  <div class="bottom-sheet" id="sub-modal">
    <div class="bottom-sheet-handle"></div>
    <div class="bottom-sheet-header">
      <h2 class="bottom-sheet-title">Substitutions</h2>
      <button class="bottom-sheet-close" onclick="closeSubModal()">×</button>
    </div>
    <div class="bottom-sheet-body">
      <div id="sub-hint" class="sub-hint"></div>
      <div class="sub-section">
        <div class="sub-section-title">On Court</div>
        <div id="court-players-modal"></div>
      </div>
      <div class="sub-section">
        <div class="sub-section-title">Bench</div>
        <div id="bench-players"></div>
      </div>
    </div>
  </div>

    <a href="messages.html" class="nav-item">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      const menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(() => { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayersArr, currentPlayerId) {
      if (!allPlayersArr || allPlayersArr.length <= 1) return;
      const switcher = document.getElementById('playerSwitcher');
      const buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayersArr.map(p => {
        const isActive = p.id === currentPlayerId;
        return `<button onclick="switchPlayer(${p.id})" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ${isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)'}; color: ${isActive ? '#000' : 'var(--text-primary)'}; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">#${p.number} ${p.firstName}</button>`;
      }).join('');
    }
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('profileBtnWrapper');
      const menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      const select = document.getElementById('emulateSelect');
      if (!select) return;
      const users = await getAllRosterUsers();
      const currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(u => {
          const selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return `<option value="${u.email}" ${selected ? 'selected' : ''}>${u.name} (${u.role}${u.player ? ' - ' + u.player : ''})</option>`;
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      const banner = document.getElementById('emulationBanner');
      const text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    // loadSchedule(), loadRoster(), formatDate() defined in app.js

    // Check if current time is within tracking window
    // 10 minutes before game start to 30 minutes after game ends (assume 1hr game)
    function isInTrackingWindow(gameDate, gameTime) {
      const [year, month, day] = gameDate.split('-').map(Number);

      // Parse time like "10:15 AM" or "2:30 PM"
      const timeParts = gameTime.match(/(\d+):(\d+)\s*(AM|PM)/i);
      if (!timeParts) return false;

      let hours = parseInt(timeParts[1]);
      const mins = parseInt(timeParts[2]);
      const ampm = timeParts[3].toUpperCase();

      if (ampm === 'PM' && hours !== 12) hours += 12;
      if (ampm === 'AM' && hours === 12) hours = 0;

      const gameStart = new Date(year, month - 1, day, hours, mins, 0);
      const now = getCurrentDate();

      // Window: 10 minutes before game start
      const windowStart = new Date(gameStart.getTime() - 10 * 60 * 1000);
      // Window: 30 minutes after game ends (assume 1 hour game = 90 minutes after start)
      const windowEnd = new Date(gameStart.getTime() + 90 * 60 * 1000);

      return now >= windowStart && now <= windowEnd;
    }

    // Position order: PG=1, SG=2, SF=3, PF=4, C=5
    const positionOrder = { 'PG': 1, 'SG': 2, 'SF': 3, 'PF': 4, 'C': 5 };
    function getPositionOrder(player) {
      return positionOrder[player.position] || 99;
    }
    function sortByPosition(playerList) {
      return [...playerList].sort((a, b) => getPositionOrder(a) - getPositionOrder(b));
    }

    // State
    let currentGameId = null;
    let currentGame = null;
    let players = [];
    let playerStats = {};
    let opponentScore = 0;
    let opponentFouls = 0;
    let onCourt = []; // Array of 5 player IDs currently on court
    let unsubscribe = null;
    let editingPlayerId = null;
    let selectedPlayerId = null; // For sub modal - can be court or bench player
    let selectedFrom = null; // 'court' or 'bench'

    let isScorekeeper = false; // Whether current user is the designated scorekeeper
    let viewOnlyMode = false; // True = can only view, False = can edit
    // currentUserInfo is defined in firebase-config.js

    // Phase tracking
    let gamePhase = 'pre'; // 'pre', 'Q1', 'Q2', 'halftime', 'Q3', 'Q4', 'OT1', 'OT2', ..., 'final'
    let phaseStartedAt = null;
    let events = []; // Play-by-play events

    // Timeout tracking (youth rules: 4 per half, 2 per OT)
    let timeouts = {
      lancers: { first: 0, second: 0, OT: 0 },
      opponent: { first: 0, second: 0, OT: 0 }
    };

    // Helper to get player name for event descriptions
    function getPlayerName(playerId) {
      const player = players.find(p => p.id === playerId);
      if (!player) {
        console.warn(`Player not found for ID: ${playerId}`);
      }
      return player ? player.firstName : 'Unknown';
    }

    // Escape HTML to prevent XSS in event descriptions

    // Generate UUID for events
    function generateEventId() {
      return 'evt-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    }

    // Log an event to the play-by-play
    function logEvent(eventData) {
      const event = {
        id: generateEventId(),
        timestamp: firebase.firestore.Timestamp.now(),
        gamePhase: gamePhase,
        ...eventData
      };
      events.push(event);
      renderEventFeed();
      return event;
    }

    // Get current Lancers score total
    function getLancersScore() {
      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      return total;
    }

    // Get current half for timeout tracking
    function getCurrentHalf() {
      if (gamePhase === 'Q1' || gamePhase === 'Q2') return 'first';
      if (gamePhase === 'Q3' || gamePhase === 'Q4') return 'second';
      if (gamePhase.startsWith('OT')) return 'OT';
      return 'first';
    }

    // Format timestamp for display
    function formatEventTime(timestamp) {
      if (!timestamp) return '';
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    // Render the play-by-play feed
    function renderEventFeed() {
      const feed = document.getElementById('eventFeed');
      if (!feed) return;

      const recentEvents = (events || []).slice().reverse(); // All events, newest first

      if (recentEvents.length === 0) {
        feed.innerHTML = '<div style="color: var(--text-muted); padding: 8px; text-align: center; font-size: 0.85rem;">No events yet</div>';
        return;
      }

      feed.innerHTML = recentEvents.map(e => {
        const isScoring = e.stat === 'points' && e.lancersScore !== undefined;
        const isOpponent = e.team === 'opponent';
        const isTimeout = e.type === 'timeout';

        let textColor = getEventColor(e.type);
        let bgColor = 'transparent';
        if (isOpponent) textColor = '#EF4444';
        if (isTimeout) { textColor = '#000'; bgColor = '#F59E0B'; }

        const scoreDisplay = isScoring ? `<span style="font-weight: 700; color: ${isOpponent ? '#EF4444' : 'var(--lancers-gold)'}; min-width: 40px; text-align: right;">${e.lancersScore}-${e.opponentScore}</span>` : '';
        return `
        <div class="event-item ${e.type}" style="padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); display: flex; gap: 8px; align-items: center; background: ${bgColor};">
          <span style="color: ${isTimeout ? '#000' : 'var(--text-muted)'}; font-size: 0.75rem; min-width: 50px;">${formatEventTime(e.timestamp)}</span>
          <span style="background: ${getPhaseColor(e.gamePhase)}; color: #000; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; font-weight: 600;">${e.gamePhase}</span>
          <span style="flex: 1; font-size: 0.85rem; color: ${textColor}; font-weight: ${isTimeout ? '700' : '400'};">${escapeHtml(e.description)}</span>
          ${scoreDisplay}
        </div>
      `}).join('');

      // Auto-scroll to top (newest)
      feed.scrollTop = 0;
    }

    function getPhaseColor(phase) {
      if (phase === 'halftime') return '#F59E0B';
      if (phase.startsWith('OT')) return '#EF4444';
      return '#3B82F6';
    }

    function getEventColor(type) {
      switch(type) {
        case 'timeout': return '#F59E0B';
        case 'phase': return '#3B82F6';
        case 'sub': return '#8B5CF6';
        default: return 'var(--text-primary)';
      }
    }

    // Phase progression
    const PHASES = ['pre', 'Q1', 'Q2', 'halftime', 'Q3', 'Q4'];
    const PHASE_LABELS = {
      'pre': 'START GAME',
      'Q1': 'START Q2',
      'Q2': 'HALFTIME',
      'halftime': 'START Q3',
      'Q3': 'START Q4',
      'Q4': null  // Show OT + END buttons instead
    };

    // Update phase display and button states
    function updatePhaseDisplay() {
      const phaseDisplay = document.getElementById('gamePhaseDisplay');
      if (phaseDisplay) {
        phaseDisplay.textContent = gamePhase === 'pre' ? 'PRE' : gamePhase;
        phaseDisplay.style.background = getPhaseColor(gamePhase);
      }

      // Enable/disable stats panel based on phase
      const statsPanel = document.getElementById('stats-panel');
      if (statsPanel) {
        const isPlayable = gamePhase !== 'pre' && gamePhase !== 'halftime' && gamePhase !== 'final';
        if (isPlayable) {
          statsPanel.classList.remove('disabled');
        } else {
          statsPanel.classList.add('disabled');
          // Set appropriate message (different for viewers vs scorekeepers)
          if (gamePhase === 'pre') {
            statsPanel.setAttribute('data-message', viewOnlyMode ? 'Waiting for game to start' : 'Press START GAME to begin tracking');
          } else if (gamePhase === 'halftime') {
            statsPanel.setAttribute('data-message', viewOnlyMode ? 'HALFTIME' : 'HALFTIME — Press START Q3 to continue');
          } else if (gamePhase === 'final') {
            statsPanel.setAttribute('data-message', 'Game Over');
          }
        }
      }

      // Update phase button
      const phaseBtn = document.getElementById('phaseBtn');
      const otBtn = document.getElementById('otBtn');
      const endBtn = document.getElementById('endBtn');

      if (!phaseBtn) return;

      // Hide all phase controls in view-only mode
      if (viewOnlyMode) {
        phaseBtn.style.display = 'none';
        if (otBtn) otBtn.style.display = 'none';
        if (endBtn) endBtn.style.display = 'none';
        return;
      }

      // Handle Q4 and OT phases - show OT and END buttons
      if (gamePhase === 'Q4' || gamePhase.startsWith('OT')) {
        phaseBtn.style.display = 'none';
        otBtn.style.display = 'block';
        endBtn.style.display = 'block';
      } else if (gamePhase === 'final') {
        // Game ended
        phaseBtn.style.display = 'none';
        otBtn.style.display = 'none';
        endBtn.style.display = 'none';
      } else {
        // Normal phases - show phase button
        phaseBtn.style.display = 'block';
        otBtn.style.display = 'none';
        endBtn.style.display = 'none';
        phaseBtn.textContent = PHASE_LABELS[gamePhase] || 'START GAME';
      }

      // Update timeout displays if they exist
      updateTimeoutDisplay();
    }

    // Advance to next phase
    async function advancePhase() {
      const currentIndex = PHASES.indexOf(gamePhase);
      if (currentIndex === -1 || currentIndex >= PHASES.length - 1) return;

      const nextPhase = PHASES[currentIndex + 1];

      // Log phase change event
      logEvent({
        type: 'phase',
        description: nextPhase === 'halftime' ? 'HALFTIME' : `${nextPhase} started`
      });

      gamePhase = nextPhase;
      phaseStartedAt = firebase.firestore.Timestamp.now();

      await saveStats();
      updatePhaseDisplay();
    }

    // Track overtime number
    let overtimeNumber = 0;

    // Start overtime period
    async function startOvertime() {
      overtimeNumber++;
      const otPhase = 'OT' + overtimeNumber;

      // Reset OT timeouts
      timeouts.lancers.OT = 0;
      timeouts.opponent.OT = 0;

      // Log OT start
      logEvent({
        type: 'phase',
        description: `Overtime ${overtimeNumber} started`
      });

      gamePhase = otPhase;
      phaseStartedAt = firebase.firestore.Timestamp.now();

      await saveStats();
      updatePhaseDisplay();
    }

    // Timeout functions
    async function callTimeout(team) {
      const half = getCurrentHalf();
      const maxTOs = half === 'OT' ? 1 : 2; // 2 per half, 1 per OT
      const used = timeouts[team][half] || 0;

      if (used >= maxTOs) {
        showToast(`${team === 'lancers' ? 'Lancers' : 'Opponent'} has no timeouts remaining!`, 'warning');
        return;
      }

      timeouts[team][half] = used + 1;

      // Log timeout event
      logEvent({
        type: 'timeout',
        team: team,
        description: `${team === 'lancers' ? 'Lancers' : 'Opponent'} TIMEOUT (${maxTOs - used - 1} left)`
      });

      updateTimeoutDisplay();
      await saveStats();
    }

    // Update timeout display
    function updateTimeoutDisplay() {
      const half = getCurrentHalf();
      const maxTOs = half === 'OT' ? 1 : 2; // 2 per half, 1 per OT

      const lancersUsed = timeouts.lancers[half] || 0;
      const opponentUsed = timeouts.opponent[half] || 0;

      const lancersRemaining = maxTOs - lancersUsed;
      const opponentRemaining = maxTOs - opponentUsed;

      const lancersEl = document.getElementById('lancersTORemaining');
      const opponentEl = document.getElementById('opponentTORemaining');

      if (lancersEl) {
        lancersEl.textContent = `(${lancersRemaining})`;
        lancersEl.parentElement.style.opacity = lancersRemaining === 0 ? '0.5' : '1';
      }
      if (opponentEl) {
        opponentEl.textContent = `(${opponentRemaining})`;
        opponentEl.parentElement.style.opacity = opponentRemaining === 0 ? '0.5' : '1';
      }
    }

    document.addEventListener('DOMContentLoaded', async function() {
      // Allow all authenticated users (including viewers) to view
      requireAuth().then(async function(userInfo) {
        currentUserInfo = userInfo; // Store for use in startTracking
        // Show profile button
        const profileWrapper = document.getElementById('profileBtnWrapper');
        if (profileWrapper) profileWrapper.style.display = 'block';
        document.getElementById('profileName').textContent = userInfo.name || 'User';
        document.getElementById('profileEmail').textContent = auth.currentUser.email;
        if (userInfo.allPlayers && userInfo.allPlayers.length > 1) {
          populatePlayerSwitcher(userInfo.allPlayers, userInfo.player ? userInfo.player.id : null);
        }
        // Show emulation controls for admin
        if (userInfo.isRealAdmin) {
          const emulateSection = document.getElementById('emulateSection');
          if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
        }
        if (userInfo.isEmulating) { showEmulationBanner(userInfo.emulatedEmail); }
        await loadGames();
      }).catch(function(err) {
        console.log('Auth required:', err);
      });
    });

    async function loadGames() {
      try {
        const schedule = await loadSchedule();
        const roster = await loadRoster();
        players = roster.players.sort((a, b) => a.number - b.number);

        const upcomingGames = schedule.games.filter(g => !g.result);
        const select = document.getElementById('game-select');

        if (upcomingGames.length === 0) {
          select.innerHTML = '<option value="">No upcoming games</option>';
          return;
        }

        select.innerHTML = '<option value="">Select a game...</option>' +
          upcomingGames.map(g => {
            const dateInfo = formatDate(g.date);
            return `<option value="${g.id}">${dateInfo.month} ${dateInfo.day} vs ${g.opponent}</option>`;
          }).join('');

        select.addEventListener('change', function() {
          const gameId = this.value;
          if (!gameId) {
            document.getElementById('start-tracking-btn').disabled = true;
            return;
          }
          currentGameId = parseInt(gameId);
          currentGame = schedule.games.find(g => g.id === currentGameId);
          document.getElementById('start-tracking-btn').disabled = false;
        });

        document.getElementById('start-tracking-btn').addEventListener('click', startTracking);

        // Check for auto-start with game URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const gameParam = urlParams.get('game');
        if (gameParam) {
          const gameId = parseInt(gameParam);
          const game = schedule.games.find(g => g.id === gameId);
          if (game) {
            currentGameId = gameId;
            currentGame = game;
            select.value = gameId.toString();
            // Auto-start tracking
            startTracking();
          }
        }
      } catch (e) {
        console.error('Error loading games:', e);
      }
    }

    async function startTracking() {
      if (!currentGameId) return;

      // Check if current user is the designated scorekeeper
      isScorekeeper = false;
      viewOnlyMode = true;

      // Force view-only mode with URL param ?view=1 (for testing/preview)
      const urlParams = new URLSearchParams(window.location.search);
      const forceViewOnly = urlParams.get('view') === '1';

      // Check if we're in the allowed time window for tracking
      // 10 minutes before game start to 30 minutes after game ends (assume 1hr game = 90 min total window)
      const inTrackingWindow = isInTrackingWindow(currentGame.date, currentGame.time);
      const isCoach = currentUserInfo && currentUserInfo.isCoach;

      if (forceViewOnly) {
        viewOnlyMode = true;
      } else if (db && auth.currentUser) {
        try {
          const volDoc = await db.collection('volunteers').doc(currentGameId.toString()).get();
          if (volDoc.exists) {
            const volData = volDoc.data();
            // Use emulated email if available, otherwise real email
            const effectiveEmail = (currentUserInfo && currentUserInfo.emulatedEmail) || auth.currentUser.email;
            if (volData.scorekeeper && volData.scorekeeper.email.toLowerCase() === effectiveEmail.toLowerCase()) {
              isScorekeeper = true;
              // Scorekeeper can only track during the time window
              if (inTrackingWindow) {
                viewOnlyMode = false;
              }
            }
          }
          // Coaches can edit anytime (even after window closes)
          if (isCoach) {
            viewOnlyMode = false;
          }
        } catch (e) {
          console.log('Error checking volunteer status:', e);
        }
      }

      // Show message if scorekeeper but outside tracking window
      if (!inTrackingWindow && !isCoach && isScorekeeper) {
        const windowMsg = document.createElement('div');
        windowMsg.style.cssText = 'background: #F59E0B; color: black; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; text-align: center;';
        windowMsg.textContent = 'Stat tracking is only available from 10 min before game until 30 min after it ends.';
        document.getElementById('live-game').insertBefore(windowMsg, document.getElementById('live-game').firstChild);
      }

      document.body.classList.add('tracking-mode');
      document.getElementById('game-selector').style.display = 'none';
      document.getElementById('live-game').style.display = 'block';
      document.getElementById('opponent-name').textContent = currentGame.opponent;

      // Update UI based on mode
      if (viewOnlyMode) {
        document.body.classList.add('view-only-mode');
        document.querySelector('header h1 a').innerHTML = '<img src="images/lancers-logo.jpg" alt="Lancers" class="header-logo" width="36" height="36">Live Stats <span style="font-size: 0.6em; opacity: 0.7;">(View Only)</span>';
        // Hide opponent controls, timeout controls, and action buttons
        document.querySelector('.opponent-row').style.display = 'none';
        document.querySelector('.timeout-row').style.display = 'none';
        document.querySelector('.bottom-actions').style.display = 'none';
      }

      // Initialize or load stats
      if (db) {
        const docRef = db.collection('gameStats').doc(currentGameId.toString());
        const doc = await docRef.get();

        if (doc.exists) {
          const data = doc.data();
          playerStats = data.playerStats || {};
          opponentScore = data.opponentScore || 0;
          opponentFouls = data.opponentFouls || 0;
          onCourt = data.onCourt || [2, 6, 4, 1, 5];
          // Load new fields
          gamePhase = data.gamePhase || 'pre';
          events = data.events || [];
          timeouts = data.timeouts || { lancers: { first: 0, second: 0, OT: 0 }, opponent: { first: 0, second: 0, OT: 0 } };
          phaseStartedAt = data.phaseStartedAt || null;
        } else if (viewOnlyMode) {
          // View-only user and no game in progress - show waiting message
          document.getElementById('stats-panel').setAttribute('data-message', 'Waiting for game to start');
          document.getElementById('court-players').innerHTML = `
            <div class="card" style="text-align: center; padding: 24px;">
              <p style="color: var(--text-secondary); margin-bottom: 8px;">Waiting for game to start...</p>
              <p style="font-size: 0.85rem; color: var(--text-muted);">The scorekeeper will begin tracking shortly.</p>
            </div>
          `;
          return;
        } else {
          // Scorekeeper - Initialize fresh game
          playerStats = {};
          players.forEach(p => {
            playerStats[p.id] = {
              name: p.firstName + ' ' + p.lastName.charAt(0) + '.',
              points: 0, rebounds: 0, assists: 0, steals: 0,
              turnovers: 0, fouls: 0,
              twoPointersMade: 0, threePointersMade: 0, freeThrowsMade: 0
            };
          });
          opponentScore = 0;
          opponentFouls = 0;
          // Default starting lineup: Camden(2), Dean(6), Rylan(2), Raequan(1), Ashton(5)
          onCourt = [2, 6, 4, 1, 5];

          // Initialize new tracking fields
          gamePhase = 'pre';
          events = [];
          timeouts = { lancers: { first: 0, second: 0, OT: 0 }, opponent: { first: 0, second: 0, OT: 0 } };

          await docRef.set({
            gameId: currentGameId,
            isLive: true,
            opponentScore: 0,
            opponentFouls: 0,
            playerStats: playerStats,
            onCourt: onCourt,
            gamePhase: gamePhase,
            events: events,
            timeouts: timeouts,
            trackedBy: auth.currentUser.email,
            startedAt: getFirestoreTimestamp()
          });
        }

        // Real-time sync
        unsubscribe = docRef.onSnapshot(snapshot => {
          if (snapshot.exists) {
            const data = snapshot.data();
            playerStats = data.playerStats || playerStats;
            opponentScore = data.opponentScore || 0;
            opponentFouls = data.opponentFouls || 0;
            onCourt = data.onCourt || onCourt;
            // Sync new fields
            gamePhase = data.gamePhase || gamePhase;
            events = data.events || events;
            timeouts = data.timeouts || timeouts;
            phaseStartedAt = data.phaseStartedAt || phaseStartedAt;
            updateScoreboard();
            renderCourtPlayers();
            renderEventFeed();
            updatePhaseDisplay();
            // Update opponent foul display
            const oppFoulEl = document.getElementById('oppFoulCount');
            if (oppFoulEl) oppFoulEl.textContent = opponentFouls;
          }
        });
      } else {
        // Offline mode - only for non-viewers
        if (viewOnlyMode) {
          document.getElementById('court-players').innerHTML = `
            <div class="card" style="text-align: center; padding: 24px;">
              <p style="color: var(--text-secondary);">Cannot view live stats offline.</p>
            </div>
          `;
          return;
        }
        playerStats = {};
        players.forEach(p => {
          playerStats[p.id] = {
            name: p.firstName,
            points: 0, rebounds: 0, assists: 0, steals: 0,
            turnovers: 0, fouls: 0,
            twoPointersMade: 0, threePointersMade: 0, freeThrowsMade: 0
          };
        });
        onCourt = [2, 6, 4, 1, 5];
        gamePhase = 'pre';
        events = [];
        timeouts = { lancers: { first: 0, second: 0, OT: 0 }, opponent: { first: 0, second: 0, OT: 0 } };
      }

      renderCourtPlayers();
      updateScoreboard();
      renderEventFeed();
      updatePhaseDisplay();
      // Update opponent foul display
      const oppFoulEl = document.getElementById('oppFoulCount');
      if (oppFoulEl) oppFoulEl.textContent = opponentFouls;
    }

    function renderCourtPlayers() {
      const container = document.getElementById('court-players');

      // View-only mode: show ALL players with stats, no buttons, larger stats
      // On-court players first (sorted by position), then bench players (sorted by position)
      if (viewOnlyMode) {
        const courtPlayers = players.filter(p => onCourt.includes(p.id)).sort((a, b) => getPositionOrder(a) - getPositionOrder(b));
        const benchPlayers = players.filter(p => !onCourt.includes(p.id)).sort((a, b) => getPositionOrder(a) - getPositionOrder(b));
        const allPlayersSorted = [...courtPlayers, ...benchPlayers];

        container.innerHTML = allPlayersSorted.map(p => {
          const playerId = p.id;
          const s = playerStats[playerId] || {};
          const fouls = s.fouls || 0;
          const foulClass = fouls >= 5 ? 'fouled-out' : (fouls >= 4 ? 'foul-warning' : '');
          const isOnCourt = onCourt.includes(playerId);

          return `
            <div class="player-card ${foulClass}" style="${!isOnCourt ? 'opacity: 0.6;' : ''}">
              <div style="display: flex; align-items: center; padding: 8px 12px; background: var(--bg-elevated);">
                <div style="font-weight: 800; font-size: 1.1rem; color: var(--lancers-gold); min-width: 45px;">#${p.number}</div>
                <div style="font-weight: 600; font-size: 1rem; color: var(--text-primary); flex: 1;">${p.firstName} <span style="color: var(--text-secondary); font-size: 0.8rem;">${p.position}</span></div>
                ${isOnCourt ? '<span style="font-size: 0.7rem; color: #22C55E; font-weight: 700; background: rgba(34,197,94,0.15); padding: 2px 8px; border-radius: 4px;">ON COURT</span>' : '<span style="font-size: 0.7rem; color: var(--text-muted);">BENCH</span>'}
              </div>
              <div style="display: flex; justify-content: space-around; padding: 12px 8px; text-align: center;">
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--lancers-gold);">${s.points || 0}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">PTS</div>
                </div>
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${s.rebounds || 0}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">REB</div>
                </div>
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${s.assists || 0}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">AST</div>
                </div>
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${s.steals || 0}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">STL</div>
                </div>
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${s.turnovers || 0}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">TO</div>
                </div>
                <div style="flex: 1;">
                  <div style="font-size: 1.5rem; font-weight: 800; color: ${fouls >= 5 ? '#EF4444' : (fouls >= 4 ? '#F59E0B' : 'var(--text-primary)')};">${fouls}</div>
                  <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">FLS</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        return;
      }

      // Edit mode: show only on-court players with buttons
      const courtPlayersList = onCourt
        .map(id => players.find(pl => pl.id === id))
        .filter(p => p)
        .sort((a, b) => getPositionOrder(a) - getPositionOrder(b));

      container.innerHTML = courtPlayersList.map(p => {
        const playerId = p.id;
        const s = playerStats[playerId] || {};
        const fouls = s.fouls || 0;
        const foulClass = fouls >= 5 ? 'fouled-out' : (fouls >= 4 ? 'foul-warning' : '');
        const isEditing = editingPlayerId === playerId;

        return `
          <div class="player-card ${foulClass} ${isEditing ? 'editing' : ''}" id="card-${playerId}">
            <div class="player-row-1">
              <div class="player-num">#${p.number}</div>
              <div class="player-name">${p.firstName} <span style="color: var(--text-secondary); font-size: 0.75rem;">${p.position}</span></div>
              <div class="player-stats-row">
                <div class="stat-item pts"><span class="val">${s.points || 0}</span>p</div>
                <div class="stat-item"><span class="val">${s.rebounds || 0}</span>r</div>
                <div class="stat-item"><span class="val">${s.assists || 0}</span>a</div>
                <div class="stat-item"><span class="val">${s.steals || 0}</span>s</div>
                <div class="stat-item"><span class="val">${s.turnovers || 0}</span>t</div>
                <div class="stat-item ${fouls >= 5 ? 'foul-out' : (fouls >= 4 ? 'foul-warn' : '')}"><span class="val">${fouls}</span>f</div>
              </div>
            </div>
            <div class="player-row-2">
              ${isEditing ? `
                <div class="btn-group points">
                  <button class="stat-btn minus-btn" onclick="subPts(${playerId})">-P</button>
                </div>
                <div class="btn-group">
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'rebounds')">-R</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'assists')">-A</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'steals')">-S</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'turnovers')">-T</button>
                  <button class="stat-btn minus-btn" onclick="subStat(${playerId},'fouls')">-F</button>
                </div>
                <button class="edit-btn edit-confirm" onclick="toggleEdit(${playerId})">✓</button>
              ` : `
                <div class="btn-group points">
                  <button class="stat-btn pts" onclick="addPts(${playerId},2)">+2</button>
                  <button class="stat-btn pts" onclick="addPts(${playerId},3)">+3</button>
                  <button class="stat-btn pts" onclick="addPts(${playerId},1)">+1</button>
                </div>
                <div class="btn-group">
                  <button class="stat-btn pos" onclick="addStat(${playerId},'rebounds')">R</button>
                  <button class="stat-btn pos" onclick="addStat(${playerId},'assists')">A</button>
                  <button class="stat-btn pos" onclick="addStat(${playerId},'steals')">S</button>
                  <button class="stat-btn neg" onclick="addStat(${playerId},'turnovers')">T</button>
                  <button class="stat-btn neg" onclick="addStat(${playerId},'fouls')">F</button>
                </div>
                <button class="edit-btn" onclick="toggleEdit(${playerId})">✎</button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit(playerId) {
      editingPlayerId = editingPlayerId === playerId ? null : playerId;
      renderCourtPlayers();
    }

    // Stat functions with event logging
    async function addPts(playerId, pts) {
      const s = playerStats[playerId];
      if (!s) return;
      s.points = (s.points || 0) + pts;

      // Track shot type made
      if (pts === 2) {
        s.twoPointersMade = (s.twoPointersMade || 0) + 1;
      } else if (pts === 3) {
        s.threePointersMade = (s.threePointersMade || 0) + 1;
      } else if (pts === 1) {
        s.freeThrowsMade = (s.freeThrowsMade || 0) + 1;
      }

      // Check for recent assist (within last 10 seconds, by different player)
      let assistedBy = null;
      if (events.length > 0 && pts > 1) { // Only check for 2pt/3pt, not free throws
        const recentEvents = events.slice(-3); // Check last 3 events
        const now = Date.now();
        for (let i = recentEvents.length - 1; i >= 0; i--) {
          const e = recentEvents[i];
          if (e.stat === 'assists' && e.team === 'lancers' && e.playerId !== playerId) {
            const eventTime = e.timestamp.toDate ? e.timestamp.toDate().getTime() : e.timestamp;
            if (now - eventTime < 10000) { // Within 10 seconds
              assistedBy = getPlayerName(e.playerId);
              break;
            }
          }
        }
      }

      // Log event with current score
      const playerName = getPlayerName(playerId);
      const shotType = pts === 3 ? '3-pointer' : (pts === 2 ? '2 points' : 'free throw');
      const description = assistedBy
        ? `${playerName} scores ${shotType} (assisted by ${assistedBy})`
        : `${playerName} scores ${shotType}`;
      logEvent({
        type: 'stat',
        playerId: playerId,
        stat: 'points',
        value: pts,
        team: 'lancers',
        lancersScore: getLancersScore(),
        opponentScore: opponentScore,
        description: description
      });

      await saveStats();
      renderCourtPlayers();
      updateScoreboard();
    }

    async function subPts(playerId) {
      const s = playerStats[playerId];
      if (!s || (s.points || 0) <= 0) return;
      s.points = (s.points || 0) - 1;

      // Log correction event
      const playerName = getPlayerName(playerId);
      logEvent({
        type: 'stat',
        playerId: playerId,
        stat: 'points',
        value: -1,
        team: 'lancers',
        description: `${playerName} -1 point (correction)`
      });

      await saveStats();
      renderCourtPlayers();
      updateScoreboard();
    }

    const statLabels = {
      rebounds: 'rebound',
      assists: 'assist',
      steals: 'steal',
      turnovers: 'turnover',
      fouls: 'foul'
    };

    async function addStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s) return;
      s[stat] = (s[stat] || 0) + 1;

      const playerName = getPlayerName(playerId);
      const statLabel = statLabels[stat] || stat;

      // Special handling for assists - check if there was a recent basket to attribute
      if (stat === 'assists' && events.length > 0) {
        const now = Date.now();
        // Find recent scoring event by a different Lancers player (within last 10 seconds)
        for (let i = events.length - 1; i >= Math.max(0, events.length - 3); i--) {
          const e = events[i];
          if (e.stat === 'points' && e.team === 'lancers' && e.playerId !== playerId && e.value > 1) {
            const eventTime = e.timestamp.toDate ? e.timestamp.toDate().getTime() : e.timestamp;
            if (now - eventTime < 10000 && !e.description.includes('assisted by')) {
              // Update the previous scoring event to include assist
              e.description = e.description.replace(/scores (.+)$/, `scores $1 (assisted by ${playerName})`);
              renderEventFeed(); // Re-render to show updated description
              break;
            }
          }
        }
      }

      // Log event - include team foul total for fouls
      let description = `${playerName} ${statLabel}`;
      if (stat === 'fouls') {
        const teamFouls = Object.values(playerStats).reduce((sum, p) => sum + (p.fouls || 0), 0);
        description = `${playerName} foul (${teamFouls} team)`;
      }
      logEvent({
        type: 'stat',
        playerId: playerId,
        stat: stat,
        value: 1,
        team: 'lancers',
        description: description
      });

      if (stat === 'fouls' && s.fouls === 5) {
        logEvent({
          type: 'stat',
          playerId: playerId,
          stat: 'foulOut',
          team: 'lancers',
          description: `${playerName} FOULED OUT!`
        });
        showToast(s.name + ' fouled out!', 'warning');
      }
      await saveStats();
      renderCourtPlayers();
    }

    async function subStat(playerId, stat) {
      const s = playerStats[playerId];
      if (!s || (s[stat] || 0) <= 0) return;
      s[stat] = (s[stat] || 0) - 1;

      // Log correction event
      const playerName = getPlayerName(playerId);
      const statLabel = statLabels[stat] || stat;
      logEvent({
        type: 'stat',
        playerId: playerId,
        stat: stat,
        value: -1,
        team: 'lancers',
        description: `${playerName} -1 ${statLabel} (correction)`
      });

      await saveStats();
      renderCourtPlayers();
    }

    async function addOppScore(pts) {
      const oldScore = opponentScore;
      opponentScore = Math.max(0, opponentScore + pts);
      const actualChange = opponentScore - oldScore;

      // Log event with current score
      if (actualChange > 0) {
        const shotType = pts === 3 ? '3-pointer' : (pts === 2 ? '2 points' : 'free throw');
        logEvent({
          type: 'stat',
          stat: 'points',
          value: pts,
          team: 'opponent',
          lancersScore: getLancersScore(),
          opponentScore: opponentScore,
          description: `Opponent scores ${shotType}`
        });
      } else if (pts < 0) {
        logEvent({
          type: 'stat',
          stat: 'points',
          value: pts,
          team: 'opponent',
          lancersScore: getLancersScore(),
          opponentScore: opponentScore,
          description: `Opponent ${pts} point (correction)`
        });
      }

      await saveStats();
      updateScoreboard();
    }

    async function addOppFoul() {
      opponentFouls++;
      document.getElementById('oppFoulCount').textContent = opponentFouls;

      logEvent({
        type: 'stat',
        stat: 'fouls',
        value: 1,
        team: 'opponent',
        description: `Opponent foul (${opponentFouls} team)`
      });

      await saveStats();
    }

    function updateScoreboard() {
      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      document.getElementById('lancers-score').textContent = total;
      document.getElementById('opponent-score').textContent = opponentScore;
    }

    // Substitution Bottom Sheet
    function openSubModal() {
      selectedPlayerId = null;
      selectedFrom = null;
      renderSubModal();
      document.getElementById('sub-modal-overlay').classList.add('active');
      document.getElementById('sub-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSubModal() {
      selectedPlayerId = null;
      selectedFrom = null;
      document.getElementById('sub-modal-overlay').classList.remove('active');
      document.getElementById('sub-modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function renderSubModal() {
      // Sort both lists by position
      const benchPlayers = sortByPosition(players.filter(p => !onCourt.includes(p.id)));
      const courtPlayers = sortByPosition(players.filter(p => onCourt.includes(p.id)));

      // Hint text
      const hint = document.getElementById('sub-hint');
      if (selectedPlayerId) {
        const p = players.find(pl => pl.id === selectedPlayerId);
        if (selectedFrom === 'court') {
          hint.textContent = `Tap bench player to replace #${p.number} ${p.firstName}`;
        } else {
          hint.textContent = `Tap court player to swap out for #${p.number} ${p.firstName}`;
        }
      } else {
        hint.textContent = 'Tap any player to start substitution';
      }

      // On Court (now first)
      document.getElementById('court-players-modal').innerHTML = courtPlayers.map(p => {
        const s = playerStats[p.id] || {};
        const isSelected = selectedPlayerId === p.id && selectedFrom === 'court';
        return `
          <div class="sub-player ${isSelected ? 'selected' : ''}" onclick="selectCourtPlayer(${p.id})">
            <div class="num">#${p.number}</div>
            <div class="name">${p.firstName} <span style="opacity:0.6">${p.position}</span></div>
            <div class="stats">${s.points || 0}p ${s.rebounds || 0}r ${s.fouls || 0}f</div>
          </div>
        `;
      }).join('');

      // Bench
      document.getElementById('bench-players').innerHTML = benchPlayers.map(p => {
        const s = playerStats[p.id] || {};
        const isSelected = selectedPlayerId === p.id && selectedFrom === 'bench';
        return `
          <div class="sub-player ${isSelected ? 'swapping-in' : ''}" onclick="selectBenchPlayer(${p.id})">
            <div class="num">#${p.number}</div>
            <div class="name">${p.firstName} <span style="opacity:0.6">${p.position}</span></div>
            <div class="stats">${s.points || 0}p ${s.rebounds || 0}r ${s.fouls || 0}f</div>
          </div>
        `;
      }).join('') || '<p style="color: var(--text-secondary); padding: 12px;">All players on court</p>';
    }

    async function selectCourtPlayer(playerId) {
      // If tapping same player, unselect
      if (selectedPlayerId === playerId && selectedFrom === 'court') {
        selectedPlayerId = null;
        selectedFrom = null;
        renderSubModal();
        return;
      }

      // If bench player already selected, do the swap
      if (selectedPlayerId && selectedFrom === 'bench') {
        const idx = onCourt.indexOf(playerId);
        if (idx !== -1) {
          const playerOut = getPlayerName(playerId);
          const playerIn = getPlayerName(selectedPlayerId);
          onCourt[idx] = selectedPlayerId;

          // Log substitution event
          logEvent({
            type: 'sub',
            playerIn: selectedPlayerId,
            playerOut: playerId,
            description: `SUB: ${playerIn} in for ${playerOut}`
          });

          selectedPlayerId = null;
          selectedFrom = null;
          await saveStats();
          renderSubModal();
          renderCourtPlayers();
        }
        return;
      }

      // Select this court player
      selectedPlayerId = playerId;
      selectedFrom = 'court';
      renderSubModal();
    }

    async function selectBenchPlayer(playerId) {
      // If tapping same player, unselect
      if (selectedPlayerId === playerId && selectedFrom === 'bench') {
        selectedPlayerId = null;
        selectedFrom = null;
        renderSubModal();
        return;
      }

      // If court player already selected, do the swap
      if (selectedPlayerId && selectedFrom === 'court') {
        const idx = onCourt.indexOf(selectedPlayerId);
        if (idx !== -1) {
          const playerOut = getPlayerName(selectedPlayerId);
          const playerIn = getPlayerName(playerId);
          onCourt[idx] = playerId;

          // Log substitution event
          logEvent({
            type: 'sub',
            playerIn: playerId,
            playerOut: selectedPlayerId,
            description: `SUB: ${playerIn} in for ${playerOut}`
          });

          selectedPlayerId = null;
          selectedFrom = null;
          await saveStats();
          renderSubModal();
          renderCourtPlayers();
        }
        return;
      }

      // Select this bench player
      selectedPlayerId = playerId;
      selectedFrom = 'bench';
      renderSubModal();
    }

    async function endGame() {
      if (!confirm('End game and finalize stats?')) return;

      let total = 0;
      Object.values(playerStats).forEach(s => total += s.points || 0);
      const result = total > opponentScore ? 'W' : (total < opponentScore ? 'L' : 'T');
      const finalScore = `${total}-${opponentScore}`;

      // Log game end event
      const resultText = result === 'W' ? 'WIN' : (result === 'L' ? 'LOSS' : 'TIE');
      logEvent({
        type: 'phase',
        description: `FINAL: Lancers ${resultText} ${total}-${opponentScore}`
      });

      gamePhase = 'final';

      if (db) {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          isLive: false,
          isComplete: true,
          result: result,
          finalScore: finalScore,
          ourScore: total,
          lancersScore: total,
          opponentScore: opponentScore,
          gamePhase: 'final',
          events: events,
          endedAt: getFirestoreTimestamp()
        });
      }

      if (unsubscribe) unsubscribe();
      showToast('Game ended! Lancers ' + (result === 'W' ? 'WIN' : 'lose') + ' ' + total + '-' + opponentScore, result === 'W' ? 'success' : 'info');
      setTimeout(() => { window.location.href = 'schedule.html'; }, 2000);
    }

    async function saveStats() {
      if (!currentGameId || !db) return;
      try {
        await db.collection('gameStats').doc(currentGameId.toString()).update({
          playerStats: playerStats,
          opponentScore: opponentScore,
          opponentFouls: opponentFouls,
          onCourt: onCourt,
          gamePhase: gamePhase,
          events: events,
          timeouts: timeouts,
          lastUpdated: getFirestoreTimestamp()
        });
      } catch (e) {
        console.error('Error saving:', e);
        document.getElementById('connection-status').style.background = '#EF4444';
        setTimeout(() => document.getElementById('connection-status').style.background = '#22C55E', 2000);
      }
    }

    // Cleanup listener on page unload to prevent memory leaks
    window.addEventListener('beforeunload', () => {
      if (unsubscribe) unsubscribe();
    });
  </script>
</body>
</html>
