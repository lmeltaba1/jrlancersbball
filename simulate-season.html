    function log(elementId, text) {
      const el = document.getElementById(elementId);

    function generatePlayerStats(player, isStarter, teamTotalPoints) {
      const maxPoints = isStarter ? Math.floor(teamTotalPoints * 0.35) : Math.floor(teamTotalPoints * 0.15);
      const points = Math.floor(Math.random() * maxPoints);
      const threes = Math.floor(Math.random() * Math.min(3, Math.floor(points / 3)));
      const remainingPoints = points - (threes * 3);
      const twos = Math.floor(remainingPoints / 2);
      const actualPoints = (twos * 2) + (threes * 3);
      const ftMade = Math.floor(Math.random() * 3);

      return {
        name: `${player.firstName} ${player.lastName.charAt(0)}.`,
        points: actualPoints,
        rebounds: Math.floor(Math.random() * (isStarter ? 8 : 4)),
        assists: Math.floor(Math.random() * (isStarter ? 5 : 2)),
        steals: Math.floor(Math.random() * 3),
        blocks: Math.floor(Math.random() * 2),
        turnovers: Math.floor(Math.random() * 3),
        fouls: Math.floor(Math.random() * 4),
        twoPointersMade: twos,
        twoPointersAttempted: twos + Math.floor(Math.random() * 4),
        threePointersMade: threes,
        threePointersAttempted: threes + Math.floor(Math.random() * 3),
        freeThrowsMade: ftMade,
        freeThrowsAttempted: ftMade + Math.floor(Math.random() * 2)
      };
    }

    // Generate game stats exactly like the scorekeeper would
    function generateGameStats(game) {
      const playerStats = {};
      let totalPoints = 0;

      players.forEach((player, index) => {
        const isStarter = index < 5;
        const stats = generatePlayerStats(player, isStarter, game.ourScore);
        playerStats[player.id] = stats;
        totalPoints += stats.points;
      });

      // Adjust to match actual score
      let diff = game.ourScore - totalPoints;
      while (diff !== 0) {
        const randomPlayer = players[Math.floor(Math.random() * players.length)];
        const pStats = playerStats[randomPlayer.id];
        if (diff > 0 && diff >= 2) {
          pStats.points += 2;
          pStats.twoPointersMade += 1;
          pStats.twoPointersAttempted += 1;
          diff -= 2;
        } else if (diff < 0 && pStats.points >= 2) {
          pStats.points -= 2;
          pStats.twoPointersMade = Math.max(0, pStats.twoPointersMade - 1);
          diff += 2;
        } else {
          break;
        }
      }

      // Recalculate lancers score from player stats (like real app does)
      const lancersScore = Object.values(playerStats).reduce((sum, s) => sum + (s.points || 0), 0);
      const result = lancersScore > game.theirScore ? 'W' : (lancersScore < game.theirScore ? 'L' : 'T');
      const finalScore = `${lancersScore}-${game.theirScore}`;

      // Match exact format from game-stats.html endGame()
      return {
        gameId: game.id,
        playerStats: playerStats,
        opponentScore: game.theirScore,
        onCourt: [1, 2, 3, 4, 5],
        // Fields added when game ends
        isLive: false,
        isComplete: true,
        result: result,
        finalScore: finalScore,
        lancersScore: lancersScore,
        ourScore: lancersScore,
        endedAt: firebase.firestore.Timestamp.fromDate(new Date(game.date + 'T12:00:00')),
        lastUpdated: firebase.firestore.Timestamp.fromDate(new Date(game.date + 'T12:00:00'))
      };
    }

      } catch (e) {
        status.innerHTML = '<span class="error">Error: ' + e.message + '</span>';
        console.error(e);
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
