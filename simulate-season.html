<button onclick="runSimulation()" style="background: #FFD700; color: #000; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 10px; font-weight: bold;">Run Full Simulation</button>

<div id="status" style="margin-top: 15px;">Checking auth...</div>

  { id: 3, firstName: 'Grant', lastName: 'Weltz', number: 14 },

  { id: 5, firstName: 'Ashton', lastName: 'Carney', number: 22 },

function log(msg) {
  document.getElementById('status').innerHTML += msg + '<br>';
  document.getElementById('status').scrollTop = document.getElementById('status').scrollHeight;
}

async function deleteFakeHighlights() {
  document.getElementById('status').innerHTML = '';
  log('<b>DELETING FAKE HIGHLIGHTS</b>');
  log('================');
  log('');

  if (!auth.currentUser) {
    log('<span style="color: #EF4444;">Not logged in. Please wait for auth...</span>');
    return;
  }

  log('Finding highlights with fake URLs (example.com)...');

  try {
    const snapshot = await db.collection('highlights').get();
    let deleted = 0;

    for (const doc of snapshot.docs) {
      const data = doc.data();
      const url = data.url || data.downloadUrl || '';

      if (url.includes('example.com')) {
        await doc.ref.delete();
        deleted++;
        log(`  Deleted: ${doc.id} (${data.playerName || 'Unknown'})`);
      }
    }

    log('');
    log('================');
    log(`<b style="color: #22C55E;">Done! Deleted ${deleted} fake highlights.</b>`);
    log('');
    log('<a href="highlights.html">View Highlights</a>');
  } catch (e) {
    log(`<span style="color: #EF4444;">ERROR: ${e.message}</span>`);
    console.error(e);
  }
}

async function deleteIncompleteGames() {
  document.getElementById('status').innerHTML = '';
  log('<b>DELETING INCOMPLETE GAMES</b>');
  log('================');
  log('');

  if (!auth.currentUser) {
    log('<span style="color: #EF4444;">Not logged in. Please wait for auth...</span>');
    return;
  }

  log('Finding games without gamePhase=final...');

  try {
    const snapshot = await db.collection('gameStats').get();
    let deleted = 0;

    for (const doc of snapshot.docs) {
      const data = doc.data();
      // Delete if not complete (gamePhase !== 'final' and isComplete !== true)
      if (data.gamePhase !== 'final' && !data.isComplete) {
        await doc.ref.delete();
        deleted++;
        log(`  Deleted: Game ${doc.id} (phase: ${data.gamePhase || 'none'})`);
      }
    }

    log('');
    log('================');
    log(`<b style="color: #22C55E;">Done! Deleted ${deleted} incomplete games.</b>`);
    log('');
    log('<a href="stats-view.html">View Stats</a>');
  } catch (e) {
    log(`<span style="color: #EF4444;">ERROR: ${e.message}</span>`);
    console.error(e);
  }
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function parseGameTime(dateStr, timeStr) {
  const [time, period] = timeStr.split(' ');
  let [hours, minutes] = time.split(':').map(Number);
  if (period === 'PM' && hours !== 12) hours += 12;
  if (period === 'AM' && hours === 12) hours = 0;
  return new Date(`${dateStr}T${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:00`);
}

function generatePlayByPlay(gameId, gameDate, gameTime, playerStats, opponentScore) {
  const events = [];
  const gameStart = parseGameTime(gameDate, gameTime);
  let currentTime = new Date(gameStart);
  let eventId = 0;

  const addEvent = (phase, type, description, extras = {}) => {
    events.push({
      id: `evt-${gameId}-${eventId++}`,
      timestamp: firebase.firestore.Timestamp.fromDate(new Date(currentTime)),
      gamePhase: phase,
      type,
      description,
      ...extras
    });
    currentTime = new Date(currentTime.getTime() + randomInt(5000, 30000));
  };

  addEvent('Q1', 'phase', 'Q1 started');

  const quarters = ['Q1', 'Q2', 'Q3', 'Q4'];
  let lancersRunningScore = 0;
  let oppRunningScore = 0;
  let teamFouls = 0;

  for (const quarter of quarters) {
    if (quarter === 'Q3') {
      addEvent('halftime', 'phase', 'HALFTIME');
      currentTime = new Date(currentTime.getTime() + 10 * 60 * 1000);
      addEvent('Q3', 'phase', 'Q3 started');
    } else if (quarter !== 'Q1') {
      addEvent(quarter, 'phase', `${quarter} started`);
    }

    const playsThisQ = randomInt(10, 18);
    for (let i = 0; i < playsThisQ; i++) {
      const playType = randomInt(1, 10);

      if (playType <= 4) {
        const scoringPlayers = Object.entries(playerStats).filter(([id, s]) => s.points > 0);
        if (scoringPlayers.length > 0) {
          const [playerId, stats] = pickRandom(scoringPlayers);
          const pts = randomInt(1, 3) === 3 ? 3 : 2;
          lancersRunningScore += pts;
          const shotType = pts === 3 ? '3-pointer' : '2 points';

          if (randomInt(1, 3) === 1) {
            const otherPlayers = Object.entries(playerStats).filter(([id, s]) => id !== playerId && s.assists > 0);
            if (otherPlayers.length > 0) {
              const [assisterId, assisterStats] = pickRandom(otherPlayers);
              addEvent(quarter, 'stat', `${stats.name} scores ${shotType} (assisted by ${assisterStats.name})`, {
                playerId: parseInt(playerId), stat: 'points', value: pts, team: 'lancers',
                lancersScore: lancersRunningScore, opponentScore: oppRunningScore
              });
              continue;
            }
          }
          addEvent(quarter, 'stat', `${stats.name} scores ${shotType}`, {
            playerId: parseInt(playerId), stat: 'points', value: pts, team: 'lancers',
            lancersScore: lancersRunningScore, opponentScore: oppRunningScore
          });
        }
      } else if (playType <= 6) {
        const pts = randomInt(1, 3) === 3 ? 3 : 2;
        oppRunningScore += pts;
        addEvent(quarter, 'stat', `Opponent scores ${pts === 3 ? '3-pointer' : '2 points'}`, {
          stat: 'points', value: pts, team: 'opponent',
          lancersScore: lancersRunningScore, opponentScore: oppRunningScore
        });
      } else if (playType === 7) {
        const rebounders = Object.entries(playerStats).filter(([id, s]) => s.rebounds > 0);
        if (rebounders.length > 0) {
          const [playerId, stats] = pickRandom(rebounders);
          addEvent(quarter, 'stat', `${stats.name} rebound`, {
            playerId: parseInt(playerId), stat: 'rebounds', value: 1, team: 'lancers'
          });
        }
      } else if (playType === 8) {
        const stealers = Object.entries(playerStats).filter(([id, s]) => s.steals > 0);
        if (stealers.length > 0) {
          const [playerId, stats] = pickRandom(stealers);
          addEvent(quarter, 'stat', `${stats.name} steal`, {
            playerId: parseInt(playerId), stat: 'steals', value: 1, team: 'lancers'
          });
        }
      } else if (playType === 9) {
        const foulers = Object.entries(playerStats).filter(([id, s]) => s.fouls > 0);
        if (foulers.length > 0) {
          const [playerId, stats] = pickRandom(foulers);
          teamFouls++;
          addEvent(quarter, 'stat', `${stats.name} foul (${teamFouls} team)`, {
            playerId: parseInt(playerId), stat: 'fouls', value: 1, team: 'lancers'
          });
        }
      } else {
        const team = randomInt(1, 2) === 1 ? 'lancers' : 'opponent';
        addEvent(quarter, 'timeout', `${team === 'lancers' ? 'Lancers' : 'Opponent'} TIMEOUT (1 left)`, { team });
      }
    }
  }

  const result = lancersRunningScore > oppRunningScore ? 'WIN' : 'LOSS';
  addEvent('final', 'phase', `FINAL: Lancers ${result} ${lancersRunningScore}-${oppRunningScore}`);
  return events;
}

function generatePlayerStats(isWin) {
  const stats = {};
  const basePoints = isWin ? randomInt(30, 48) : randomInt(20, 35);
  let pointsLeft = basePoints;

  const starters = [1, 2, 3, 4, 5, 6];
  for (const player of PLAYERS) {
    const isStarter = starters.includes(player.id);
    const maxPts = isStarter ? randomInt(4, 14) : randomInt(0, 8);
    const pts = Math.min(maxPts, pointsLeft);
    pointsLeft = Math.max(0, pointsLeft - pts);

    stats[player.id] = {
      name: player.firstName + ' ' + player.lastName.charAt(0) + '.',
      points: pts,
      rebounds: randomInt(0, 7),
      assists: randomInt(0, 5),
      steals: randomInt(0, 4),
      turnovers: randomInt(0, 3),
      fouls: randomInt(0, 4),
      twoPointersMade: Math.floor(pts * 0.6 / 2),
      threePointersMade: Math.floor(pts * 0.2 / 3),
      freeThrowsMade: pts % 2
    };
  }
  return stats;
}

auth.onAuthStateChanged(user => {
  if (!user) {
    document.getElementById('status').textContent = 'Please log in first at login.html';
    return;
  }
  document.getElementById('status').innerHTML = '<span style="color: #22C55E;">Ready.</span> Click a button above to run.';
});

async function runSimulation() {
  if (!auth.currentUser) {
    document.getElementById('status').textContent = 'Please log in first';
    return;
  }

  document.getElementById('status').innerHTML = '';
  log('<b>SEASON SIMULATION</b>');
  log('================');
  log('');

  try {
    // Step 1: Clear existing data
    log('<b>Step 1: Clearing simulation data (gameStats, volunteers, attendance, highlights)...</b>');

    for (const collection of ['gameStats', 'volunteers', 'attendance', 'highlights']) {
      const snap = await db.collection(collection).get();
      let count = 0;
      for (const doc of snap.docs) {
        await doc.ref.delete();
        count++;
      }
      log(`  Deleted ${count} docs from ${collection}`);
    }

    // Step 2: Volunteers for ALL games (1-6)
    log('');
    log('<b>Step 2: Creating volunteers for games 1-6...</b>');

    const volunteerAssignments = [
      // Past games (completed)
      { gameId: 1, scorekeeper: SCOREKEEPERS[0], tableWorker: TABLE_WORKERS[3] }, // Mindy, Gregg
      { gameId: 2, scorekeeper: SCOREKEEPERS[1], tableWorker: TABLE_WORKERS[5] }, // Bailey, Drew
      { gameId: 3, scorekeeper: SCOREKEEPERS[0], tableWorker: TABLE_WORKERS[7] }, // Mindy, Kevin
      // Current and future games
      { gameId: 4, scorekeeper: SCOREKEEPERS[0], tableWorker: TABLE_WORKERS[2] }, // Mindy, Melissa
      { gameId: 5, scorekeeper: SCOREKEEPERS[1], tableWorker: TABLE_WORKERS[4] }, // Bailey, Carey
      { gameId: 6, scorekeeper: SCOREKEEPERS[0], tableWorker: TABLE_WORKERS[9] }  // Mindy, Jillian
    ];

    for (const { gameId, scorekeeper, tableWorker } of volunteerAssignments) {
      await db.collection('volunteers').doc(gameId.toString()).set({
        scorekeeper: {
          name: scorekeeper.name,
          email: scorekeeper.email,
          playerId: scorekeeper.playerId,
          signedUpAt: firebase.firestore.FieldValue.serverTimestamp()
        },
        tableWorker: {
          name: tableWorker.name,
          email: tableWorker.email,
          playerId: tableWorker.playerId,
          signedUpAt: firebase.firestore.FieldValue.serverTimestamp()
        }
      });
      log(`  Game ${gameId}: Scorekeeper=${scorekeeper.name}, Table=${tableWorker.name}`);
    }

    // Step 3: Attendance for games 1-6
    log('');
    log('<b>Step 3: Creating attendance for games 1-6...</b>');

    for (const game of GAMES) {
      const attendance = {};
      for (const player of PLAYERS) {
        const rand = randomInt(1, 10);
        attendance[player.id] = {
          status: rand <= 8 ? 'yes' : (rand <= 9 ? 'maybe' : 'no'),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
      }
      await db.collection('attendance').doc(game.id.toString()).set(attendance);
      const yesCount = Object.values(attendance).filter(a => a.status === 'yes').length;
      log(`  Game ${game.id} (${game.opponent}): ${yesCount}/10 confirmed`);
    }

    // Step 4: Completed game stats for games 1-3
    log('');
    log('<b>Step 4: Creating completed game stats (games 1-3)...</b>');

    const gameResults = [
      { id: 1, win: true, oppScore: 24 },
      { id: 2, win: false, oppScore: 38 },
      { id: 3, win: true, oppScore: 26 }
    ];

    const allGameEvents = {};

    for (const result of gameResults) {
      const game = GAMES.find(g => g.id === result.id);
      const playerStats = generatePlayerStats(result.win);
      const ourScore = Object.values(playerStats).reduce((sum, p) => sum + p.points, 0);
      const events = generatePlayByPlay(result.id, game.date, game.time, playerStats, result.oppScore);
      allGameEvents[result.id] = events;

      await db.collection('gameStats').doc(result.id.toString()).set({
        gameId: result.id,
        isLive: false,
        isComplete: true,
        result: result.win ? 'W' : 'L',
        finalScore: `${ourScore}-${result.oppScore}`,
        ourScore: ourScore,
        lancersScore: ourScore,
        opponentScore: result.oppScore,
        opponentFouls: randomInt(6, 14),
        playerStats: playerStats,
        onCourt: [2, 6, 4, 1, 5],
        gamePhase: 'final',
        events: events,
        timeouts: { lancers: { first: 1, second: 1, OT: 0 }, opponent: { first: 1, second: 1, OT: 0 } },
        trackedBy: 'simulation@lancers.com',
        startedAt: firebase.firestore.Timestamp.fromDate(parseGameTime(game.date, game.time)),
        endedAt: firebase.firestore.Timestamp.fromDate(new Date(parseGameTime(game.date, game.time).getTime() + 75 * 60 * 1000))
      });

      log(`  Game ${result.id} vs ${game.opponent}: ${result.win ? 'W' : 'L'} ${ourScore}-${result.oppScore} (${events.length} events)`);
    }

    // Step 5: Highlights with matching timestamps
    log('');
    log('<b>Step 5: Creating highlights with play-by-play matching timestamps...</b>');

    let highlightNum = 0;
    for (const gameId of [1, 2, 3]) {
      const events = allGameEvents[gameId];
      const scoringEvents = events.filter(e => e.stat === 'points' && e.team === 'lancers' && e.playerId);

      const numHighlights = Math.min(randomInt(3, 5), scoringEvents.length);
      const selectedEvents = scoringEvents.sort(() => Math.random() - 0.5).slice(0, numHighlights);

      for (const event of selectedEvents) {
        const player = PLAYERS.find(p => p.id === event.playerId);
        if (!player) continue;

        // Highlight captured 1-7 seconds BEFORE scorekeeper records (realistic timing)
        const eventTime = event.timestamp.toDate().getTime();
        const highlightTime = new Date(eventTime - randomInt(1000, 7000)); // 1-7 sec before

        highlightNum++;
        await db.collection('highlights').add({
          gameId: gameId,
          playerId: player.id,
          playerName: `${player.firstName} ${player.lastName}`,
          type: 'video',
          url: `https://storage.example.com/highlights/game${gameId}_highlight${highlightNum}.mp4`,
          thumbnailUrl: `https://storage.example.com/thumbnails/game${gameId}_highlight${highlightNum}.jpg`,
          description: event.description,
          timestamp: firebase.firestore.Timestamp.fromDate(highlightTime),
          uploadedBy: auth.currentUser.uid,  // Must match current user's UID per Firestore rules
          uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
          _matchedEventId: event.id // For verification
        });

        log(`  Highlight ${highlightNum}: Game ${gameId} - ${player.firstName}`);
        log(`    -> Captured ${Math.round((eventTime - highlightTime.getTime())/1000)}s before: "${event.description}"`);
      }
    }

    log('');
    log('================');
    log('<b style="color: #22C55E;">SIMULATION COMPLETE!</b>');
    log('');
    log('Summary:');
    log(`  - Volunteers: Games 1-6 (real parents only, no coaches)`);
    log(`  - Attendance: Games 1-6`);
    log(`  - Completed Games: 1, 2, 3 with full play-by-play`);
    log(`  - Highlights: ${highlightNum} with matching timestamps`);
    log('');
    log('<a href="index.html">Home</a> | <a href="roster.html">Player Stats</a> | <a href="schedule.html">Schedule</a> | <a href="highlights.html">Highlights</a>');

  } catch (e) {
    log(`<span style="color: #EF4444;">ERROR: ${e.message}</span>`);
    console.error(e);
  }
}
</script>
