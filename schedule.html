<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 style="display: flex; align-items: center; gap: 10px;">
        <a onclick="history.back()" role="button" aria-label="Go back" tabindex="0" onkeydown="if(event.key==='Enter')history.back()" style="color: white; cursor: pointer; display: flex; align-items: center;">

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />

        </a>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.jpg?v=2" alt="Lancers" class="header-logo" width="36" height="36">

          </svg>
        </button>
        <div id="profileBtnWrapper" style="position: relative; display: none;">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          <div id="profileMenu" style="display: none; position: absolute; top: 44px; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
              <div id="profileName" style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">User</div>
              <div id="profileEmail" style="font-size: 0.8rem; color: var(--text-secondary); word-break: break-all;"></div>
            </div>
            <div id="playerSwitcher" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Switch Player</div>

            <!-- Emulate User (admin only) -->
            <div id="emulateSection" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Emulate User</div>
              <select id="emulateSelect" onchange="emulateUser(this.value)" style="width: 100%; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem;">
                <option value="">-- Select User --</option>

            </div>
            <div style="padding: 8px;">
              <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: transparent; border: none; color: #EF4444; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;">

                </svg>

          </div>

      </div>

  <!-- Emulation Banner (shown when admin is emulating another user) -->
  <div id="emulationBanner" style="display: none; background: #7C3AED; color: white; padding: 8px 16px; text-align: center; font-size: 0.85rem; font-weight: 600;">
    <span id="emulationText">Viewing as: </span>
    <button onclick="stopEmulation()" style="background: white; color: #7C3AED; border: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; margin-left: 12px; cursor: pointer;">Stop</button>
  </div>

  <!-- Main Content -->
  <main class="main-content" aria-live="polite">
    <!-- Sticky Section: Season Record + Filter Tabs -->
    <div id="sticky-section" style="position: sticky; top: 0; z-index: 100; background: var(--bg-body); margin: 0 -16px; padding: 0 16px;">
      <!-- Season Record -->
      <div class="card" style="margin-bottom: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div class="card-title" style="margin-bottom: 4px;">Season Record</div>
            <div id="season-record" style="font-size: 1.5rem; font-weight: 800; color: var(--lancers-gold);">-- - --</div>
          </div>
          <div id="record-breakdown" style="text-align: right; font-size: 0.75rem; color: var(--text-secondary);"></div>

      </div>

      <!-- Filter Tabs -->

        <button class="section-tab active" data-filter="all">All</button>
        <button class="section-tab" data-filter="games">Games</button>
        <button class="section-tab" data-filter="parkrock">Park Rock</button>
        <button class="section-tab" data-filter="cnr">CNR</button>

    </div>
    <!-- Schedule List -->
    <div class="schedule-list" id="schedule-list">
      <div style="text-align: center; padding: 40px;">
        <div class="spinner" style="margin: 0 auto;"></div>
      </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      const menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(() => { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayers, currentPlayerId) {
      if (!allPlayers || allPlayers.length <= 1) return;
      const switcher = document.getElementById('playerSwitcher');
      const buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayers.map(p => {
        const isActive = p.id === currentPlayerId;
        return `<button onclick="switchPlayer(${p.id})" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ${isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)'}; color: ${isActive ? '#000' : 'var(--text-primary)'}; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">#${escapeHtml(p.number)} ${escapeHtml(p.firstName)}</button>`;
      }).join('');
    }
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('profileBtnWrapper');
      const menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      const select = document.getElementById('emulateSelect');
      if (!select) return;
      const users = await getAllRosterUsers();
      const currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(u => {
          const selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return `<option value="${escapeHtml(u.email)}" ${selected ? 'selected' : ''}>${escapeHtml(u.name)} (${escapeHtml(u.role)}${u.player ? ' - ' + escapeHtml(u.player) : ''})</option>`;
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      const banner = document.getElementById('emulationBanner');
      const text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    // getCurrentDate(), loadSchedule(), formatDate() defined in app.js

    // Check if current time is within game window (15 min before to 90 min after)
    function isInGameWindow(gameDate, gameTime) {
      const [year, month, day] = gameDate.split('-').map(Number);
      const timeParts = gameTime.match(/(\d+):(\d+)\s*(AM|PM)/i);
      if (!timeParts) return false;

      let hours = parseInt(timeParts[1]);
      const mins = parseInt(timeParts[2]);
      const ampm = timeParts[3].toUpperCase();

      if (ampm === 'PM' && hours !== 12) hours += 12;
      if (ampm === 'AM' && hours === 12) hours = 0;

      const gameStart = new Date(year, month - 1, day, hours, mins, 0);
      const now = getCurrentDate();

      const windowStart = new Date(gameStart.getTime() - 15 * 60 * 1000); // 15 min before
      const windowEnd = new Date(gameStart.getTime() + 90 * 60 * 1000);   // 90 min after

      return now >= windowStart && now <= windowEnd;
    }

    let allEvents = [];
    let volunteers = {};
    let attendance = {}; // gameId -> { attending: N, notAttending: N, noResponse: N }
    let gameResults = {}; // gameId -> { result: 'W'/'L', finalScore: '45-32', lancersScore, opponentScore }
    let totalPlayers = 0;
    let currentFilter = 'all';
    // currentUserInfo is in js/firebase-config.js
    // leagueNames is in js/app.js

    const eventTypeNames = {
      practice: 'Practice',
      event: 'Event'
    };

    document.addEventListener('DOMContentLoaded', async function() {
      // Set sticky section position based on actual header height
      const header = document.querySelector('header.header');
      const stickySection = document.getElementById('sticky-section');
      if (header && stickySection) {
        const headerHeight = header.offsetHeight;
        stickySection.style.top = headerHeight + 'px';
      }

      // Require auth - all users can view schedule
      requireAuth().then(async function(userInfo) {
        currentUserInfo = userInfo; // Store for use in renderSchedule
        if (userInfo.isViewer) hideViewerRestrictedNav();
        // Show profile button
        const profileWrapper = document.getElementById('profileBtnWrapper');
        if (profileWrapper) profileWrapper.style.display = 'block';
        document.getElementById('profileName').textContent = userInfo.name || 'User';
        document.getElementById('profileEmail').textContent = auth.currentUser.email;
        if (userInfo.allPlayers && userInfo.allPlayers.length > 1) {
          populatePlayerSwitcher(userInfo.allPlayers, userInfo.player ? userInfo.player.id : null);
        }
        // Show emulation controls for admin
        if (userInfo.isRealAdmin) {
          const emulateSection = document.getElementById('emulateSection');
          if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
        }
        if (userInfo.isEmulating) { showEmulationBanner(userInfo.emulatedEmail); }
        loadPageContent();
      }).catch(function(err) {
        console.log('Auth required:', err);
      });
    });

    async function loadPageContent() {
      // Load schedule and roster
      try {
        const [scheduleData, rosterData] = await Promise.all([
          loadSchedule(),
          loadRoster()
        ]);

        totalPlayers = (rosterData.players || []).length;

        allEvents = scheduleData.games || [];
        if (scheduleData.events) {
          allEvents = allEvents.concat(scheduleData.events);
        }
        allEvents.sort((a, b) => new Date(a.date) - new Date(b.date));

        // Load game results and attendance from Firestore
        if (db) {
          try {
            // Load game stats (results) - check for data from endGame()
            const gameStatsSnapshot = await db.collection('gameStats').get();
            gameStatsSnapshot.forEach(doc => {
              const data = doc.data();
              // Check for completed games - use result/finalScore from endGame() or calculate from scores
              if (data.result && data.finalScore) {
                // Game ended properly with endGame()
                gameResults[doc.id] = {
                  result: data.result,
                  finalScore: data.finalScore,
                  lancersScore: data.lancersScore || data.ourScore,
                  opponentScore: data.opponentScore
                };
              } else if (data.isComplete && data.ourScore !== undefined && data.opponentScore !== undefined) {
                // Fallback: calculate from scores
                const result = data.ourScore > data.opponentScore ? 'W' : (data.ourScore < data.opponentScore ? 'L' : 'T');
                gameResults[doc.id] = {
                  result: result,
                  finalScore: `${data.ourScore}-${data.opponentScore}`,
                  lancersScore: data.ourScore,
                  opponentScore: data.opponentScore
                };
              }
            });

            // Merge results into allEvents
            allEvents = allEvents.map(event => {
              if (gameResults[event.id]) {
                return { ...event, ...gameResults[event.id] };
              }
              return event;
            });

            // Load attendance data
            const attendanceSnapshot = await db.collection('attendance').get();
            const attendanceByGame = {};
            attendanceSnapshot.forEach(doc => {
              const data = doc.data();
              const gameId = data.gameId;
              if (!attendanceByGame[gameId]) {
                attendanceByGame[gameId] = { attending: 0, notAttending: 0, respondedIds: new Set() };
              }
              if (data.attending) {
                attendanceByGame[gameId].attending++;
              } else {
                attendanceByGame[gameId].notAttending++;
              }
              attendanceByGame[gameId].respondedIds.add(data.playerId);
            });

            // Calculate no response for each game
            for (const gameId in attendanceByGame) {
              const responded = attendanceByGame[gameId].respondedIds.size;
              attendanceByGame[gameId].noResponse = totalPlayers - responded;
              delete attendanceByGame[gameId].respondedIds;
            }
            attendance = attendanceByGame;

            // Load volunteer data
            const volunteersSnapshot = await db.collection('volunteers').get();
            volunteersSnapshot.forEach(doc => {
              volunteers[doc.id] = doc.data();
            });
          } catch (e) {
            console.log('Could not load Firestore data:', e);
          }
        }

        renderSchedule();
        updateRecord();
      } catch (e) {
        console.error('Error loading schedule:', e);
        document.getElementById('schedule-list').innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Error loading schedule</p>';
      }

      // Tab switching
      document.querySelectorAll('.section-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderSchedule();
        });
      });
    }

    function updateRecord() {
      let wins = 0, losses = 0;
      let parkrockWins = 0, parkrockLosses = 0;
      let cnrWins = 0, cnrLosses = 0;

      allEvents.forEach(event => {
        if (event.type === 'game' || event.league) {
          if (event.result === 'W') {
            wins++;
            if (event.league === 'parkrock') parkrockWins++;
            else if (event.league === 'cnr') cnrWins++;
          } else if (event.result === 'L') {
            losses++;
            if (event.league === 'parkrock') parkrockLosses++;
            else if (event.league === 'cnr') cnrLosses++;
          }
        }
      });

      document.getElementById('season-record').textContent = `${wins} - ${losses}`;
      document.getElementById('record-breakdown').innerHTML = `
        <div>Park Rock: ${parkrockWins}-${parkrockLosses}</div>
        <div>CNR: ${cnrWins}-${cnrLosses}</div>
      `;
    }

    function renderSchedule() {
      const container = document.getElementById('schedule-list');
      let filtered;

      if (currentFilter === 'all') {
        filtered = allEvents;
      } else if (currentFilter === 'games') {
        filtered = allEvents.filter(e => e.type === 'game' || e.league);
      } else {
        filtered = allEvents.filter(e => e.league === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">No events scheduled</p>';
        return;
      }

      container.innerHTML = filtered.map(event => {
        const dateInfo = formatDate(event.date);
        const isGame = event.type === 'game' || event.league;

        if (isGame) {
          // Render game card
          const vol = volunteers[event.id] || {};
          let resultHtml = '';
          if (event.result) {
            const isWin = event.result === 'W';
            const isTie = event.result === 'T';
            const scoreDisplay = event.finalScore || '';
            resultHtml = `
              <div class="game-result ${isWin ? 'win' : (isTie ? 'tie' : 'loss')}">
                ${isWin ? 'W' : (isTie ? 'T' : 'L')} ${scoreDisplay}
              </div>
            `;
          }

          let volunteerHtml = '';
          if (!event.result) {
            volunteerHtml = `
              <div class="volunteer-status">
                <span class="volunteer-slot ${vol.scorekeeper ? 'filled' : 'empty'}">
                  ${vol.scorekeeper ? '&#10003;' : '&#9888;'} Scorekeeper${vol.scorekeeper ? ': ' + vol.scorekeeper.name.split(' ')[0] : ': NEEDED'}
                </span>
                ${event.league === 'cnr' ? `
                  <span class="volunteer-slot ${vol.tableWorker ? 'filled' : 'empty'}">
                    ${vol.tableWorker ? '&#10003;' : '&#9888;'} Table${vol.tableWorker ? ': ' + vol.tableWorker.name.split(' ')[0] : ': NEEDED'}
                  </span>
                ` : ''}
              </div>
            `;
          }

          // Attendance status for upcoming games
          let attendanceHtml = '';
          if (!event.result) {
            const att = attendance[event.id] || { attending: 0, notAttending: 0, noResponse: totalPlayers };
            attendanceHtml = `
              <div style="display: flex; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.75rem;">
                <span style="color: #22C55E;">&#10003; ${att.attending}</span>
                <span style="color: #EF4444;">&#10007; ${att.notAttending}</span>
                <span style="color: #6B7280;">? ${att.noResponse}</span>
              </div>
            `;
          }

          // Live stats button (only within game window: 15 min before to 90 min after)
          let trackStatsBtnHtml = '';
          if (!event.result) {
            const inGameWindow = isInGameWindow(event.date, event.time);

            if (inGameWindow && currentUserInfo) {
              const effectiveEmail = (currentUserInfo.emulatedEmail || (auth.currentUser && auth.currentUser.email) || '').toLowerCase();
              const isScorekeeper = vol.scorekeeper && vol.scorekeeper.email.toLowerCase() === effectiveEmail;
              const isCoach = currentUserInfo.isCoach;

              if (isCoach) {
                // Coach gets both buttons
                trackStatsBtnHtml = `
                  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 8px;">
                    <a href="game-stats.html?game=${event.id}" class="btn btn-primary" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: #22C55E; font-size: 0.8rem; padding: 10px;" onclick="event.stopPropagation();">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                      </svg>
                      Track
                    </a>
                    <a href="game-stats.html?game=${event.id}&view=1" class="btn btn-primary" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.8rem; padding: 10px;" onclick="event.stopPropagation();">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                      Follow
                    </a>
                  </div>
                `;
              } else if (isScorekeeper) {
                // Scorekeeper gets Track button only
                trackStatsBtnHtml = `
                  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                    <a href="game-stats.html?game=${event.id}" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #22C55E; font-size: 0.85rem; padding: 10px;" onclick="event.stopPropagation();">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                      </svg>
                      Track Live Stats
                    </a>
                  </div>
                `;
              } else {
                // Everyone else gets Follow button only
                trackStatsBtnHtml = `
                  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                    <a href="game-stats.html?game=${event.id}&view=1" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; padding: 10px;" onclick="event.stopPropagation();">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                      Follow Live
                    </a>
                  </div>
                `;
              }
            }
          }

          return `
            <div class="game-card" id="event-${event.id}" data-date="${event.date}" style="cursor: pointer;" onclick="window.location.href='game-detail.html?id=${event.id}'">
              <div class="game-card-header ${event.league}">
                <span>${dateInfo.weekday}, ${dateInfo.month} ${dateInfo.day}</span>
                <span class="league-badge ${event.league}">${leagueNames[event.league]}</span>
              </div>
              <div class="game-card-body">
                <div class="game-matchup">
                  <span class="team-name">Lancers</span>
                  <span class="vs-badge">${event.home ? 'VS' : '@'}</span>
                  <span class="team-name">${event.opponent}</span>
                </div>
                <div class="game-details">
                  <span class="game-detail">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    ${event.time}
                  </span>
                  <span class="game-detail">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    ${event.location}
                  </span>
                </div>
                ${event.jersey ? `
                  <div style="text-align: center; margin-top: 10px;">
                    <span class="jersey-indicator ${event.jersey}">${event.jersey === 'parkrock' ? 'PARK ROCK' : event.jersey.toUpperCase()} JERSEY</span>
                  </div>
                ` : ''}
                ${resultHtml}
                ${volunteerHtml}
                ${attendanceHtml}
                ${trackStatsBtnHtml}
              </div>
            </div>
          `;
        } else {
          // Render practice/event card
          const typeLabel = eventTypeNames[event.type] || 'Event';

          // Attendance status for practices/events
          const att = attendance[event.id] || { attending: 0, notAttending: 0, noResponse: totalPlayers };
          const attendanceHtml = `
            <div style="display: flex; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); font-size: 0.75rem;">
              <span style="color: #22C55E;">&#10003; ${att.attending}</span>
              <span style="color: #EF4444;">&#10007; ${att.notAttending}</span>
              <span style="color: #6B7280;">? ${att.noResponse}</span>
            </div>
          `;

          return `
            <div class="game-card" id="event-${event.id}" data-date="${event.date}" style="cursor: pointer;" onclick="window.location.href='attendance.html?game=${event.id}'">
              <div class="game-card-header practice">
                <span>${dateInfo.weekday}, ${dateInfo.month} ${dateInfo.day}</span>
                <span class="league-badge practice">${typeLabel.toUpperCase()}</span>
              </div>
              <div class="game-card-body">
                <div style="font-weight: 700; font-size: 1rem; margin-bottom: 8px;">${event.name || typeLabel}</div>
                <div class="game-details">
                  <span class="game-detail">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    ${event.time}${event.endTime ? ' - ' + event.endTime : ''}
                  </span>
                  <span class="game-detail">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    ${event.location}
                  </span>
                </div>
                ${event.notes ? `<p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 10px;">${event.notes}</p>` : ''}
                ${attendanceHtml}
              </div>
            </div>
          `;
        }
      }).join('');

      // Scroll to next upcoming event after initial render
      scrollToNextEvent();
    }

    function scrollToNextEvent() {
      const now = getCurrentDate();
      now.setHours(0, 0, 0, 0);

      // Find the first event card with a date >= today
      const cards = document.querySelectorAll('.game-card[data-date]');
      for (const card of cards) {
        const [year, month, day] = card.dataset.date.split('-').map(Number);
        const eventDate = new Date(year, month - 1, day);
        if (eventDate >= now) {
          setTimeout(() => {
            // Calculate offset from actual element heights
            const header = document.querySelector('header.header');
            const stickySection = document.getElementById('sticky-section');
            const headerHeight = header ? header.offsetHeight : 60;
            const stickyHeight = stickySection ? stickySection.offsetHeight : 100;
            const headerOffset = headerHeight + stickyHeight + 10;
            const cardTop = card.getBoundingClientRect().top + window.pageYOffset - headerOffset;
            window.scrollTo({ top: cardTop, behavior: 'smooth' });
            // Add highlight effect
            card.style.boxShadow = '0 0 0 2px var(--lancers-gold)';
            setTimeout(() => { card.style.boxShadow = ''; }, 2000);
          }, 100);
          break;
        }
      }
    }
  </script>
</body>
</html>
