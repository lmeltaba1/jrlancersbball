<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Details - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="schedule.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 24px; height: 24px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Game Details
        </a>
      </h1>
      <button class="theme-toggle" onclick="toggleTheme()">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div id="loading" style="text-align: center; padding: 40px;">
      <div class="spinner" style="margin: 0 auto;"></div>
    </div>

    <div id="game-content" style="display: none;">
      <!-- Game Info Card -->
      <div class="card" id="game-info"></div>

      <!-- Attendance Card (for upcoming games/events) -->
      <div class="card" id="attendance-card" style="display: none;">
        <div class="card-title" style="display: flex; align-items: center; gap: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Attendance
        </div>
        <div id="attendance-content"></div>
      </div>

      <!-- Volunteer Card (for upcoming games) -->
      <div class="card" id="volunteer-card" style="display: none;"></div>

      <!-- Stats Card (for completed games) -->
      <div class="card" id="stats-card" style="display: none;"></div>

      <!-- Highlights Card -->
      <div class="card" id="highlights-card">
        <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--lancers-gold)" stroke-width="2">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Highlights
            <span id="highlights-count" style="background: var(--lancers-gold); color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700;"></span>
          </span>
          <button class="btn btn-primary" style="font-size: 0.75rem; padding: 6px 12px;" id="addHighlightBtn" onclick="addHighlight()" style="display: none;">+ Add</button>
        </div>
        <div id="highlights-content">
          <div style="text-align: center; padding: 20px; color: var(--text-secondary);">
            <div class="spinner" style="margin: 0 auto 10px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="error-message" style="display: none; text-align: center; padding: 40px;">
      <p style="color: var(--text-secondary);">Game not found</p>
      <a href="schedule.html" class="btn btn-primary" style="margin-top: 20px;">Back to Schedule</a>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="roster.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Roster</span>
    </a>
    <a href="schedule.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Schedule</span>
    </a>
    <a href="messages.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span>Messages</span>
    </a>
    <a href="playbook.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <span>Plays</span>
    </a>
        <a href="stats-view.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span>Stats</span>
    </a>
    <a href="highlights.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      <span>Highlights</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Inline functions to bypass caching
    async function loadSchedule() {
      const response = await fetch('data/schedule.json?v=' + Date.now());
      return response.json();
    }

    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return {
        month: date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
        day: date.getDate(),
        weekday: date.toLocaleDateString('en-US', { weekday: 'long' }),
        full: date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      };
    }

    const leagueNames = {
      parkrock: 'Park Rock',
      cnr: 'CNR'
    };

    let currentUser = null;
    let userInfo = null;
    let game = null;
    let volunteers = {};
    let highlights = [];
    let players = [];

    document.addEventListener('DOMContentLoaded', async function() {
      // Require auth - all users can view game details
      requireAuth().then(async function(info) {
        currentUser = auth.currentUser;
        userInfo = info;
        if (info.isViewer) hideViewerRestrictedNav();
        loadPageContent();
      }).catch(function(err) {
        console.log('Auth required:', err);
      });
    });

    async function loadPageContent() {
      const urlParams = new URLSearchParams(window.location.search);
      const gameId = parseInt(urlParams.get('id'));

      if (!gameId) {
        showError();
        return;
      }

      try {
        const [scheduleData, rosterData] = await Promise.all([
          loadSchedule(),
          fetch('data/roster.json?v=' + Date.now()).then(r => r.json())
        ]);

        game = scheduleData.games.find(g => g.id === gameId);
        players = rosterData.players || [];

        if (!game) {
          showError();
          return;
        }

        // Load highlights for this game
        loadHighlights(gameId);

        // Load volunteer data
        if (db) {
          try {
            const doc = await db.collection('volunteers').doc(gameId.toString()).get();
            if (doc.exists) {
              volunteers = doc.data();
            }
          } catch (e) {
            console.log('No volunteer data yet');
          }
        }

        renderGame();

      } catch (e) {
        console.error('Error loading game:', e);
        showError();
      }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-message').style.display = 'block';
    }

    async function renderGame() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('game-content').style.display = 'block';

      const dateInfo = formatDate(game.date);
      const isCompleted = !!game.result;

      // Game Info Card
      const gameInfoHtml = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div>
            <div style="font-size: 0.65rem; color: var(--text-secondary);">${dateInfo.weekday}</div>
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text-primary);">${dateInfo.full}</div>
          </div>
          <span class="league-badge ${game.league}">${leagueNames[game.league]}</span>
        </div>

        <div style="text-align: center; padding: 6px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
          <div style="font-size: 0.9rem; font-weight: 700;">
            <span style="color: var(--lancers-gold);">Lancers</span>
            <span style="margin: 0 6px; color: var(--text-secondary);">${game.home ? 'VS' : '@'}</span>
            <span style="color: var(--text-primary);">${game.opponent}</span>
          </div>
          ${isCompleted ? `
            <div style="margin-top: 4px;">
              <span class="game-result ${game.result === 'W' ? 'win' : 'loss'}" style="font-size: 0.95rem; padding: 3px 10px;">
                ${game.result === 'W' ? 'WIN' : 'LOSS'} ${game.finalScore ? game.finalScore.lancers + ' - ' + game.finalScore.opponent : ''}
              </span>
            </div>
          ` : ''}
        </div>

        <div style="display: flex; gap: 6px; margin-top: 6px; align-items: stretch;">
          <div style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 6px; background: var(--bg-elevated); border-radius: 6px; cursor: pointer;" onclick="copyAddress('${game.location.replace(/'/g, "\\'")}')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="var(--lancers-gold)" style="width: 14px; height: 14px; flex-shrink: 0;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            </svg>
            <div style="font-size: 0.7rem; color: var(--text-primary); line-height: 1.2;">${game.location}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--bg-elevated); border-radius: 6px;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="var(--lancers-gold)" style="width: 14px; height: 14px; flex-shrink: 0;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div style="font-weight: 600; font-size: 0.75rem; color: var(--text-primary);">${game.time}</div>
          </div>
        </div>
        ${game.jersey ? `
          <div style="text-align: center; margin-top: 6px;">
            <span class="jersey-indicator ${game.jersey}" style="font-size: 0.75rem; padding: 4px 12px;">
              ${game.jersey === 'parkrock' ? 'PARK ROCK' : game.jersey.toUpperCase()} JERSEY
            </span>
          </div>
        ` : ''}
      `;
      document.getElementById('game-info').innerHTML = gameInfoHtml;

      // Attendance Card (for upcoming games/events only)
      if (!isCompleted) {
        const attendanceCard = document.getElementById('attendance-card');
        attendanceCard.style.display = 'block';

        // Load roster and attendance
        try {
          const rosterRes = await fetch('data/roster.json?v=' + Date.now());
          const rosterData = await rosterRes.json();
          const allPlayers = rosterData.players || [];

          let attendanceData = {};
          if (db) {
            const attendanceSnapshot = await db.collection('attendance')
              .where('gameId', '==', game.id)
              .get();
            attendanceSnapshot.forEach(doc => {
              const d = doc.data();
              attendanceData[d.playerId] = { attending: d.attending, name: d.playerName };
            });
          }

          // Sort players into categories
          const attending = [];
          const notAttending = [];
          const noResponse = [];

          allPlayers.forEach(player => {
            const name = player.firstName + ' ' + player.lastName.charAt(0) + '.';
            const response = attendanceData[player.id];
            if (response) {
              if (response.attending) attending.push(name);
              else notAttending.push(name);
            } else {
              noResponse.push(name);
            }
          });

          // Build attendance HTML
          let html = '';

          // Attending section
          html += `<div style="margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
              <span style="color: #22C55E; font-weight: 700; font-size: 0.8rem;">&#10003; Attending (${attending.length})</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
              ${attending.length > 0 ? attending.map(n => `<span style="background: rgba(34,197,94,0.2); color: #22C55E; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;">${n}</span>`).join('') : '<span style="color: var(--text-muted); font-size: 0.7rem; font-style: italic;">None yet</span>'}
            </div>
          </div>`;

          // Not attending section
          html += `<div style="margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
              <span style="color: #EF4444; font-weight: 700; font-size: 0.8rem;">&#10007; Not Attending (${notAttending.length})</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
              ${notAttending.length > 0 ? notAttending.map(n => `<span style="background: rgba(239,68,68,0.2); color: #EF4444; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;">${n}</span>`).join('') : '<span style="color: var(--text-muted); font-size: 0.7rem; font-style: italic;">None</span>'}
            </div>
          </div>`;

          // No response section
          html += `<div style="margin-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 4px;">
              <span style="color: #6B7280; font-weight: 700; font-size: 0.8rem;">? No Response (${noResponse.length})</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 4px;">
              ${noResponse.length > 0 ? noResponse.map(n => `<span style="background: rgba(107,114,128,0.2); color: #6B7280; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;">${n}</span>`).join('') : '<span style="color: var(--text-muted); font-size: 0.7rem; font-style: italic;">Everyone responded!</span>'}
            </div>
          </div>`;

          // RSVP button
          html += `<a href="attendance.html?game=${game.id}" class="btn btn-primary" style="width: 100%; text-align: center; margin-top: 6px; padding: 8px;">RSVP Now</a>`;

          document.getElementById('attendance-content').innerHTML = html;
        } catch (e) {
          console.log('Could not load attendance:', e);
          document.getElementById('attendance-content').innerHTML = `<a href="attendance.html?game=${game.id}" class="btn btn-primary" style="width: 100%; text-align: center;">RSVP Now</a>`;
        }
      }

      // Volunteer Card (for upcoming games only)
      if (!isCompleted) {
        const volunteerCard = document.getElementById('volunteer-card');
        volunteerCard.style.display = 'block';

        const scorekeeperFilled = !!volunteers.scorekeeper;
        const tableWorkerFilled = !!volunteers.tableWorker;
        const isCNR = game.league === 'cnr';

        const userIsScorekeeper = volunteers.scorekeeper && currentUser && volunteers.scorekeeper.email === currentUser.email;
        const userIsTableWorker = volunteers.tableWorker && currentUser && volunteers.tableWorker.email === currentUser.email;

        let volunteerHtml = `
          <div class="card-title">Volunteers Needed</div>

          <!-- Scorekeeper Slot -->
          <div style="background: var(--bg-elevated); border-radius: 8px; padding: 8px; margin-bottom: 6px; border: 1px solid var(--border-color);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <div style="font-weight: 700; font-size: 0.8rem; color: var(--lancers-gold);">Scorekeeper</div>
                <div style="font-size: 0.65rem; color: var(--text-secondary);">Track stats in the app</div>
              </div>
              ${scorekeeperFilled ? `
                <div style="text-align: right;">
                  <span class="volunteer-slot filled" style="margin: 0; font-size: 0.75rem;">
                    &#10003; ${volunteers.scorekeeper.name}
                  </span>
                  ${userIsScorekeeper ? `
                    <button class="btn btn-secondary" style="font-size: 0.65rem; padding: 4px 8px; margin-top: 4px;" onclick="cancelSignup('scorekeeper')">
                      Cancel
                    </button>
                  ` : ''}
                </div>
              ` : `
                ${currentUser ? `
                  <button class="btn btn-primary" style="font-size: 0.75rem; padding: 6px 12px;" onclick="signUp('scorekeeper')">
                    Sign Up
                  </button>
                ` : `
                  <span class="volunteer-slot empty" style="margin: 0; font-size: 0.75rem;">NEEDED</span>
                `}
              `}
            </div>
          </div>

          ${isCNR ? `
            <!-- Table Worker Slot -->
            <div style="background: var(--bg-elevated); border-radius: 8px; padding: 8px; border: 1px solid var(--border-color);">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-weight: 700; font-size: 0.8rem; color: var(--lancers-gold);">Table Worker</div>
                  <div style="font-size: 0.65rem; color: var(--text-secondary);">Run the scorer's table</div>
                </div>
                ${tableWorkerFilled ? `
                  <div style="text-align: right;">
                    <span class="volunteer-slot filled" style="margin: 0; font-size: 0.75rem;">
                      &#10003; ${volunteers.tableWorker.name}
                    </span>
                    ${userIsTableWorker ? `
                      <button class="btn btn-secondary" style="font-size: 0.65rem; padding: 4px 8px; margin-top: 4px;" onclick="cancelSignup('tableWorker')">
                        Cancel
                      </button>
                    ` : ''}
                  </div>
                ` : `
                  ${currentUser ? `
                    <button class="btn btn-primary" style="font-size: 0.75rem; padding: 6px 12px;" onclick="signUp('tableWorker')">
                      Sign Up
                    </button>
                  ` : `
                    <span class="volunteer-slot empty" style="margin: 0; font-size: 0.75rem;">NEEDED</span>
                  `}
                `}
              </div>
            </div>
          ` : ''}

          ${!currentUser ? `
            <div style="margin-top: 10px; text-align: center;">
              <a href="login.html" class="btn btn-primary" style="padding: 8px 16px;">Log in to Sign Up</a>
            </div>
          ` : ''}
        `;
        volunteerCard.innerHTML = volunteerHtml;
      }

      // Stats Card (for completed games)
      if (isCompleted) {
        const statsCard = document.getElementById('stats-card');
        statsCard.style.display = 'block';
        statsCard.innerHTML = `
          <div class="card-title">Game Stats</div>
          <a href="stats-view.html?game=${game.id}" class="btn btn-primary" style="width: 100%;">View Box Score</a>
        `;
      }
    }

    function copyAddress(address) {
      navigator.clipboard.writeText(address).then(function() {
        alert('Address copied to clipboard!');
      }).catch(function() {
        alert('Could not copy address');
      });
    }

    async function signUp(role) {
      if (!currentUser || !userInfo) {
        alert('You must be logged in to sign up.');
        return;
      }

      const roleName = role === 'scorekeeper' ? 'Scorekeeper' : 'Table Worker';

      if (!confirm('Sign up as ' + roleName + ' for this game?')) return;

      try {
        const name = userInfo.name || currentUser.email.split('@')[0];

        await db.collection('volunteers').doc(game.id.toString()).set({
          gameId: game.id,
          [role]: {
            name: name,
            email: currentUser.email,
            playerId: userInfo.player ? userInfo.player.id : null,
            signedUpAt: firebase.firestore.FieldValue.serverTimestamp()
          }
        }, { merge: true });

        // Update local data
        volunteers[role] = {
          name: name,
          email: currentUser.email
        };

        renderGame();
        alert('You are signed up!');

      } catch (e) {
        console.error('Error signing up:', e);
        alert('Error signing up. Please try again.');
      }
    }

    async function cancelSignup(role) {
      if (!confirm('Cancel your signup for this game?')) return;

      try {
        await db.collection('volunteers').doc(game.id.toString()).update({
          [role]: firebase.firestore.FieldValue.delete()
        });

        delete volunteers[role];
        renderGame();

      } catch (e) {
        console.error('Error canceling signup:', e);
        alert('Error canceling. Please try again.');
      }
    }

    // Highlights functions
    function loadHighlights(gameId) {
      if (!db) {
        renderHighlights();
        return;
      }

      db.collection('highlights')
        .where('gameId', '==', gameId)
        .orderBy('timestamp', 'desc')
        .onSnapshot((snapshot) => {
          highlights = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          renderHighlights();
        }, (error) => {
          console.log('Error loading highlights:', error);
          renderHighlights();
        });
    }

    function renderHighlights() {
      const container = document.getElementById('highlights-content');
      const countBadge = document.getElementById('highlights-count');
      const addBtn = document.getElementById('addHighlightBtn');

      // Show/hide add button based on auth
      if (currentUser) {
        addBtn.style.display = 'inline-block';
      } else {
        addBtn.style.display = 'none';
      }

      // Update count badge
      if (highlights.length > 0) {
        countBadge.textContent = highlights.length;
        countBadge.style.display = 'inline';
      } else {
        countBadge.style.display = 'none';
      }

      if (highlights.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--text-secondary);">
            <p style="margin: 0;">No highlights yet</p>
            ${currentUser ? '<p style="font-size: 0.8rem; margin-top: 8px;">Be the first to add one!</p>' : ''}
          </div>
        `;
        return;
      }

      // Show thumbnails grid (max 4, then "View All" link)
      const displayHighlights = highlights.slice(0, 4);
      const hasMore = highlights.length > 4;

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: ${hasMore ? '12px' : '0'};">
          ${displayHighlights.map(h => {
            const player = players.find(p => p.id == h.playerId);
            const playerName = player ? player.firstName : 'Unknown';
            const isVideo = h.mediaType === 'video';

            return `
              <div style="position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer; background: #000;" onclick="openHighlight('${h.downloadUrl}', ${isVideo})">
                ${isVideo ? `
                  <video src="${h.downloadUrl}" style="width: 100%; height: 100%; object-fit: cover;"></video>
                  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: white; margin-left: 2px;"><path d="M8 5v14l11-7z"/></svg>
                  </div>
                ` : `
                  <img src="${h.downloadUrl}" style="width: 100%; height: 100%; object-fit: cover;">
                `}
                <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 4px 6px;">
                  <span style="color: white; font-size: 0.65rem; font-weight: 600;">${playerName}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ${hasMore ? `
          <a href="highlights.html?game=${game.id}" style="display: block; text-align: center; color: var(--lancers-gold); font-weight: 600; font-size: 0.85rem; text-decoration: none;">
            View All ${highlights.length} Highlights →
          </a>
        ` : highlights.length > 0 ? `
          <a href="highlights.html?game=${game.id}" style="display: block; text-align: center; color: var(--lancers-gold); font-weight: 600; font-size: 0.85rem; text-decoration: none; margin-top: 12px;">
            View All →
          </a>
        ` : ''}
      `;
    }

    function addHighlight() {
      window.location.href = 'highlights.html?game=' + game.id + '&upload=true';
    }

    function openHighlight(url, isVideo) {
      // Simple viewer - open in new modal or navigate to highlights page
      window.location.href = 'highlights.html?game=' + game.id;
    }
  </script>
</body>
</html>
