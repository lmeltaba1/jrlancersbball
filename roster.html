<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Roster - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .player-card {
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .player-card:active {
      transform: scale(0.98);
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: none;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 100px;
    }
    .modal-overlay.active {
      display: block;
    }
    .modal-content {
      max-width: 500px;
      margin: 0 auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-close {
      background: var(--bg-elevated);
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .stat-box {
      background: var(--bg-elevated);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--lancers-gold);
    }
    .stat-label {
      font-size: 0.65rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }
    .game-stat-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }
    .game-stat-row:last-child {
      border-bottom: none;
    }
    .game-stats-mini {
      display: flex;
      gap: 12px;
      color: var(--text-secondary);
    }
    .game-stats-mini span {
      min-width: 35px;
      text-align: right;
    }
    .contact-icon {
      color: var(--lancers-gold);
      width: 22px;
      height: 22px;
    }
    .contact-icon:active {
      opacity: 0.7;
    }
    .parent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .parent-item:last-child {
      border-bottom: none;
    }
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .highlight-thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;
    }
    .highlight-thumb img,
    .highlight-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .highlight-thumb .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: none;
    }
    .highlight-thumb .play-icon svg {
      width: 16px;
      height: 16px;
      margin-left: 2px;
    }
    .highlight-game-label {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      font-size: 0.65rem;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 2px 4px;
      border-radius: 4px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-all-link {
      display: block;
      text-align: center;
      color: var(--lancers-gold);
      font-size: 0.85rem;
      margin-top: 12px;
      text-decoration: none;
    }
    .view-all-link:hover {
      text-decoration: underline;
    }
    /* Lightbox styles */
    .lightbox-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox-content {
      max-width: 100%;
      max-height: 100%;
    }
    .lightbox-content img,
    .lightbox-content video {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-elevated);
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2001;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.png" alt="Lancers" class="header-logo">
          Roster
        </a>
      </h1>
      <button class="theme-toggle" onclick="toggleTheme()">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Section Tabs -->
    <div class="section-tabs">
      <button class="section-tab active" data-section="players">Players</button>
      <button class="section-tab" data-section="parents">Parents</button>
    </div>

    <!-- Players Section -->
    <div class="section-content active" id="players-section">
      <!-- Coach Card -->
      <div class="card" id="coach-card" style="display: none;">
        <div class="card-title">Coaching Staff</div>
        <div id="coaches-list" class="roster-list"></div>
      </div>

      <!-- Players List -->
      <div id="players-list">
        <div style="text-align: center; padding: 40px;">
          <div class="spinner" style="margin: 0 auto;"></div>
        </div>
      </div>
    </div>

    <!-- Parents Section -->
    <div class="section-content" id="parents-section">
      <div id="parents-list">
        <div style="text-align: center; padding: 40px;">
          <div class="spinner" style="margin: 0 auto;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Player Stats Modal -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 id="modal-player-name" style="margin: 0; color: var(--text-primary);"></h2>
          <div id="modal-player-info" style="color: var(--text-secondary); font-size: 0.85rem;"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="card">
        <div class="card-title">Season Totals</div>
        <div class="stat-grid" id="season-stats">
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">PTS</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">REB</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">AST</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">STL</div></div>
        </div>
        <div class="stat-grid" id="season-stats-2">
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">BLK</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">TO</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">FLS</div></div>
          <div class="stat-box"><div class="stat-value">-</div><div class="stat-label">Games</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Game by Game</div>
        <div id="game-by-game">
          <p style="color: var(--text-secondary); text-align: center; padding: 20px;">No games played yet</p>
        </div>
      </div>

      <div class="card" id="highlights-card">
        <div class="card-title">Highlights</div>
        <div id="player-highlights">
          <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Loading...</p>
        </div>
      </div>

      <div class="card" id="contact-card">
        <div class="card-title">Contact Info</div>
        <div id="contact-list"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/app.js?v=3"></script>
  <script>
    let rosterData = null;
    let scheduleData = null;
    let allGameStats = {};
    let currentPlayerId = null;
    let playerHighlights = [];

    // Position to playbook number mapping
    const positionNumbers = {
      'PG': 1,
      'SG': 2,
      'SF': 3,
      'PF': 4,
      'C': 5
    };

    // Contact icon SVGs
    const phoneIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="contact-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>`;
    const textIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="contact-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>`;
    const emailIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="contact-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>`;

    document.addEventListener('DOMContentLoaded', async function() {
      // Tab switching
      document.querySelectorAll('.section-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.section-content').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById(this.dataset.section + '-section').classList.add('active');
        });
      });

      try {
        // Load roster and schedule in parallel
        const [roster, schedule] = await Promise.all([
          loadRoster(),
          loadSchedule()
        ]);
        rosterData = roster;
        scheduleData = schedule;

        // Load all game stats from Firestore
        if (db) {
          try {
            const snapshot = await db.collection('gameStats').get();
            snapshot.forEach(doc => {
              allGameStats[doc.id] = doc.data();
            });
          } catch (e) {
            console.log('Could not load game stats:', e);
          }
        }

        // Render coaches
        if (rosterData.coaches && rosterData.coaches.length > 0) {
          document.getElementById('coach-card').style.display = 'block';
          document.getElementById('coaches-list').innerHTML = rosterData.coaches.map(coach => `
            <div class="roster-item">
              <div class="position-badge pos-pg" style="font-size: 0.6rem;">${coach.role === 'Head Coach' ? 'HC' : 'AC'}</div>
              <div style="flex: 1;">
                <div class="player-name">${coach.name}</div>
                <div class="position-name">${coach.role}</div>
              </div>
              <div style="display: flex; gap: 12px;">
                ${coach.phone ? `<a href="tel:${coach.phone}">${phoneIcon}</a>` : ''}
                ${coach.phone ? `<a href="sms:${coach.phone}">${textIcon}</a>` : ''}
                <a href="mailto:${coach.email}">${emailIcon}</a>
              </div>
            </div>
          `).join('');
        }

        // Render players
        const players = rosterData.players.sort((a, b) => {
          if (a.number === 0 && b.number !== 0) return 1;
          if (b.number === 0 && a.number !== 0) return -1;
          return a.number - b.number;
        });

        document.getElementById('players-list').innerHTML = players.map(player => {
          const playbookNum = positionNumbers[player.position] || '?';
          return `
            <div class="card player-card" style="margin-bottom: 12px;" onclick="showPlayerStats(${player.id})">
              <div class="roster-item" style="border: none; padding: 0;">
                <div class="player-number">${player.number || '-'}</div>
                <div class="position-badge pos-${player.position.toLowerCase()}">${player.position}</div>
                <div style="flex: 1;">
                  <div class="player-name">${player.firstName} ${player.lastName}</div>
                  <div class="position-name">${player.positionName} (${playbookNum})</div>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-secondary);">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </div>
            </div>
          `;
        }).join('');

        // Render parents section - grouped by player
        const parentsByPlayer = [];
        players.forEach(player => {
          if (player.parents && player.parents.length > 0) {
            player.parents.forEach(parent => {
              parentsByPlayer.push({
                ...parent,
                playerName: `${player.firstName} ${player.lastName}`,
                playerNumber: player.number
              });
            });
          }
        });

        // Sort parents alphabetically by their name
        parentsByPlayer.sort((a, b) => a.name.localeCompare(b.name));

        document.getElementById('parents-list').innerHTML = parentsByPlayer.map(parent => {
          const roleLabel = parent.role || 'Parent';
          return `
            <div class="card" style="margin-bottom: 8px;">
              <div class="parent-item" style="border: none; padding: 0;">
                <div style="flex: 1;">
                  <div style="font-weight: 600; color: var(--text-primary);">${parent.name}</div>
                  <div style="font-size: 0.8rem; color: var(--text-secondary);">
                    ${roleLabel} of #${parent.playerNumber || '-'} ${parent.playerName}
                  </div>
                </div>
                <div style="display: flex; gap: 12px;">
                  ${parent.phone ? `<a href="tel:${parent.phone}">${phoneIcon}</a>` : ''}
                  ${parent.phone ? `<a href="sms:${parent.phone}">${textIcon}</a>` : ''}
                  <a href="mailto:${parent.email}">${emailIcon}</a>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Check for player URL parameter and auto-open modal
        const urlParams = new URLSearchParams(window.location.search);
        const playerNumber = urlParams.get('number');
        if (playerNumber !== null) {
          const num = parseInt(playerNumber);
          const player = rosterData.players.find(p => p.number === num);
          if (player) {
            showPlayerStats(player.id);
          }
        }

      } catch (e) {
        console.error('Error loading roster:', e);
        document.getElementById('players-list').innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Error loading roster</p>';
        document.getElementById('parents-list').innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Error loading parents</p>';
      }
    });

    function showPlayerStats(playerId) {
      const player = rosterData.players.find(p => p.id === playerId);
      if (!player) return;

      currentPlayerId = playerId;

      // Set player header info
      const playbookNum = positionNumbers[player.position] || '?';
      document.getElementById('modal-player-name').textContent = `#${player.number || '-'} ${player.firstName} ${player.lastName}`;
      document.getElementById('modal-player-info').textContent = `${player.positionName} (${playbookNum})`;

      // Calculate season totals
      let seasonTotals = {
        points: 0, rebounds: 0, assists: 0, steals: 0,
        blocks: 0, turnovers: 0, fouls: 0, games: 0
      };

      const gameByGameData = [];

      // Go through each game's stats
      for (const gameId in allGameStats) {
        const gameStats = allGameStats[gameId];
        if (gameStats.playerStats && gameStats.playerStats[playerId]) {
          const ps = gameStats.playerStats[playerId];
          seasonTotals.points += ps.points || 0;
          seasonTotals.rebounds += ps.rebounds || 0;
          seasonTotals.assists += ps.assists || 0;
          seasonTotals.steals += ps.steals || 0;
          seasonTotals.blocks += ps.blocks || 0;
          seasonTotals.turnovers += ps.turnovers || 0;
          seasonTotals.fouls += ps.fouls || 0;
          seasonTotals.games++;

          // Find game info
          const game = scheduleData.games.find(g => g.id.toString() === gameId);
          if (game) {
            gameByGameData.push({
              date: game.date,
              opponent: game.opponent,
              result: game.result,
              stats: ps
            });
          }
        }
      }

      // Update season stats display
      document.getElementById('season-stats').innerHTML = `
        <div class="stat-box"><div class="stat-value">${seasonTotals.points}</div><div class="stat-label">PTS</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.rebounds}</div><div class="stat-label">REB</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.assists}</div><div class="stat-label">AST</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.steals}</div><div class="stat-label">STL</div></div>
      `;
      document.getElementById('season-stats-2').innerHTML = `
        <div class="stat-box"><div class="stat-value">${seasonTotals.blocks}</div><div class="stat-label">BLK</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.turnovers}</div><div class="stat-label">TO</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.fouls}</div><div class="stat-label">FLS</div></div>
        <div class="stat-box"><div class="stat-value">${seasonTotals.games}</div><div class="stat-label">Games</div></div>
      `;

      // Update game by game display
      if (gameByGameData.length === 0) {
        document.getElementById('game-by-game').innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">No games played yet</p>';
      } else {
        // Sort by date descending
        gameByGameData.sort((a, b) => new Date(b.date) - new Date(a.date));
        document.getElementById('game-by-game').innerHTML = gameByGameData.map(g => {
          const dateInfo = formatDate(g.date);
          return `
            <div class="game-stat-row">
              <div>
                <div style="font-weight: 600; color: var(--text-primary);">vs ${g.opponent}</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">${dateInfo.month} ${dateInfo.day}</div>
              </div>
              <div class="game-stats-mini">
                <span>${g.stats.points || 0}p</span>
                <span>${g.stats.rebounds || 0}r</span>
                <span>${g.stats.assists || 0}a</span>
              </div>
            </div>
          `;
        }).join('');
      }

      // Update contact info
      if (player.parents && player.parents.length > 0) {
        document.getElementById('contact-card').style.display = 'block';
        document.getElementById('contact-list').innerHTML = player.parents.map(parent => {
          const roleLabel = parent.role || 'Parent';
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color);">
              <div>
                <div style="font-size: 0.9rem; color: var(--text-primary);">${parent.name}</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">${roleLabel}</div>
              </div>
              <div style="display: flex; gap: 12px;">
                ${parent.phone ? `<a href="tel:${parent.phone}">${phoneIcon}</a>` : ''}
                ${parent.phone ? `<a href="sms:${parent.phone}">${textIcon}</a>` : ''}
                <a href="mailto:${parent.email}">${emailIcon}</a>
              </div>
            </div>
          `;
        }).join('');
      } else {
        document.getElementById('contact-card').style.display = 'none';
      }

      // Load highlights for this player
      document.getElementById('player-highlights').innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Loading...</p>';
      loadPlayerHighlights(playerId);

      // Show modal
      document.getElementById('player-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('player-modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close modal on backdrop click
    document.getElementById('player-modal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Close modal on escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
        closeLightbox();
      }
    });

    // Load highlights for a specific player
    async function loadPlayerHighlights(playerId) {
      const container = document.getElementById('player-highlights');

      if (!db) {
        container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Database not available</p>';
        return;
      }

      try {
        const snapshot = await db.collection('highlights')
          .where('playerId', '==', playerId)
          .orderBy('timestamp', 'desc')
          .limit(6)
          .get();

        playerHighlights = [];
        snapshot.forEach(doc => {
          playerHighlights.push({ id: doc.id, ...doc.data() });
        });

        renderPlayerHighlights(playerId);
      } catch (e) {
        console.error('Error loading highlights:', e);
        container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">No highlights yet</p>';
      }
    }

    // Render highlights grid
    function renderPlayerHighlights(playerId) {
      const container = document.getElementById('player-highlights');

      if (playerHighlights.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">No highlights yet</p>';
        return;
      }

      // Find game names for labels
      const getGameLabel = (gameId) => {
        if (!scheduleData || !scheduleData.games) return 'Game';
        const game = scheduleData.games.find(g => g.id === gameId);
        return game ? `vs ${game.opponent}` : 'Game';
      };

      const playIconSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

      let html = '<div class="highlights-grid">';

      playerHighlights.forEach(h => {
        const gameLabel = getGameLabel(h.gameId);
        if (h.mediaType === 'video') {
          html += `
            <div class="highlight-thumb" onclick="openLightbox('${h.id}')">
              <video src="${h.downloadUrl}" preload="metadata"></video>
              <div class="play-icon">${playIconSvg}</div>
              <div class="highlight-game-label">${gameLabel}</div>
            </div>
          `;
        } else {
          html += `
            <div class="highlight-thumb" onclick="openLightbox('${h.id}')">
              <img src="${h.downloadUrl}" alt="Highlight">
              <div class="highlight-game-label">${gameLabel}</div>
            </div>
          `;
        }
      });

      html += '</div>';
      html += `<a href="highlights.html?player=${playerId}" class="view-all-link">View All Highlights →</a>`;

      container.innerHTML = html;
    }

    // Open lightbox to view highlight
    function openLightbox(highlightId) {
      const highlight = playerHighlights.find(h => h.id === highlightId);
      if (!highlight) return;

      const overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      overlay.id = 'lightbox-overlay';
      overlay.onclick = (e) => {
        if (e.target === overlay) closeLightbox();
      };

      let mediaHtml;
      if (highlight.mediaType === 'video') {
        mediaHtml = `<video src="${highlight.downloadUrl}" controls autoplay playsinline style="max-width: 100%; max-height: 80vh; border-radius: 8px;"></video>`;
      } else {
        mediaHtml = `<img src="${highlight.downloadUrl}" alt="Highlight" style="max-width: 100%; max-height: 80vh; border-radius: 8px;">`;
      }

      overlay.innerHTML = `
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-content">
          ${mediaHtml}
          ${highlight.caption ? `<p style="color: white; text-align: center; margin-top: 12px;">${highlight.caption}</p>` : ''}
        </div>
      `;

      document.body.appendChild(overlay);
    }

    // Close lightbox
    function closeLightbox() {
      const overlay = document.getElementById('lightbox-overlay');
      if (overlay) {
        const video = overlay.querySelector('video');
        if (video) video.pause();
        overlay.remove();
      }
    }
  </script>
</body>
</html>
