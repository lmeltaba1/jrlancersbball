<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Roster - Jr. Lancers</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.svg" alt="Lancers" class="header-logo">
          Roster
        </a>
      </h1>
      <button class="theme-toggle" onclick="toggleTheme()">
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Section Tabs -->
    <div class="section-tabs">
      <button class="section-tab active" data-section="players">Players</button>
      <button class="section-tab" data-section="parents">Parents</button>
    </div>

    <!-- Players Section -->
    <div class="section-content active" id="players-section">
      <!-- Coach Card -->
      <div class="card" id="coach-card" style="display: none;">
        <div class="card-title">Coaching Staff</div>
        <div id="coaches-list" class="roster-list"></div>
      </div>

      <!-- Players List -->
      <div class="card">
        <div class="card-title">Players</div>
        <div id="players-list" class="roster-list">
          <div style="text-align: center; padding: 20px;">
            <div class="spinner" style="margin: 0 auto;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Parents Section -->
    <div class="section-content" id="parents-section">
      <div class="card">
        <div class="card-title">Parent Directory</div>
        <div id="parents-list" class="roster-list">
          <div style="text-align: center; padding: 20px;">
            <div class="spinner" style="margin: 0 auto;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="roster.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Roster</span>
    </a>
    <a href="schedule.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Schedule</span>
    </a>
    <a href="game-stats.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
      <span>Stats</span>
    </a>
    <a href="volunteers.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
      <span>Volunteer</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      // Tab switching
      document.querySelectorAll('.section-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.section-content').forEach(c => c.classList.remove('active'));
          this.classList.add('active');
          document.getElementById(this.dataset.section + '-section').classList.add('active');
        });
      });

      // Load roster
      try {
        const data = await loadRoster();

        // Render coaches
        if (data.coaches && data.coaches.length > 0) {
          document.getElementById('coach-card').style.display = 'block';
          document.getElementById('coaches-list').innerHTML = data.coaches.map(coach => `
            <div class="roster-item">
              <div class="position-badge pos-pg" style="font-size: 0.6rem;">HC</div>
              <div style="flex: 1;">
                <div class="player-name">${coach.name}</div>
                <div class="position-name">${coach.role}</div>
              </div>
              <div style="display: flex; gap: 8px;">
                <a href="tel:${coach.phone}" style="color: var(--lancers-gold);">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                  </svg>
                </a>
                <a href="mailto:${coach.email}" style="color: var(--lancers-gold);">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </a>
              </div>
            </div>
          `).join('');
        }

        // Render players
        const players = data.players.sort((a, b) => a.number - b.number);
        document.getElementById('players-list').innerHTML = players.map(player => `
          <div class="roster-item">
            <div class="player-number">${player.number}</div>
            <div class="position-badge pos-${player.position.toLowerCase()}">${player.position}</div>
            <div style="flex: 1;">
              <div class="player-name">${player.firstName} ${player.lastName}</div>
              <div class="position-name">${player.positionName}</div>
            </div>
          </div>
        `).join('');

        // Render parents
        const parentsList = [];
        players.forEach(player => {
          if (player.parents) {
            player.parents.forEach(parent => {
              parentsList.push({
                ...parent,
                playerName: player.firstName + ' ' + player.lastName
              });
            });
          }
        });

        document.getElementById('parents-list').innerHTML = parentsList.map(parent => `
          <div class="roster-item">
            <div style="flex: 1;">
              <div class="player-name">${parent.name}</div>
              <div class="position-name">Parent of ${parent.playerName}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              ${parent.phone ? `
                <a href="tel:${parent.phone}" style="color: var(--lancers-gold);">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                  </svg>
                </a>
              ` : ''}
              <a href="mailto:${parent.email}" style="color: var(--lancers-gold);">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </a>
            </div>
          </div>
        `).join('');

      } catch (e) {
        console.error('Error loading roster:', e);
        document.getElementById('players-list').innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Error loading roster</p>';
      }
    });
  </script>
</body>
</html>
