<!DOCTYPE html>
<html>
<head><title>Seed Volunteer</title>  <link rel="icon" type="image/png" href="images/lancers-logo-192.png">
</head>
<body>
<h1>Setting Mindy Carney as Scorekeeper for Game 4...</h1>
<div id="status">Loading...</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
auth.onAuthStateChanged(async user => {
  if (!user) {
    document.getElementById('status').textContent = 'Please log in first at login.html';
    return;
  }
  try {
    await db.collection('volunteers').doc('4').set({
      scorekeeper: {
        name: 'Mindy Carney',
        email: 'mindy.m.carney@gmail.com',
        playerId: 1,
        signedUpAt: firebase.firestore.FieldValue.serverTimestamp()
      }
    }, { merge: true });
    document.getElementById('status').innerHTML = '<span style="color:green">Done! Mindy Carney is now scorekeeper for game 4.</span><br><a href="index.html">Go to Home</a>';
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
});
</script>
</body>
</html>
