<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Highlights - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .filter-bar {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 60px;
      z-index: 10;
    }
    .filter-select {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .highlights-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }
    .highlight-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .highlight-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      cursor: pointer;
    }
    .highlight-media img,
    .highlight-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .highlight-media .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .highlight-media .play-icon svg {
      width: 30px;
      height: 30px;
      fill: white;
      margin-left: 4px;
    }
    .highlight-info {
      padding: 12px 16px;
    }
    .highlight-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .highlight-player {
      font-weight: 700;
      color: var(--lancers-gold);
    }
    .highlight-game {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .highlight-caption {
      color: var(--text-primary);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .highlight-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .delete-btn {
      background: none;
      border: none;
      color: #EF4444;
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.75rem;
    }
    .upload-btn {
      background: var(--lancers-gold);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .upload-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Upload Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0;
      line-height: 1;
    }
    .modal-body {
      padding: 16px;
    }
    .file-picker {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .file-picker:hover {
      border-color: var(--lancers-gold);
    }
    .file-picker.has-file {
      border-color: var(--lancers-gold);
      background: rgba(255, 215, 0, 0.1);
    }
    .file-picker input {
      display: none;
    }
    .file-picker svg {
      width: 40px;
      height: 40px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .file-picker p {
      color: var(--text-secondary);
      margin: 0;
      font-size: 0.9rem;
    }
    .file-preview {
      max-width: 100%;
      max-height: 150px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-primary);
      font-size: 1rem;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }
    .progress-bar {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
      display: none;
    }
    .progress-bar.active {
      display: block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--lancers-gold);
      width: 0%;
      transition: width 0.3s;
    }
    .upload-submit {
      width: 100%;
      padding: 14px;
      background: var(--lancers-gold);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .upload-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Video Modal */
    .video-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1001;
      align-items: center;
      justify-content: center;
    }
    .video-modal.active {
      display: flex;
    }
    .video-modal video,
    .video-modal img {
      max-width: 100%;
      max-height: 90vh;
    }
    .video-modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .empty-state svg {
      width: 60px;
      height: 60px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.png" alt="Lancers" class="header-logo">
          Highlights
        </a>
      </h1>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="upload-btn" onclick="openUploadModal()" id="uploadBtn" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add
        </button>
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <select class="filter-select" id="gameFilter">
      <option value="">All Games</option>
    </select>
    <select class="filter-select" id="playerFilter">
      <option value="">All Players</option>
    </select>
  </div>

  <!-- Main Content -->
  <main class="main-content" style="padding-top: 0;">
    <div class="highlights-grid" id="highlightsGrid">
      <div style="text-align: center; padding: 40px;">
        <div class="spinner" style="margin: 0 auto;"></div>
      </div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Highlight</h2>
        <button class="modal-close" onclick="closeUploadModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="file-picker" id="filePicker" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFileSelect(event)">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          <p>Tap to select video or photo</p>
        </div>

        <div class="form-group">
          <label>Game</label>
          <select id="uploadGame" required>
            <option value="">Select a game...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Player</label>
          <select id="uploadPlayer" required>
            <option value="">Select a player...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Caption (optional)</label>
          <textarea id="uploadCaption" placeholder="Describe this highlight..."></textarea>
        </div>

        <div class="progress-bar" id="progressBar">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <button class="upload-submit" id="uploadSubmit" onclick="uploadHighlight()" disabled>
          Upload
        </button>
      </div>
    </div>
  </div>

  <!-- Video/Image Viewer Modal -->
  <div class="video-modal" id="viewerModal" onclick="closeViewer()">
    <button class="video-modal-close">&times;</button>
    <div id="viewerContent"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Home</span>
    </a>
    <a href="roster.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>

    </a>
    <a href="schedule.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Schedule</span>
    </a>
    <a href="chat.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">

      </svg>
      <span>Chat</span>
    </a>
    <a href="playbook.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <span>Plays</span>
    </a>
    <a href="highlights.html" class="nav-item active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      <span>Highlights</span>
    </a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script>
    let games = [];
    let players = [];
    let highlights = [];
    let currentUser = null;
    let currentUserInfo = null;
    let selectedFile = null;

    // Format date helper
    function formatDate(dateString) {
      const [year, month, day] = dateString.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    document.addEventListener('DOMContentLoaded', async function() {
      // Load schedule and roster
      try {
        const [scheduleData, rosterData] = await Promise.all([
          fetch('data/schedule.json?v=' + Date.now()).then(r => r.json()),
          fetch('data/roster.json?v=' + Date.now()).then(r => r.json())
        ]);

        // Get games (completed ones first for upload selection)
        games = (scheduleData.games || []).sort((a, b) => new Date(b.date) - new Date(a.date));
        players = rosterData.players || [];

        // Populate filter dropdowns
        populateFilters();
        populateUploadSelects();

        // Check URL params for pre-filtering
        const params = new URLSearchParams(window.location.search);
        if (params.get('player')) {
          document.getElementById('playerFilter').value = params.get('player');
        }
        if (params.get('game')) {
          document.getElementById('gameFilter').value = params.get('game');
          // Also pre-select in upload modal
          document.getElementById('uploadGame').value = params.get('game');
        }

        // Auto-open upload modal if requested
        if (params.get('upload') === 'true') {
          // Wait for auth to be ready before opening
          setTimeout(() => {
            if (currentUser) {
              openUploadModal();
            }
          }, 500);
        }

      } catch (e) {
        console.error('Error loading data:', e);
      }

      // Auth state listener
      if (auth) {
        auth.onAuthStateChanged(async (user) => {
          currentUser = user;
          if (user && user.emailVerified) {
            document.getElementById('uploadBtn').style.display = 'flex';
            currentUserInfo = await getPlayerFromRoster(user.email);
          } else {
            document.getElementById('uploadBtn').style.display = 'none';
          }
        });
      }

      // Load highlights from Firestore
      loadHighlights();

      // Filter change handlers
      document.getElementById('gameFilter').addEventListener('change', renderHighlights);
      document.getElementById('playerFilter').addEventListener('change', renderHighlights);
    });

    function populateFilters() {
      const gameFilter = document.getElementById('gameFilter');
      const playerFilter = document.getElementById('playerFilter');

      games.forEach(game => {
        if (game.opponent) {
          const opt = document.createElement('option');
          opt.value = game.id;
          opt.textContent = `vs ${game.opponent} - ${formatDate(game.date)}`;
          gameFilter.appendChild(opt);
        }
      });

      players.forEach(player => {
        const opt = document.createElement('option');
        opt.value = player.id;
        opt.textContent = `${player.firstName} #${player.number}`;
        playerFilter.appendChild(opt);
      });
    }

    function populateUploadSelects() {
      const gameSelect = document.getElementById('uploadGame');
      const playerSelect = document.getElementById('uploadPlayer');

      games.forEach(game => {
        if (game.opponent) {
          const opt = document.createElement('option');
          opt.value = game.id;
          opt.textContent = `vs ${game.opponent} - ${formatDate(game.date)}`;
          gameSelect.appendChild(opt);
        }
      });

      players.forEach(player => {
        const opt = document.createElement('option');
        opt.value = player.id;
        opt.textContent = `${player.firstName} ${player.lastName} #${player.number}`;
        playerSelect.appendChild(opt);
      });
    }

    async function loadHighlights() {
      if (!db) {
        renderHighlights();
        return;
      }

      try {
        // Real-time listener
        db.collection('highlights')
          .orderBy('timestamp', 'desc')
          .onSnapshot((snapshot) => {
            highlights = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            renderHighlights();
          });
      } catch (e) {
        console.error('Error loading highlights:', e);
        renderHighlights();
      }
    }

    function renderHighlights() {
      const container = document.getElementById('highlightsGrid');
      const gameFilter = document.getElementById('gameFilter').value;
      const playerFilter = document.getElementById('playerFilter').value;

      let filtered = highlights;

      if (gameFilter) {
        filtered = filtered.filter(h => h.gameId == gameFilter);
      }
      if (playerFilter) {
        filtered = filtered.filter(h => h.playerId == playerFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <p>No highlights yet</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">Be the first to upload a highlight!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(h => {
        const player = players.find(p => p.id == h.playerId);
        const game = games.find(g => g.id == h.gameId);
        const playerName = player ? `${player.firstName} #${player.number}` : 'Unknown';
        const gameName = game ? `vs ${game.opponent}` : '';
        const gameDate = game ? formatDate(game.date) : '';
        const isVideo = h.mediaType === 'video';
        const canDelete = currentUser && (h.uploadedBy === currentUser.uid || (currentUserInfo && currentUserInfo.isCoach));

        return `
          <div class="highlight-card">
            <div class="highlight-media" onclick="openViewer('${h.downloadUrl}', ${isVideo})">
              ${isVideo ? `
                <video src="${h.downloadUrl}" preload="metadata"></video>
                <div class="play-icon">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              ` : `
                <img src="${h.downloadUrl}" alt="Highlight">
              `}
            </div>
            <div class="highlight-info">
              <div class="highlight-meta">
                <span class="highlight-player">${playerName}</span>
                <span class="highlight-game">${gameName}</span>
              </div>
              ${h.caption ? `<div class="highlight-caption">"${h.caption}"</div>` : ''}
              <div class="highlight-footer">
                <span>${gameDate} &bull; by ${h.uploaderName || 'Unknown'}</span>
                ${canDelete ? `<button class="delete-btn" onclick="deleteHighlight('${h.id}', '${h.storagePath}')">Delete</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Upload Modal Functions
    function openUploadModal() {
      document.getElementById('uploadModal').classList.add('active');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.remove('active');
      resetUploadForm();
    }

    function resetUploadForm() {
      selectedFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('uploadGame').value = '';
      document.getElementById('uploadPlayer').value = '';
      document.getElementById('uploadCaption').value = '';
      document.getElementById('uploadSubmit').disabled = true;
      document.getElementById('progressBar').classList.remove('active');
      document.getElementById('progressFill').style.width = '0%';

      const picker = document.getElementById('filePicker');
      picker.classList.remove('has-file');
      picker.innerHTML = `
        <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFileSelect(event)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <p>Tap to select video or photo</p>
      `;
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Check file size (100MB limit)
      if (file.size > 100 * 1024 * 1024) {
        alert('File too large. Maximum size is 100MB.');
        return;
      }

      selectedFile = file;
      const picker = document.getElementById('filePicker');
      picker.classList.add('has-file');

      // Show preview
      const isVideo = file.type.startsWith('video/');
      const url = URL.createObjectURL(file);

      picker.innerHTML = `
        <input type="file" id="fileInput" accept="image/*,video/*" onchange="handleFileSelect(event)">
        ${isVideo ?
          `<video src="${url}" class="file-preview" controls></video>` :
          `<img src="${url}" class="file-preview">`
        }
        <p style="margin-top: 10px;">${file.name}</p>
      `;

      validateUploadForm();
    }

    function validateUploadForm() {
      const hasFile = selectedFile !== null;
      const hasGame = document.getElementById('uploadGame').value !== '';
      const hasPlayer = document.getElementById('uploadPlayer').value !== '';
      document.getElementById('uploadSubmit').disabled = !(hasFile && hasGame && hasPlayer);
    }

    // Add validation listeners
    document.getElementById('uploadGame').addEventListener('change', validateUploadForm);
    document.getElementById('uploadPlayer').addEventListener('change', validateUploadForm);

    async function uploadHighlight() {
      if (!currentUser || !selectedFile) return;

      const gameId = document.getElementById('uploadGame').value;
      const playerId = document.getElementById('uploadPlayer').value;
      const caption = document.getElementById('uploadCaption').value.trim();

      const submitBtn = document.getElementById('uploadSubmit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';

      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      progressBar.classList.add('active');

      try {
        // Generate unique filename
        const ext = selectedFile.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${ext}`;
        const storagePath = `highlights/${gameId}/${fileName}`;

        // Upload to Firebase Storage
        const storageRef = storage.ref(storagePath);
        const uploadTask = storageRef.put(selectedFile);

        uploadTask.on('state_changed',
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            progressFill.style.width = progress + '%';
          },
          (error) => {
            console.error('Upload error:', error);
            alert('Upload failed. Please try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Upload';
          },
          async () => {
            // Upload complete - get download URL
            const downloadUrl = await uploadTask.snapshot.ref.getDownloadURL();

            // Save metadata to Firestore
            await db.collection('highlights').add({
              gameId: parseInt(gameId),
              playerId: parseInt(playerId),
              uploadedBy: currentUser.uid,
              uploaderName: currentUserInfo ? currentUserInfo.name : 'Unknown',
              mediaType: selectedFile.type.startsWith('video/') ? 'video' : 'photo',
              storagePath: storagePath,
              downloadUrl: downloadUrl,
              caption: caption,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeUploadModal();
          }
        );
      } catch (error) {
        console.error('Error uploading:', error);
        alert('Upload failed. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload';
      }
    }

    async function deleteHighlight(docId, storagePath) {
      if (!confirm('Delete this highlight?')) return;

      try {
        // Delete from Storage
        if (storagePath) {
          await storage.ref(storagePath).delete();
        }
        // Delete from Firestore
        await db.collection('highlights').doc(docId).delete();
      } catch (error) {
        console.error('Error deleting:', error);
        alert('Could not delete highlight.');
      }
    }

    // Viewer Modal
    function openViewer(url, isVideo) {
      const modal = document.getElementById('viewerModal');
      const content = document.getElementById('viewerContent');

      if (isVideo) {
        content.innerHTML = `<video src="${url}" controls autoplay style="max-width: 100%; max-height: 90vh;"></video>`;
      } else {
        content.innerHTML = `<img src="${url}" style="max-width: 100%; max-height: 90vh;">`;
      }

      modal.classList.add('active');
    }

    function closeViewer() {
      const modal = document.getElementById('viewerModal');
      modal.classList.remove('active');
      document.getElementById('viewerContent').innerHTML = '';
    }
  </script>
</body>
</html>
