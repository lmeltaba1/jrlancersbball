<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Game Attendance - Jr. Lancers</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/lancers-logo-180.png">
  <style>
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--bg-card);
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }
    .game-header {
      background: var(--bg-card);
      color: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-accent);
    }
    .game-header h2 {
      margin: 0 0 4px 0;
      font-size: 1.1rem;
      color: var(--text-primary);
    }
    .game-header .game-meta {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .response-section {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
      border: 2px solid var(--gold);
    }
    .response-section h3 {
      margin: 0 0 16px 0;
      font-size: 1rem;
      color: var(--text-primary);
    }
    .response-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .response-btn {
      flex: 1;
      max-width: 160px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .response-btn:active {
      transform: scale(0.98);
    }
    .response-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .response-btn.yes {
      background: #22C55E;
      color: white;
    }
    .response-btn.no {
      background: #EF4444;
      color: white;
    }
    .status-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
    }
    .status-card h3 {
      margin: 0 0 12px 0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-card h3 .count {
      background: var(--bg-elevated);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-card.attending h3 {
      color: #22C55E;
    }
    .status-card.not-attending h3 {
      color: #EF4444;
    }
    .status-card.no-response h3 {
      color: #6B7280;
    }
    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .player-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-elevated);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .player-chip.highlight {
      background: var(--gold);
      color: black;
    }
    .player-chip .icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }
    .player-chip .icon.yes {
      background: #22C55E;
      color: white;
    }
    .player-chip .icon.no {
      background: #EF4444;
      color: white;
    }
    .player-chip .icon.unknown {
      background: #6B7280;
      color: white;
    }
    .empty-list {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-style: italic;
    }
    .responded-message {
      background: var(--bg-elevated);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .responded-message.attending {
      border-left: 4px solid #22C55E;
    }
    .responded-message.not-attending {
      border-left: 4px solid #EF4444;
    }
    .responded-message .change-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .login-prompt {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }
    .login-prompt p {
      margin: 0 0 16px 0;
      color: var(--text-secondary);
    }
    .login-prompt a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--gold);
      color: black;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
  <link rel="icon" type="image/png" href="images/lancers-logo-192.png">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1 style="display: flex; align-items: center; gap: 10px;">
        <a onclick="history.back()" role="button" aria-label="Go back" tabindex="0" onkeydown="if(event.key==='Enter')history.back()" style="color: white; cursor: pointer; display: flex; align-items: center;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 24px; height: 24px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <img src="images/lancers-logo.jpg" alt="Lancers" class="header-logo" width="36" height="36">
        Attendance
      </h1>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
        <div id="profileBtnWrapper" style="position: relative; display: none;">
          <button id="profileBtn" onclick="toggleProfileMenu()" aria-label="User menu" aria-haspopup="true" style="background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          <div id="profileMenu" style="display: none; position: absolute; top: 44px; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
              <div id="profileName" style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">User</div>
              <div id="profileEmail" style="font-size: 0.8rem; color: var(--text-secondary); word-break: break-all;"></div>
            </div>
            <div id="playerSwitcher" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Switch Player</div>
              <div id="playerSwitcherButtons"></div>
            </div>
            <!-- Emulate User (admin only) -->
            <div id="emulateSection" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Emulate User</div>
              <select id="emulateSelect" onchange="emulateUser(this.value)" style="width: 100%; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem;">
                <option value="">-- Select User --</option>
              </select>
            </div>
            <div style="padding: 8px;">
              <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: transparent; border: none; color: #EF4444; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Emulation Banner (shown when admin is emulating another user) -->
  <div id="emulationBanner" style="display: none; background: #7C3AED; color: white; padding: 8px 16px; text-align: center; font-size: 0.85rem; font-weight: 600;">
    <span id="emulationText">Viewing as: </span>
    <button onclick="stopEmulation()" style="background: white; color: #7C3AED; border: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; margin-left: 12px; cursor: pointer;">Stop</button>
  </div>

  <!-- Main Content -->
  <main class="main-content" id="main-content">
    <a href="schedule.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      Back to Schedule
    </a>

    <!-- Game Info -->
    <div class="game-header" id="gameHeader">
      <h2>Loading...</h2>
    </div>

    <!-- Login Prompt (shown if not logged in) -->
    <div id="loginPrompt" class="login-prompt" style="display: none;">
      <p>Sign in to respond to game attendance</p>
      <a href="login.html">Sign In</a>
    </div>

    <!-- Response Section (shown if logged in and hasn't responded) -->
    <div id="responseSection" class="response-section" style="display: none;">
      <h3>Will <span id="playerNameResponse">your player</span> attend this game?</h3>
      <div class="response-buttons">
        <button class="response-btn yes" onclick="respond(true)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Yes, attending
        </button>
        <button class="response-btn no" onclick="respond(false)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Can't make it
        </button>
      </div>
    </div>

    <!-- Responded Message (shown if already responded) -->
    <div id="respondedMessage" class="responded-message" style="display: none;">
      <span id="respondedIcon"></span>
      <span id="respondedText"></span>
      <button class="change-btn" onclick="showResponseSection()">Change</button>
    </div>

    <!-- Status Cards -->
    <div id="statusCards">
      <!-- Skeleton Loading -->
      <div id="attendance-skeleton">
        <div class="skeleton skeleton-card" style="height: 100px;"></div>
        <div class="skeleton skeleton-card" style="height: 80px;"></div>
        <div class="skeleton skeleton-card" style="height: 80px;"></div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      const menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(() => { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayersArr, currentPlayerId) {
      if (!allPlayersArr || allPlayersArr.length <= 1) return;
      const switcher = document.getElementById('playerSwitcher');
      const buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayersArr.map(p => {
        const isActive = p.id === currentPlayerId;
        return `<button onclick="switchPlayer(${p.id})" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ${isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)'}; color: ${isActive ? '#000' : 'var(--text-primary)'}; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ${isActive ? '600' : '400'};">#${p.number} ${p.firstName}</button>`;
      }).join('');
    }
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('profileBtnWrapper');
      const menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      const select = document.getElementById('emulateSelect');
      if (!select) return;
      const users = await getAllRosterUsers();
      const currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(u => {
          const selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return `<option value="${u.email}" ${selected ? 'selected' : ''}>${u.name} (${u.role}${u.player ? ' - ' + u.player : ''})</option>`;
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      const banner = document.getElementById('emulationBanner');
      const text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    // Get game ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    // leagueNames is defined in app.js

    // State
    let currentGame = null;
    let currentPlayerId = null;
    let currentPlayerName = null;
    let currentUserEmail = null;
    let allPlayers = [];
    let attendanceData = {}; // playerId -> {attending, playerName, respondedBy}
    let attendanceLoaded = false;
    let unsubscribe = null;

    // Helper functions - loadSchedule(), loadRoster(), formatDate(), leagueNames defined in app.js

    // Load game info and roster
    async function loadData() {
      const [scheduleData, rosterData] = await Promise.all([
        loadSchedule(),
        loadRoster()
      ]);

      // Find game or event
      currentGame = scheduleData.games.find(g => g.id == gameId);
      let isEvent = false;

      if (!currentGame && scheduleData.events) {
        currentGame = scheduleData.events.find(e => e.id == gameId);
        isEvent = true;
      }

      if (!currentGame) {
        document.getElementById('gameHeader').innerHTML = '<h2>Event not found</h2>';
        document.getElementById('statusCards').innerHTML = '';
        return;
      }

      // Update header
      const dateInfo = formatDate(currentGame.date);
      let title, leagueBadge;

      if (isEvent) {
        title = currentGame.name || 'Practice';
        const eventType = currentGame.type === 'practice' ? 'Practice' : 'Event';
        leagueBadge = `<span class="league-badge" style="font-size: 0.7rem; margin-left: 8px; background: #22C55E;">${eventType}</span>`;
      } else {
        title = `vs ${currentGame.opponent}`;
        leagueBadge = `<span class="league-badge ${currentGame.league}" style="font-size: 0.7rem; margin-left: 8px;">${leagueNames[currentGame.league]}</span>`;
      }

      document.getElementById('gameHeader').innerHTML = `
        <h2>${title} ${leagueBadge}</h2>
        <div class="game-meta">${dateInfo.full} at ${currentGame.time}</div>
      `;

      // Store all players
      allPlayers = rosterData.players || [];

      // Setup real-time listener for attendance
      setupAttendanceListener();
    }

    // Setup Firestore real-time listener
    function setupAttendanceListener() {
      if (!db || !gameId) {
        renderStatusCards();
        return;
      }

      // Listen for all attendance docs for this game
      unsubscribe = db.collection('attendance')
        .where('gameId', '==', parseInt(gameId))
        .onSnapshot((snapshot) => {
          attendanceData = {};
          snapshot.forEach(doc => {
            const data = doc.data();
            attendanceData[data.playerId] = {
              attending: data.attending,
              playerName: data.playerName,
              respondedBy: data.respondedBy
            };
          });
          attendanceLoaded = true;
          renderStatusCards();
          updateResponseSection();
        }, (error) => {
          console.error('Error listening to attendance:', error);
          renderStatusCards();
        });
    }

    // Render the three status cards
    function renderStatusCards() {
      const attending = [];
      const notAttending = [];
      const noResponse = [];

      allPlayers.forEach(player => {
        const response = attendanceData[player.id];
        const playerName = player.firstName + ' ' + player.lastName.charAt(0) + '.';
        const isCurrentPlayer = player.id == currentPlayerId;

        if (response) {
          if (response.attending) {
            attending.push({ name: playerName, highlight: isCurrentPlayer });
          } else {
            notAttending.push({ name: playerName, highlight: isCurrentPlayer });
          }
        } else {
          noResponse.push({ name: playerName, highlight: isCurrentPlayer });
        }
      });

      let html = '';

      // Attending card
      html += `
        <div class="status-card attending">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Attending
            <span class="count">${attending.length}</span>
          </h3>
          <div class="player-list" id="attendingList">
            ${attending.length === 0 ? '<span class="empty-list">No responses yet</span>' :
              attending.map(p => `
                <div class="player-chip ${p.highlight ? 'highlight' : ''}">
                  <span class="icon yes">&#10003;</span>
                  ${p.name}
                </div>
              `).join('')}
          </div>
        </div>
      `;

      // Not Attending card
      html += `
        <div class="status-card not-attending">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="3">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Not Attending
            <span class="count">${notAttending.length}</span>
          </h3>
          <div class="player-list" id="notAttendingList">
            ${notAttending.length === 0 ? '<span class="empty-list">None</span>' :
              notAttending.map(p => `
                <div class="player-chip ${p.highlight ? 'highlight' : ''}">
                  <span class="icon no">&#10007;</span>
                  ${p.name}
                </div>
              `).join('')}
          </div>
        </div>
      `;

      // No Response card
      html += `
        <div class="status-card no-response">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            No Response
            <span class="count">${noResponse.length}</span>
          </h3>
          <div class="player-list" id="noResponseList">
            ${noResponse.length === 0 ? '<span class="empty-list">Everyone has responded!</span>' :
              noResponse.map(p => `
                <div class="player-chip ${p.highlight ? 'highlight' : ''}">
                  <span class="icon unknown">?</span>
                  ${p.name}
                </div>
              `).join('')}
          </div>
        </div>
      `;

      document.getElementById('statusCards').innerHTML = html;
    }

    // Update response section based on current player's response
    function updateResponseSection() {
      if (!currentPlayerId || !attendanceLoaded) return;

      const response = attendanceData[currentPlayerId];
      const responseSection = document.getElementById('responseSection');
      const respondedMessage = document.getElementById('respondedMessage');

      if (response) {
        // Already responded - show message
        responseSection.style.display = 'none';
        respondedMessage.style.display = 'flex';
        respondedMessage.className = 'responded-message ' + (response.attending ? 'attending' : 'not-attending');

        document.getElementById('respondedIcon').innerHTML = response.attending ?
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>' :
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

        document.getElementById('respondedText').textContent = response.attending ?
          `${currentPlayerName} is attending` :
          `${currentPlayerName} is not attending`;
      } else {
        // Not responded - show response section
        responseSection.style.display = 'block';
        respondedMessage.style.display = 'none';
      }
    }

    // Show response section (when user clicks "Change")
    function showResponseSection() {
      document.getElementById('responseSection').style.display = 'block';
      document.getElementById('respondedMessage').style.display = 'none';
      // Re-enable buttons in case they were disabled
      const buttons = document.querySelectorAll('.response-btn');
      buttons.forEach(btn => btn.disabled = false);
    }

    // Submit response
    async function respond(attending) {
      if (!db || !currentPlayerId || !currentPlayerName || !currentUserEmail) {
        showToast('Unable to save response. Please try again.', 'error');
        return;
      }

      // Disable buttons while saving
      const buttons = document.querySelectorAll('.response-btn');
      buttons.forEach(btn => btn.disabled = true);

      try {
        const docId = `${gameId}_${currentPlayerId}`;
        await db.collection('attendance').doc(docId).set({
          gameId: parseInt(gameId),
          playerId: currentPlayerId,
          playerName: currentPlayerName,
          attending: attending,
          respondedBy: currentUserEmail,
          respondedAt: getFirestoreTimestamp()
        });

        // Response will be updated via the real-time listener
      } catch (error) {
        console.error('Error saving response:', error);
        showToast('Error saving response. Please try again.', 'error');
        buttons.forEach(btn => btn.disabled = false);
      }
    }

    // Require auth - viewers can't access attendance (they can't sign up)
    requireAuth({ requireParent: true }).then(async function(info) {
      currentUserEmail = auth.currentUser.email;

      // Show profile button
      const profileWrapper = document.getElementById('profileBtnWrapper');
      if (profileWrapper) profileWrapper.style.display = 'block';
      document.getElementById('profileName').textContent = info.name || 'User';
      document.getElementById('profileEmail').textContent = auth.currentUser.email;
      if (info.allPlayers && info.allPlayers.length > 1) {
        populatePlayerSwitcher(info.allPlayers, info.player ? info.player.id : null);
      }
      // Show emulation controls for admin
      if (info.isRealAdmin) {
        const emulateSection = document.getElementById('emulateSection');
        if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
      }
      if (info.isEmulating) { showEmulationBanner(info.emulatedEmail); }

      // Load data only after auth confirmed
      loadData();

      if (info && info.player) {
        currentPlayerId = info.player.id;
        currentPlayerName = info.playerName;

        // Update response section with player name
        document.getElementById('playerNameResponse').textContent = info.player.firstName;

        // Show response section
        document.getElementById('loginPrompt').style.display = 'none';
        updateResponseSection();
      } else {
        // Coach without player
        document.getElementById('loginPrompt').style.display = 'none';
      }
    }).catch(function(err) {
      console.log('Auth required:', err);
    });

    // Cleanup listener on page unload
    window.addEventListener('beforeunload', () => {
      if (unsubscribe) unsubscribe();
    });
  </script>
</body>
</html>
