<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Team Chat - Jr. Lancers</title>
  <link rel="stylesheet" href="css/athletic.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .chat-main {
      padding: 16px;
      padding-bottom: 140px;
    }
    .chat-input-fixed {
      position: fixed;
      bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 576px;
      display: flex;
      gap: 10px;
      background: var(--bg-elevated);
      padding: 10px;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      z-index: 100;
    }
    .chat-input-fixed input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      font-size: 16px;
      outline: none;
      background-color: var(--bg-body);
      color: var(--text-primary);
      -webkit-appearance: none;
      appearance: none;
    }
    .chat-input-fixed input::placeholder {
      color: var(--text-muted);
    }
    .chat-input-fixed input:focus {
      border-color: var(--lancers-gold);
    }
    .chat-input-fixed button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--lancers-gold);
      color: black;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .chat-message.sent {
      align-self: flex-end;
      background: var(--lancers-gold);
      color: black;
      border-bottom-right-radius: 4px;
    }
    .chat-message.received {
      align-self: flex-start;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .chat-message .sender {
      font-weight: 700;
      font-size: 0.75rem;
      margin-bottom: 4px;
      color: var(--lancers-gold);
    }
    .chat-message.sent .sender {
      color: rgba(0,0,0,0.6);
    }
    .chat-message .time {
      font-size: 0.7rem;
      margin-top: 4px;
      opacity: 0.6;
    }
    .date-divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .unread-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      color: var(--lancers-gold);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .unread-divider::before,
    .unread-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--lancers-gold);
    }
  </style>
  <link rel="icon" type="image/png" href="images/lancers-logo-192.png">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <h1>
        <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <img src="images/lancers-logo.jpg?v=2" alt="Lancers" class="header-logo" width="36" height="36">
          Team Chat
        </a>
      </h1>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
        <div id="profileBtnWrapper" style="position: relative; display: none;">
          <button id="profileBtn" onclick="toggleProfileMenu()" style="background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 20px; height: 20px; color: var(--text-primary);">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </button>
          <div id="profileMenu" style="display: none; position: absolute; top: 44px; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; min-width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000;">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color);">
              <div id="profileName" style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">User</div>
              <div id="profileEmail" style="font-size: 0.8rem; color: var(--text-secondary); word-break: break-all;"></div>
            </div>
            <div id="playerSwitcher" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Switch Player</div>
              <div id="playerSwitcherButtons"></div>
            </div>
            <!-- Emulate User (admin only) -->
            <div id="emulateSection" style="display: none; padding: 12px; border-bottom: 1px solid var(--border-color);">
              <div style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">Emulate User</div>
              <select id="emulateSelect" onchange="emulateUser(this.value)" style="width: 100%; padding: 10px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.85rem;">
                <option value="">-- Select User --</option>
              </select>
            </div>
            <div style="padding: 8px;">
              <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: transparent; border: none; color: #EF4444; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 18px; height: 18px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Emulation Banner (shown when admin is emulating another user) -->
  <div id="emulationBanner" style="display: none; background: #7C3AED; color: white; padding: 8px 16px; text-align: center; font-size: 0.85rem; font-weight: 600;">
    <span id="emulationText">Viewing as: </span>
    <button onclick="stopEmulation()" style="background: white; color: #7C3AED; border: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; margin-left: 12px; cursor: pointer;">Stop</button>
  </div>

  <!-- Main Content -->
  <main class="main-content chat-main">
    <!-- Loading state -->
    <div id="loadingState">
      <div class="skeleton skeleton-card" style="height: 60px;"></div>
      <div class="skeleton skeleton-card" style="height: 60px;"></div>
      <div class="skeleton skeleton-card" style="height: 60px;"></div>
      <div class="skeleton skeleton-card" style="height: 60px;"></div>
    </div>

    <!-- Auth required prompt -->
    <div id="authRequired" class="card" style="display: none;">
      <h2 class="card-title">Sign In Required</h2>
      <p style="margin-bottom: 16px; color: var(--text-secondary);">You need to sign in to access Team Chat.</p>
      <a href="login.html" class="btn btn-primary" style="width: 100%; display: block; text-align: center;">Sign In</a>
    </div>

    <!-- Chat container -->
    <div id="chatContainer" style="display: none;">
      <div style="background: var(--bg-elevated); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px;">
        <span style="font-size: 0.85rem; color: var(--text-secondary);">Chatting as: <strong id="chatUserName" style="color: var(--lancers-gold);"></strong></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </main>

  <!-- Fixed Input -->
  <div class="chat-input-fixed" id="chatInputContainer" style="display: none;">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button id="sendBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js" defer></script>
  <script src="js/firebase-config.js"></script>

  <script src="js/app.js?v=3"></script>
  <script>
    // Profile menu functions
    function toggleProfileMenu() {
      var menu = document.getElementById('profileMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function handleLogout() {
      auth.signOut().then(function() { window.location.href = 'login.html'; });
    }
    function switchPlayer(playerId) {
      localStorage.setItem('selectedPlayerId', playerId);
      window.location.reload();
    }
    function populatePlayerSwitcher(allPlayersArr, currentPlayerId) {
      if (!allPlayersArr || allPlayersArr.length <= 1) return;
      var switcher = document.getElementById('playerSwitcher');
      var buttons = document.getElementById('playerSwitcherButtons');
      if (!switcher || !buttons) return;
      switcher.style.display = 'block';
      buttons.innerHTML = allPlayersArr.map(function(p) {
        var isActive = p.id === currentPlayerId;
        return '<button onclick="switchPlayer(' + p.id + ')" style="width: 100%; padding: 8px; margin-bottom: 4px; background: ' + (isActive ? 'var(--lancers-gold)' : 'var(--bg-elevated)') + '; color: ' + (isActive ? '#000' : 'var(--text-primary)') + '; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: ' + (isActive ? '600' : '400') + ';">#' + p.number + ' ' + p.firstName + '</button>';
      }).join('');
    }
    document.addEventListener('click', function(e) {
      var wrapper = document.getElementById('profileBtnWrapper');
      var menu = document.getElementById('profileMenu');
      if (wrapper && menu && !wrapper.contains(e.target)) menu.style.display = 'none';
    });

    // Emulation functions (admin only)
    async function populateEmulateDropdown() {
      var select = document.getElementById('emulateSelect');
      if (!select) return;
      var users = await getAllRosterUsers();
      var currentEmulated = getEmulatedEmail();
      select.innerHTML = '<option value="">-- Select User --</option>' +
        users.map(function(u) {
          var selected = currentEmulated && currentEmulated.toLowerCase() === u.email.toLowerCase();
          return '<option value="' + u.email + '" ' + (selected ? 'selected' : '') + '>' + u.name + ' (' + u.role + (u.player ? ' - ' + u.player : '') + ')</option>';
        }).join('');
    }
    function emulateUser(email) {
      if (!email) { clearEmulation(); } else { setEmulatedEmail(email); }
      window.location.reload();
    }
    function stopEmulation() { clearEmulation(); window.location.reload(); }
    function showEmulationBanner(emulatedEmail) {
      var banner = document.getElementById('emulationBanner');
      var text = document.getElementById('emulationText');
      if (banner && text) { text.textContent = 'Viewing as: ' + emulatedEmail; banner.style.display = 'block'; }
    }

    var currentUser = null;
    var currentUserInfo = null;
    var displayName = '';
    var lastReadMessageId = null;
    var initialLoadComplete = false;
    var unreadDividerAdded = false;
    var lastDateShown = null;
    var unsubscribeMessages = null;

    // Loading timeout - show reload link if loading takes too long
    var loadingTimeout = setTimeout(function() {
      var loadingState = document.getElementById('loadingState');
      if (loadingState && loadingState.style.display !== 'none') {
        loadingState.innerHTML = '<div class="card" style="text-align: center; padding: 20px; color: var(--text-secondary);">Loading is taking longer than expected.<br><a href="javascript:location.reload()" style="color: var(--gold);">Tap to reload</a></div>';
      }
    }, 8000);

    function formatTime(timestamp) {
      if (!timestamp) return '';
      var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateLabel(timestamp) {
      if (!timestamp) return '';
      var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      var today = new Date();
      var yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      var dateOnly = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      var todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      var yesterdayOnly = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());

      if (dateOnly.getTime() === todayOnly.getTime()) {
        return 'Today';
      } else if (dateOnly.getTime() === yesterdayOnly.getTime()) {
        return 'Yesterday';
      } else {
        return date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      }
    }

    function getDateKey(timestamp) {
      if (!timestamp) return '';
      var date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      return date.toDateString();
    }

    function addDateDivider(label) {
      var div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = label;
      document.getElementById('chatMessages').appendChild(div);
    }

    function addMessage(messageId, text, sender, timestamp, isOwn, shouldScroll) {
      var chatMessages = document.getElementById('chatMessages');

      var dateKey = getDateKey(timestamp);
      if (dateKey && dateKey !== lastDateShown) {
        addDateDivider(formatDateLabel(timestamp));
        lastDateShown = dateKey;
      }

      var div = document.createElement('div');
      div.className = 'chat-message ' + (isOwn ? 'sent' : 'received');
      div.setAttribute('data-message-id', messageId);

      var content = '';
      if (!isOwn) {
        content += '<div class="sender">' + escapeHtml(sender) + '</div>';
      }
      content += '<div>' + escapeHtml(text) + '</div>';
      content += '<div class="time">' + formatTime(timestamp) + '</div>';
      div.innerHTML = content;
      chatMessages.appendChild(div);

      if (shouldScroll) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function addUnreadDivider() {
      if (unreadDividerAdded) return;
      var div = document.createElement('div');
      div.className = 'unread-divider';
      div.id = 'unreadDivider';
      div.textContent = 'New Messages';
      document.getElementById('chatMessages').appendChild(div);
      unreadDividerAdded = true;
    }

    async function getLastReadMessageId() {
      if (!currentUser || !db) return null;
      try {
        var doc = await db.collection('chatReadStatus').doc(currentUser.uid).get();
        if (doc.exists) {
          return doc.data().lastReadMessageId;
        }
      } catch (e) {
        console.error('Error getting last read:', e);
      }
      return null;
    }

    async function saveLastReadMessageId(messageId) {
      if (!currentUser || !db || !messageId) return;
      try {
        await db.collection('chatReadStatus').doc(currentUser.uid).set({
          lastReadMessageId: messageId,
          lastReadAt: getFirestoreTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error('Error saving last read:', e);
      }
    }

    function sendMessage() {
      var text = document.getElementById('messageInput').value.trim();
      if (!text || !currentUser || !db) return;

      // Message length limit
      if (text.length > 500) {
        showToast('Message is too long (max 500 characters)', 'warning');
        return;
      }

      db.collection('messages').add({
        text: text,
        senderName: displayName,
        senderEmail: currentUser.email,
        uid: currentUser.uid,
        timestamp: getFirestoreTimestamp()
      }).then(function() {
        document.getElementById('messageInput').value = '';
      }).catch(function(e) {
        showToast('Error sending: ' + e.message, 'error');
      });
    }

    // Check auth - require parent/coach (viewers can't access chat)
    requireAuth({ requireParent: true }).then(async function(userInfo) {
      currentUser = auth.currentUser;
      currentUserInfo = userInfo;

      // Show profile button
      var profileWrapper = document.getElementById('profileBtnWrapper');
      if (profileWrapper) profileWrapper.style.display = 'block';
      document.getElementById('profileName').textContent = userInfo.name || 'User';
      document.getElementById('profileEmail').textContent = auth.currentUser.email;
      if (userInfo.allPlayers && userInfo.allPlayers.length > 1) {
        populatePlayerSwitcher(userInfo.allPlayers, userInfo.player ? userInfo.player.id : null);
      }
      // Show emulation controls for admin
      if (userInfo.isRealAdmin) {
        var emulateSection = document.getElementById('emulateSection');
        if (emulateSection) { emulateSection.style.display = 'block'; populateEmulateDropdown(); }
      }
      if (userInfo.isEmulating) { showEmulationBanner(userInfo.emulatedEmail); }

      displayName = currentUserInfo.isCoach
        ? 'Coach ' + currentUserInfo.name.split(' ')[0]
        : currentUserInfo.name || currentUserInfo.parent?.name || currentUser.email.split('@')[0];

      document.getElementById('chatUserName').textContent = displayName;
      clearTimeout(loadingTimeout);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'block';
      document.getElementById('chatInputContainer').style.display = 'flex';

      lastReadMessageId = await getLastReadMessageId();

      if (db) {
        var isFirstSnapshot = true;
        var latestMessageId = null;
        var foundLastRead = false;

        unsubscribeMessages = db.collection('messages').orderBy('timestamp', 'asc').onSnapshot(function(snapshot) {
          var chatMessages = document.getElementById('chatMessages');

          snapshot.docChanges().forEach(function(change) {
            if (change.type === 'added') {
              var msg = change.doc.data();
              var messageId = change.doc.id;
              var isOwn = msg.uid === currentUser.uid;
              latestMessageId = messageId;

              if (isFirstSnapshot && lastReadMessageId && foundLastRead && !unreadDividerAdded) {
                addUnreadDivider();
              }

              if (messageId === lastReadMessageId) {
                foundLastRead = true;
              }

              var shouldScroll = !isFirstSnapshot;
              addMessage(messageId, msg.text, msg.senderName, msg.timestamp, isOwn, shouldScroll);
            }
          });

          if (isFirstSnapshot) {
            isFirstSnapshot = false;
            initialLoadComplete = true;

            var divider = document.getElementById('unreadDivider');
            if (divider) {
              divider.scrollIntoView({ behavior: 'auto', block: 'start' });
            } else if (lastReadMessageId) {
              var lastReadEl = chatMessages.querySelector('[data-message-id="' + lastReadMessageId + '"]');
              if (lastReadEl) {
                lastReadEl.scrollIntoView({ behavior: 'auto', block: 'start' });
              } else {
                chatMessages.scrollTop = chatMessages.scrollHeight;
              }
            } else {
              chatMessages.scrollTop = chatMessages.scrollHeight;
            }
          }

          if (latestMessageId) {
            saveLastReadMessageId(latestMessageId);
          }
        }, function(error) {
          // Error callback - show user feedback instead of silent failure
          console.error('Chat listener error:', error);
          var chatMessages = document.getElementById('chatMessages');
          chatMessages.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">Failed to load chat. Please reload the page.</div>';
        });
      }
    }).catch(function(err) {
      console.log('Auth required:', err);
      clearTimeout(loadingTimeout);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('authRequired').style.display = 'block';
    });

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    document.getElementById('messageInput').addEventListener('focus', function() {
      setTimeout(function() {
        var chatMessages = document.getElementById('chatMessages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 300);
    });

    // Cleanup listener to prevent memory leaks
    function cleanupListener() {
      if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
    }
    window.addEventListener('beforeunload', cleanupListener);
    window.addEventListener('pagehide', cleanupListener);
  </script>
</body>
</html>
